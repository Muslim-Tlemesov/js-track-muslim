let cachedEnglishVoice = null;
let voiceSearchAttempted = false;

/**
 * Ищет лучший доступный английский голос среди системных — сначала
 * специально помеченные "естественные"/облачные голоса (обычно куда
 * менее роботизированные, чем локальный голос по умолчанию), потом
 * любой en-US/en-GB, и только в крайнем случае — что найдётся с en.
 */
function pickBestEnglishVoice() {
  if (typeof window === "undefined" || !window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;
  const byPriority = [
    (v) => /google/i.test(v.name) && /en-US|en_US/i.test(v.lang + v.name),
    (v) => /natural|neural|enhanced|premium/i.test(v.name) && /^en/i.test(v.lang),
    (v) => v.localService === false && /^en/i.test(v.lang),
    (v) => /^en-US$/i.test(v.lang),
    (v) => /^en-GB$/i.test(v.lang),
    (v) => /^en/i.test(v.lang),
  ];
  for (const test of byPriority) {
    const found = voices.find(test);
    if (found) return found;
  }
  return null;
}

/**
 * Проговаривает переданный текст английским голосом. Голос ищется один
 * раз и кэшируется — getVoices() у части браузеров грузит список
 * асинхронно, поэтому если список ещё пуст при самом первом вызове,
 * подписываемся на voiceschanged и пробуем снова.
 */
function speakTerm(text) {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  window.speechSynthesis.cancel(); // прерываем предыдущую озвучку, если ещё не закончилась
  const utter = new window.SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.92; // чуть медленнее обычного — термин легче разобрать на слух
  utter.pitch = 1;
  if (!cachedEnglishVoice && !voiceSearchAttempted) {
    cachedEnglishVoice = pickBestEnglishVoice();
    if (!cachedEnglishVoice && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.addEventListener(
        "voiceschanged",
        () => { cachedEnglishVoice = pickBestEnglishVoice(); },
        { once: true }
      );
    }
    voiceSearchAttempted = true;
  }
  if (cachedEnglishVoice) utter.voice = cachedEnglishVoice;
  window.speechSynthesis.speak(utter);
}

function playCorrectTick(soundEnabled = true) {
  if (!soundEnabled) return;
  if (typeof document !== "undefined" && document.hidden) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const baseFreq = 880; // A5
    const detune = 1 + (Math.random() - 0.5) * 0.06; // ±3% — едва заметная случайная вариация
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = baseFreq * detune;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.11, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
    setTimeout(() => ctx.close(), 300);
  } catch {
    // Web Audio недоступен — молча пропускаем звук.
  }
}

function playVictoryChime(soundEnabled = true) {
  if (!soundEnabled) return;
  // Вкладка свёрнута/не в фокусе — не пытаемся играть звук: часть браузеров
  // всё равно приглушат/отложат его, а часть — воспроизведут неожиданно
  // для пользователя, который уже переключился на другую вкладку.
  if (typeof document !== "undefined" && document.hidden) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = now + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.15, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
    setTimeout(() => ctx.close(), 900);
  } catch {
    // Web Audio недоступен — молча пропускаем звук.
  }
}

/**
 * Более торжественная фанфара для открытия целого УРОВНЯ сложности —
 * событие крупнее, чем прохождение одной темы, поэтому звук чуть
 * длиннее и богаче (5 нот вместо 3, плюс финальный аккорд), а не
 * просто повтор playVictoryChime погромче.
 */
function playLevelUnlockFanfare(soundEnabled = true) {
  if (!soundEnabled) return;
  if (typeof document !== "undefined" && document.hidden) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6 — восходящая линия
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = now + i * 0.1;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.16, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.45);
    });
    // финальный аккорд — все три ноты трезвучия разом, чуть дольше
    const chordStart = now + notes.length * 0.1 + 0.05;
    [523.25, 659.25, 783.99].forEach((freq) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, chordStart);
      gain.gain.linearRampToValueAtTime(0.12, chordStart + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, chordStart + 0.7);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(chordStart);
      osc.stop(chordStart + 0.75);
    });
    setTimeout(() => ctx.close(), 1600);
  } catch {
    // Web Audio недоступен — молча пропускаем звук.
  }
}

const Celebration = memo(function Celebration({ active, count = 50 }) {
  const [mounted, setMounted] = useState(false);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    if (!active) {
      setMounted(false);
      setVisible(false);
      return;
    }
    const timer1 = setTimeout(() => setMounted(true), 100);
    const timer2 = setTimeout(() => setVisible(true), 300);
    return () => {
      clearTimeout(timer1);
      clearTimeout(timer2);
    };
  }, [active]);

  const pieces = useMemo(() => {
    const colors = [
      "#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#9B59B6",
      "#FF8A5C", "#A29BFE", "#FD79A8", "#00CEC9", "#FDCB6E",
    ];
    return Array.from({ length: count }, (_, i) => ({
      id: i,
      color: colors[i % colors.length],
      left: Math.random() * 100,
      delay: Math.random() * 2,
      duration: 2 + Math.random() * 2,
      size: 6 + Math.random() * 8,
      rotate: 360 + Math.random() * 360,
      drift: -40 + Math.random() * 80,
    }));
  }, [active, count]);

  if (!active || !mounted) return null;

  return (
    <>
      <style>{`
        @keyframes confetti-fall {
          0% { transform: translate(0, -10vh) rotate(0deg) scale(0.8); opacity: 1; }
          70% { opacity: 1; }
          100% { transform: translate(var(--drift), 110vh) rotate(var(--rotate)) scale(0.2); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .celebration-piece { animation: none !important; opacity: 0 !important; }
          .celebration-container { display: none !important; }
        }
      `}</style>

      <div
        className="celebration-container"
        style={{
          position: "fixed",
          inset: 0,
          pointerEvents: "none",
          zIndex: 9999,
          overflow: "hidden",
          opacity: visible ? 1 : 0,
          transition: "opacity 0.5s ease",
        }}
      >
        {pieces.map((p) => (
          <div
            key={p.id}
            className="celebration-piece"
            style={{
              position: "absolute",
              top: -20,
              left: `${p.left}%`,
              width: p.size,
              height: p.size * 0.4,
              background: p.color,
              borderRadius: 2,
              opacity: 0,
              "--drift": `${p.drift}px`,
              "--rotate": `${p.rotate}deg`,
              animation: `confetti-fall ${p.duration}s ease-in ${p.delay}s forwards`,
            }}
          />
        ))}
      </div>
    </>
  );
});

/* ============================================================
   АДАПТИВНАЯ ЭСКАЛАЦИЯ ОБЪЯСНЕНИЙ
   ============================================================
   Идея: если человек ошибается в одном и том же вопросе НЕСКОЛЬКО
   раз подряд, значит текущий способ объяснения (текст) явно не
   заходит — и вместо того, чтобы просто повторить тот же текст
   ещё раз, приложение переключает КАНАЛ восприятия:
     попытка 1-2 — обычный текст (why.wrong/byOption, как и раньше)
     попытка 3    — жизненная аналогия
     попытка 4+   — маленькое интерактивное упражнение
   (используется тот же счётчик attempts, что уже существовал для
   показа решения кода после 2 попыток — не завели отдельный, чтобы
   не плодить параллельные системы подсчёта одного и того же).

   ЧЕСТНОСТЬ ЭСКАЛАЦИИ: контент написан вручную не для всех тегов —
   только там, где аналогия реально помогает понять суть (map, Promise,
   деструктуризация и т.д.). Для более механических/API-шных тем
   (querySelector, addEventListener, confirm, console.log — это уже
   само по себе конкретные факты, а не абстракции) аналогии сознательно
   нет: ESCALATION_CONTENT просто не содержит запись для этого тега,
   и эскалация тихо не показывается — вместо выдумывания натянутой
   аналогии, которая объяснила бы хуже, чем уже имеющийся текст.
   ============================================================ */

/**
 * Ищет контент эскалации для первого тега вопроса, у которого он
 * действительно есть (у вопроса может быть 2 тега — например,
 * ["map", "forEach"] — берём первый покрытый).
 * @param {string[]} tags
 */
function findEscalationContent(tags) {
  for (const tag of tags || []) {
    if (ESCALATION_CONTENT[tag]) return { tag, ...ESCALATION_CONTENT[tag] };
  }
  return null;
}

/**
 * Маленькое интерактивное упражнение — последняя ступень эскалации.
 * Не связано с XP/прогрессом курса, чисто закрепляющее: выбрал —
 * сразу увидел, верно или нет, и короткое объяснение почему.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {{prompt: string, options: string[], correct: number, explain: string}} props.exercise
 */
const EscalationExercise = memo(function EscalationExercise({ T, exercise }) {
  const [picked, setPicked] = useState(null);
  return (
    <div style={{ marginTop: 10 }}>
      <pre className="mono" style={{ background: T.console, color: T.consoleText, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6, margin: "0 0 8px", whiteSpace: "pre-wrap" }}>
        {exercise.prompt}
      </pre>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {exercise.options.map((opt, i) => {
          const isPicked = picked === i;
          const showState = picked !== null;
          const isRight = i === exercise.correct;
          return (
            <button
              key={i}
              onClick={() => setPicked(i)}
              disabled={picked !== null}
              style={{
                textAlign: "left", padding: "8px 12px", borderRadius: 8, fontSize: 13,
                cursor: picked !== null ? "default" : "pointer",
                background: showState && isRight ? `${T.success}22` : showState && isPicked ? `${T.error}22` : T.surfaceAlt,
                border: `1px solid ${showState && isRight ? T.success : showState && isPicked ? T.error : T.border}`,
                color: T.text, display: "flex", alignItems: "center", gap: 8,
              }}
            >
              {showState && isRight && <Check size={13} strokeWidth={3} style={{ color: T.success, flexShrink: 0 }} />}
              {showState && isPicked && !isRight && <XCircle size={13} strokeWidth={2.2} style={{ color: T.error, flexShrink: 0 }} />}
              <span className="mono">{opt}</span>
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div style={{ fontSize: 12.5, color: T.textDim, marginTop: 8, lineHeight: 1.5 }}>{exercise.explain}</div>
      )}
    </div>
  );
});

/**
 * Блок адаптивной эскалации объяснения: показывается только когда
 * человек уже ошибся несколько раз подряд в ОДНОМ И ТОМ ЖЕ вопросе —
 * и только если для тега этого вопроса реально есть написанный
 * контент (см. ESCALATION_CONTENT). Ничего не выдумывает и не
 * показывает заглушки, если контента для тега нет.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {number} props.attemptCount
 * @param {string[]} props.tags
 */
const EscalationHelper = memo(function EscalationHelper({ T, attemptCount, tags }) {
  const content = useMemo(() => findEscalationContent(tags), [tags]);
  if (!content || attemptCount < 3) return null;
  const showExercise = attemptCount >= 4;
  return (
    <div style={{ marginTop: 12, background: `${T.accent}0D`, border: `1px solid ${T.accent}44`, borderRadius: 10, padding: 14 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: T.accent, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
        💡 Похоже, текст не заходит — попробуем иначе
      </div>
      <div style={{ fontSize: 13.5, lineHeight: 1.6, color: T.text }}>{content.analogy}</div>
      {showExercise && <EscalationExercise T={T} exercise={content.exercise} />}
    </div>
  );
});

/**
 * Баннер-рекомендация, который появляется сразу после того, как тема
 * пройдена полностью (все вопросы отвечены) и в ней была хотя бы одна
 * ошибка. Показывает не саму тему целиком, а конкретные концепты-теги
 * (например, Promise, map, hoisting), где ошибок было больше всего —
 * см. вычисление recommendation.items в App(). «Повторить эти вопросы»
 * запускает обычный режим повторения (reviewQueue), но только с теми
 * вопросами, что относятся к рекомендованным тегам этой темы.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {{topicId: string, topicTitle: string, items: Array<{tag:string, wrong:number, total:number}>, questions: Array}} props.recommendation
 * @param {() => void} props.onReview
 * @param {() => void} props.onDismiss
 */
const TopicRecommendationCard = memo(function TopicRecommendationCard({ T, recommendation, onReview, onDismiss }) {
  const { topicTitle, items, questions } = recommendation;
  return (
    <div
      style={{
        background: `${T.accent}0D`, border: `1.5px solid ${T.accent}55`, borderRadius: 12,
        padding: 18, marginBottom: 16,
      }}
    >
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 700, marginBottom: 4, color: T.text }}>
        📊 Тема «{topicTitle}» пройдена
      </div>
      <div style={{ fontSize: 13.5, color: T.textDim, marginBottom: 12 }}>
        Судя по твоим ошибкам, стоит повторить:
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {items.map((it) => (
          <div
            key={it.tag}
            style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8,
              padding: "8px 12px", fontSize: 13.5,
            }}
          >
            <span style={{ fontWeight: 600, color: T.text }} className="mono">{it.tag}</span>
            <span style={{ color: T.error, fontSize: 12.5 }}>{it.wrong} из {it.total} неверно</span>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button
          onClick={onReview}

/**
 * Гид для новичков — показывается один раз при первом визите поверх
 * Домой (см. useOnboarding). Три шага голосом Байта вместо того, чтобы
 * молча высаживать нового человека перед 10 пунктами навигации без
 * единого объяснения. «Пропустить» доступен на любом шаге — гид не
 * должен ощущаться как принуждение.
 */
function OnboardingModal({ T, onDismiss }) {
  const [step, setStep] = useState(0);
  const isLast = step === ONBOARDING_STEPS.length - 1;
  const current = ONBOARDING_STEPS[step];
  const cardRef = useRef(null);
  const titleId = "onboarding-modal-title";

  // Фокус переходит внутрь модалки при появлении — иначе клавиатурный/
  // screen-reader пользователь остался бы фокусом на том, что было под
  // подложкой, и не узнал бы, что вообще что-то появилось поверх экрана.
  useEffect(() => {
    cardRef.current?.focus();
  }, []);

  function handleKeyDown(e) {
    if (e.key === "Escape") {
      e.stopPropagation();
      onDismiss();
      return;
    }
    // Простая ловушка фокуса: Tab/Shift+Tab циклически бегают только по
    // фокусируемым элементам ВНУТРИ модалки — иначе можно было бы
    // табом уйти на кнопки за подложкой, оставаясь визуально "запертым".
    if (e.key === "Tab") {
      const focusable = Array.from(
        cardRef.current.querySelectorAll("button")
      ).filter((el) => !el.disabled);
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  }

  return (
    <div
      style={{
        position: "fixed", inset: 0, zIndex: 20000,
        background: "rgba(0,0,0,0.55)", backdropFilter: "blur(2px)", WebkitBackdropFilter: "blur(2px)",
        display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
      }}
    >
      <div
        ref={cardRef}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
        onKeyDown={handleKeyDown}
        style={{
          background: T.surface, border: `1.5px solid ${T.border}`, borderRadius: 16,
          padding: "28px 26px", maxWidth: 420, width: "100%",
          boxShadow: "0 20px 50px rgba(0,0,0,0.35)", animation: "level-toast-in 0.25s ease",
          outline: "none",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
          <div
            style={{
              width: 44, height: 44, borderRadius: "50%", flexShrink: 0,
              background: `${T.accent}1A`, border: `1.5px solid ${T.accent}55`,
              display: "flex", alignItems: "center", justifyContent: "center",
            }}
          >
            <MascotIcon size={24} color={T.accent} mood={isLast ? "celebrate" : "idle"} />
          </div>
          <div id={titleId} style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 700, color: T.text }}>
            {current.title}
          </div>
        </div>

        <p style={{ fontSize: 14, lineHeight: 1.6, color: T.textDim, marginBottom: 22 }}>
          {current.body}
        </p>

        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 20 }}>
          {ONBOARDING_STEPS.map((_, i) => (
            <div
              key={i}
              style={{
                width: 6, height: 6, borderRadius: "50%",
                background: i === step ? T.accent : T.border,
                transition: "background 0.2s ease",
              }}
            />
          ))}
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          {!isLast && (
            <button
              onClick={onDismiss}
              style={{
                background: "transparent", border: "none", color: T.textDim, fontSize: 13,
                cursor: "pointer", padding: "10px 14px",
              }}
            >
              Пропустить
            </button>
          )}
          <button
            onClick={() => { if (isLast) onDismiss(); else setStep((s) => s + 1); }}
            style={{
              flex: 1, background: T.accent, border: "none", borderRadius: 8, color: "#fff",
              fontSize: 13.5, fontWeight: 600, padding: "10px 16px", cursor: "pointer",
            }}
          >
            {isLast ? "Начать!" : "Дальше"}
          </button>
        </div>
      </div>
    </div>
  );
}
