            {hasClickHandler ? (
              <><CheckCircle2 size={12} strokeWidth={2.2} /> обработчик click добавлен</>
            ) : (
              "обработчик пока не добавлен — запусти код"
            )}
          </div>
        </div>
      )}

      {kind === "style" && (
        <div
          style={{
            width: 120, height: 60, borderRadius: 8, background: bg,
            border: `1px solid ${T.border}`, display: "flex", alignItems: "center",
            justifyContent: "center", fontSize: 12, color: T.textDim,
            boxShadow: flash ? `0 0 0 4px ${T.accent}55` : "none",
            transition: "box-shadow 0.15s ease",
          }}
        >
          {label || "card"}
        </div>
      )}

      {kind === "textContent" && (
        <div
          style={{
            padding: "10px 14px", borderRadius: 8, background: T.surface,
            border: `1px solid ${T.border}`, fontSize: 15, color: T.text, minHeight: 20,
          }}
        >
          {text}
        </div>
      )}

      {kind === "classList" && (
        <div
          style={{
            padding: "10px 14px", borderRadius: 8, background: isActive ? `${T.accent}22` : T.surface,
            border: `1.5px solid ${isActive ? T.accent : T.border}`, fontSize: 13, color: T.text,
          }}
        >
          <div>{label || "el"} {isActive && <span style={{ color: T.accent, fontWeight: 600 }}>· активен</span>}</div>
          <div style={{ marginTop: 6, fontSize: 11.5, color: T.textDim }}>
            classList: {classes.length > 0 ? classes.join(", ") : "(пусто)"}
          </div>
        </div>
      )}
    </div>
  );
});

/**
 * Экран теории перед вопросами темы: вводный текст простым
 * языком + словарь терминов.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {Lesson} props.lesson
 * @param {string} props.topicTitle
 * @param {() => void} props.onStart - Переход к первому вопросу темы
 */
const LessonCard = memo(function LessonCard({ T, lesson, topicId, topicTitle, onStart }) {
  const levelColor = LEVELS[(TOPIC_LEVEL[topicId] || 1) - 1]?.color || T.accent;
  const heroEmoji = TOPIC_EMOJI[topicId] || "📘";
  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
        <div
          style={{
            width: 84, height: 84, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 40, background: `radial-gradient(circle at 35% 30%, ${levelColor}33, ${levelColor}14 60%, transparent 75%)`,
            border: `1.5px solid ${levelColor}44`, boxShadow: `0 0 32px ${levelColor}22`,
          }}
        >
          {heroEmoji}
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "center" }}>
        <div
          className="mono"
          style={{
            display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600,
            color: T.accent, background: `${T.accent}1A`, padding: "4px 10px", borderRadius: 20,
            marginBottom: 14, letterSpacing: "0.01em",
          }}
        >
          <BookOpen size={13} strokeWidth={2.2} /> // теория
        </div>
      </div>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 12, textAlign: "center" }}>
        {topicTitle}
      </div>
      <p style={{ fontSize: 14.5, lineHeight: 1.75, color: T.text, marginBottom: 20 }}>
        {lesson.intro}
      </p>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 10 }}>
        Словарь терминов
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {lesson.terms.map((t, i) => (
          <div
            key={i}
            style={{ background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 9, padding: "10px 14px" }}
          >
            <span
              className="mono"
              style={{ color: T.accent, fontWeight: 700, fontSize: 13.5, marginRight: 8 }}
            >
              {t.term}
            </span>
            {TERM_PRONUNCIATIONS[t.term] && (
              <button
                onClick={() => speakTerm(TERM_PRONUNCIATIONS[t.term])}
                aria-label={`Прослушать произношение: ${TERM_PRONUNCIATIONS[t.term]}`}
                title="Прослушать произношение"
                style={{
                  background: "none", border: "none", cursor: "pointer",
                  // minWidth/minHeight, а не просто padding — тап-область
                  // держим близко к 44px (стандарт для комфортного пальца
                  // на телефоне, см. остальные тач-таргеты приложения),
                  // при этом сама иконка визуально остаётся компактной и
                  // не раздувает строку с термином.
                  minWidth: 36, minHeight: 36, marginRight: 2,
                  color: T.textDim, display: "inline-flex", alignItems: "center", justifyContent: "center",
                  verticalAlign: "middle",
                }}
              >
                <Volume2 size={14} strokeWidth={2.2} />
              </button>
            )}
            <span style={{ fontSize: 13.5, lineHeight: 1.6, color: T.textDim }}>{t.def}</span>
          </div>
        ))}
      </div>

      {lesson.example && (
        <>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginTop: 22, marginBottom: 10 }}>
            Пример
          </div>
          <pre
            className="mono"
            style={{
              background: T.console, color: T.consoleText, borderRadius: 9, padding: "12px 14px",
              fontSize: 13, lineHeight: 1.6, overflowX: "auto", marginBottom: 10,
            }}
            dangerouslySetInnerHTML={{ __html: highlightJs(lesson.example.code, T) }}
          />
          <div
            style={{
              background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8,
              padding: "8px 12px", fontSize: 12.5,
            }}
          >
            <span style={{ color: T.textDim, marginRight: 6 }}>Выведет:</span>
            {lesson.example.output.map((line, i) => (
              <div key={i} className="mono" style={{ color: T.accent }}>
                <span style={{ color: T.textDim }}>❯ </span>{line}
              </div>
            ))}
          </div>
        </>
      )}

      <button
        onClick={onStart}
        style={{
          marginTop: 22, background: T.accent, color: "#fff", border: "none", borderRadius: 8,
          padding: "10px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6,
        }}
      >
        Начать вопросы <ArrowRight size={14} strokeWidth={2.2} />
      </button>
    </div>
  );
});

function navBtnStyle(T, disabled) {
  return {
    background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 7,
    padding: "6px 12px", fontSize: 12.5, color: disabled ? T.textDim : T.text,
    cursor: disabled ? "default" : "pointer", opacity: disabled ? 0.5 : 1,
  };
}

function WrappedApp() {
  return (
    <ErrorBoundary>
      <App />
    </ErrorBoundary>
  );
}

const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(React.createElement(WrappedApp));
</script>

<script>
  // Service worker для офлайн-работы и "нативного" ощущения при запуске
  // с экрана Домой. Регистрация в try/catch и с проверкой поддержки —
  // при открытии файла напрямую (file://) или без HTTPS браузер просто
  // тихо откажет, без единой ошибки в консоли; это ожидаемо и не мешает
  // остальному приложению работать как обычно.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // офлайн-режим просто не заработает — само приложение не пострадает
      });
    });
  }
</script>
</body>
