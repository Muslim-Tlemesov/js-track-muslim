/**
 * Мини-проект «Таймер» — отдельный, полностью изолированный режим:
 * не участвует в вопросах/ответах/XP/достижениях (никак не трогает
 * answers/topicProgress/recordAnswer), поэтому не может сломать
 * прогресс основного курса. Пользователь пишет код, который получает
 * в качестве аргументов два лёгких «живых» объекта (startBtn, display) —
 * по той же идее, что и liveKind-песочница у обычных code-вопросов —
 * а также реальные setInterval/clearInterval, обёрнутые так, чтобы
 * все запущенные из кода интервалы можно было гарантированно
 * остановить при повторном запуске или уходе с экрана (иначе они
 * продолжали бы тикать в фоне вечно).
 */
const PROJECT_TIMER_STARTER =
`// Собери таймер: кнопка запускает и останавливает отсчёт
// секунд, а дисплей сверху показывает текущее время.
//
// Доступно:
//   startBtn.addEventListener("click", () => { ... })
//   display.textContent = "..."   — меняет текст на экране
//   setInterval(fn, ms) / clearInterval(id) — как в браузере

let seconds = 0;
let running = false;
let intervalId = null;

startBtn.addEventListener("click", () => {
  running = !running;
  if (running) {
    intervalId = setInterval(() => {
      seconds++;
      display.textContent = seconds + " сек";
    }, 1000);
  } else {
    clearInterval(intervalId);
  }
});
`;

const ProjectScreen = memo(function ProjectScreen({ T }) {
  const [code, setCode] = useState(PROJECT_TIMER_STARTER);
  const [displayText, setDisplayText] = useState("0 сек");
  const [runResult, setRunResult] = useState(null);
  const [isRunning, setIsRunning] = useState(false);
  const intervalsRef = useRef([]);
  const liveRef = useRef(null);
  // Тот же реф на отложенный запуск, что и в Sandbox (см. подробный
  // комментарий там) — без него уход с экрана прямо во время
  // искусственной 350мс-задержки запуска оставлял бы отложенный
  // callback сработать уже ПОСЛЕ очистки, создавая никем не
  // отслеживаемый интервал.
  const pendingRunTimeoutRef = useRef(null);

  // Гарантированно гасим все интервалы, запущенные кодом
  // пользователя, при уходе с экрана мини-проекта.
  useEffect(() => {
    return () => {
      if (pendingRunTimeoutRef.current) clearTimeout(pendingRunTimeoutRef.current);
      intervalsRef.current.forEach(clearInterval);
      intervalsRef.current = [];
    };
  }, []);

  function stopAllIntervals() {
    if (pendingRunTimeoutRef.current) {
      clearTimeout(pendingRunTimeoutRef.current);
      pendingRunTimeoutRef.current = null;
    }
    intervalsRef.current.forEach(clearInterval);
    intervalsRef.current = [];
  }

  function run() {
    stopAllIntervals();
    setDisplayText("0 сек");
    setIsRunning(true);
    pendingRunTimeoutRef.current = setTimeout(async () => {
      pendingRunTimeoutRef.current = null;
      const startBtn = { handlers: {}, addEventListener(ev, cb) { this.handlers[ev] = cb; } };
      const display = {
        _text: "0 сек",
        get textContent() { return this._text; },
        set textContent(v) { this._text = String(v); setDisplayText(this._text); },
      };
      // setInterval/clearInterval «теневые» — оборачивают настоящие
      // браузерные, но регистрируют id в intervalsRef, чтобы их можно
      // было гарантированно остановить при повторном запуске кода.
      const trackedSetInterval = (fn, ms) => {
        const id = setInterval(fn, ms);
        intervalsRef.current.push(id);
        return id;
      };
      const trackedClearInterval = (id) => {
        clearInterval(id);
        intervalsRef.current = intervalsRef.current.filter((x) => x !== id);
      };
      // await обязателен: extraArgs здесь непустой (startBtn/display —
      // живые объекты), так что runUserCode идёт по синхронному пути
      // (см. runUserCodeSync), но САМА функция всё равно всегда
      // возвращает Promise, чтобы вызывающий код был единообразным
      // независимо от того, ушло исполнение в Worker или нет. Без await
      // здесь result был бы объектом Promise, а не {logs, error} —
      // ошибка, которую легко не заметить, раз display.textContent всё
      // равно продолжает работать (это отдельный синхронный побочный
      // эффект внутри runUserCodeSync, не зависящий от того, что делает
      // вызывающий код с возвращаемым Promise).
      const result = await runUserCode(code, {
        startBtn, display, setInterval: trackedSetInterval, clearInterval: trackedClearInterval,
      });
      setRunResult(result);
      setIsRunning(false);
      liveRef.current = startBtn;
    }, 350);
  }

  function handlePreviewClick() {
    liveRef.current?.handlers.click?.();
  }

  function resetToStarter() {
    stopAllIntervals();
    setCode(PROJECT_TIMER_STARTER);
    setDisplayText("0 сек");
    setRunResult(null);
    liveRef.current = null;
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6, gap: 12, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 4 }}>
            🎯 Мини-проект: Таймер
          </div>
          <div style={{ fontSize: 13, color: T.textDim, maxWidth: 480, lineHeight: 1.55 }}>
            Здесь нет проверки на «правильно/неправильно» — просто собери рабочую
            вещь. Напиши код, нажми «Запустить», а затем жми на кнопку в
            предпросмотре ниже — таймер должен реально тикать.
          </div>
        </div>
        <button
          onClick={resetToStarter}
          style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 8,
            padding: "7px 12px", fontSize: 12.5, color: T.textDim, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
          }}
        >
          <RotateCcw size={13} strokeWidth={2.2} /> Начать заново
        </button>
      </div>

      <div
        style={{
          marginTop: 14, marginBottom: 16, background: T.surfaceAlt, border: `1px dashed ${T.border}`,
          borderRadius: 9, padding: "16px 14px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap",
        }}
      >
        <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: T.text, minWidth: 90 }}>
          {displayText}
        </div>
        <button
          onClick={handlePreviewClick}
          style={{
            background: T.accent, color: "#fff", border: "none", borderRadius: 8,
            padding: "10px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
          }}
        >
          Старт / Стоп
        </button>
        <div style={{ fontSize: 11.5, color: T.textDim, display: "flex", alignItems: "center", gap: 4 }}>
          <MonitorPlay size={12} strokeWidth={2.2} /> сначала нажми «Запустить»
        </div>
      </div>

      <CodeEditor
        T={T}
        value={code}
        onChange={setCode}
        minHeight={200}
        onKeyDown={(e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            e.preventDefault();
            run();
          }
        }}
      />
      <div style={{ fontSize: 11, color: T.textDim, marginTop: 6 }}>
        Ctrl+Enter (⌘+Enter на Mac) — быстрый запуск
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
        <button
          onClick={run}
          disabled={isRunning}
          style={{
            background: T.accent, color: "#fff", border: "none", borderRadius: 8,
            padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: isRunning ? "default" : "pointer",
            display: "flex", alignItems: "center", gap: 6, opacity: isRunning ? 0.75 : 1,
          }}
        >
          {isRunning ? (
            <svg className="running-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round">
              <path d="M12 2a10 10 0 0 1 10 10" />
            </svg>
          ) : (
            <Play size={14} strokeWidth={2.4} fill="currentColor" />
          )}
          {isRunning ? "Выполняется…" : "Запустить"}
        </button>
      </div>

      {runResult?.error && (
        <div
          style={{
            marginTop: 14, background: T.errorBg, border: `1px solid ${T.error}`, borderRadius: 9,
            padding: "10px 12px", fontSize: 13, color: T.error, display: "flex", alignItems: "center", gap: 6,
          }}
        >
          <XCircle size={13} strokeWidth={2.2} /> Error: {runResult.error}
        </div>
      )}
    </div>
  );
});

/**
 * Финальный экзамен — ШАГ 1 (без ограничения по времени, таймер
 * будет добавлен отдельным шагом). Полностью изолированный режим:
 * сам генерирует выборку из EXAM_QUESTION_COUNT вопросов (перемешанные
 * quiz + code вопросы из общего пула ALL_QUESTIONS) и ведёт по ним
 * локально — счёт и прогресс экзамена хранятся только внутри этого
 * компонента и никак не трогают answers/topicProgress/XP/достижения
 * основного курса и никак не влияют на сертификат.
 *
 * Для code-вопросов проверка упрощена (runUserCode + сравнение с
 * expectedLogs), без подсказок/решения/живой песочницы — это
 * осознанное упрощение первого шага.
 */
const EXAM_QUESTION_COUNT = 30;
const EXAM_DURATION_SECONDS = 20 * 60; // 20 минут на весь экзамен, общий счётчик, без паузы на вопрос

function formatExamTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function sampleExamQuestions(count) {
  const pool = ALL_QUESTIONS.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, Math.min(count, pool.length));
}

const ExamScreen = memo(function ExamScreen({ T, soundEnabled }) {
  const [phase, setPhase] = useState("intro"); // "intro" | "running" | "done"
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [selected, setSelected] = useState(null);
  const [checked, setChecked] = useState(false);
  const [code, setCode] = useState("");
  const [runResult, setRunResult] = useState(null);
  const [isRunning, setIsRunning] = useState(false);
  const [timeLeftSec, setTimeLeftSec] = useState(EXAM_DURATION_SECONDS);
  const [timeUp, setTimeUp] = useState(false); // экзамен завершился по таймеру, а не вручную
  // Тот же механизм "живого" DOM-объекта (button/card/title/el), что и
  // в обычном режиме вопросов — без него код вопросов с liveKind (см.
  // dom-3..dom-6) ссылался бы на несуществующую переменную и падал бы
  // с ReferenceError при любом ответе, если такой вопрос попадёт в
  // случайную выборку экзамена.
  const liveObjRef = useRef(null);
  const [liveTick, setLiveTick] = useState(0);
  // Тот же синхронный лок от повторной отправки, что и в основном режиме
  // вопросов — обычная проверка "if (checked) return" не спасает от
  // быстрых повторных кликов в один тик, до того как React перерендерит
  // disabled-кнопку.
  const lastSubmittedIdxRef = useRef(-1);
  // Празднование прохождения экзамена — конфетти/звук должны сработать
  // РОВНО ОДИН РАЗ при переходе в phase "done", а не при каждом
  // ре-рендере этого экрана (иначе конфетти "перезапускалось" бы от
  // любого не связанного обновления состояния, пока пользователь
  // просто смотрит на результат).
  const [examCelebrated, setExamCelebrated] = useState(false);
  useEffect(() => {
    if (phase !== "done" || examCelebrated) return;
    setExamCelebrated(true);
    const pct = questions.length ? Math.round((score / questions.length) * 100) : 0;
    if (pct >= 80) playVictoryChime(soundEnabled);
  }, [phase, examCelebrated, questions.length, score, soundEnabled]);

  // Общий обратный отсчёт на весь экзамен — не ставится на паузу между
  // вопросами, как и на настоящем экзамене. Самопланирующийся setTimeout
  // (а не setInterval) — на каждый тик пересоздаётся через зависимость
  // timeLeftSec, поэтому не может «утечь» отдельным висящим таймером:
  // cleanup гарантированно отменяет предыдущий перед следующим тиком
  // и при уходе из фазы "running" или размонтировании.
  useEffect(() => {
    if (phase !== "running") return;
    if (timeLeftSec <= 0) {
      setTimeUp(true);
      setPhase("done");
      return;
    }
    const timeout = setTimeout(() => setTimeLeftSec((t) => t - 1), 1000);
    return () => clearTimeout(timeout);
  }, [phase, timeLeftSec]);

  const current = questions[idx] || null;
  const isCode = current?.type === "code";
  const cardStyle = { background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 };

  function startExam() {
    const qs = sampleExamQuestions(EXAM_QUESTION_COUNT);
    setQuestions(qs);
    setIdx(0);
    setScore(0);
    setSelected(null);
    setChecked(false);
    setCode(qs[0]?.starter || "");
    setRunResult(null);
    setTimeLeftSec(EXAM_DURATION_SECONDS);
    setTimeUp(false);
    lastSubmittedIdxRef.current = -1;
    setExamCelebrated(false);
    liveObjRef.current = qs[0]?.liveKind ? makeLiveObject(qs[0].liveKind) : null;
    setLiveTick((t) => t + 1);
    setPhase("running");
  }

  const clickLiveButton = useCallback(() => {
    const cb = liveObjRef.current?.handlers?.click;
    if (typeof cb === "function") {
      try {
        cb();
      } catch {
        // обработчик пользователя может содержать ошибку — это нормально до сдачи задачи
      }
      setLiveTick((t) => t + 1);
    }
  }, []);

  function submitQuizAnswer(optionIdx) {
    if (lastSubmittedIdxRef.current === idx) return;
    lastSubmittedIdxRef.current = idx;
    setSelected(optionIdx);
    setChecked(true);
    if (optionIdx === current.correct) {
      setScore((s) => s + 1);
      playCorrectTick(soundEnabled);
    }
  }

  function submitCodeAnswer() {
    if (lastSubmittedIdxRef.current === idx) return;
    lastSubmittedIdxRef.current = idx;
    setIsRunning(true);
    setTimeout(async () => {
      if (current.liveKind) liveObjRef.current = makeLiveObject(current.liveKind);
      const extraArgs = current.liveVarName && liveObjRef.current
        ? { [current.liveVarName]: liveObjRef.current }
        : {};
      const result = await runUserCode(code, extraArgs);
      setRunResult(result);
      setIsRunning(false);
      setChecked(true);
      if (current.liveKind) setLiveTick((t) => t + 1);
      if (!result.error && logsMatch(result.logs, current.expectedLogs)) {
        setScore((s) => s + 1);
        playCorrectTick(soundEnabled);
      }
    }, 350);
  }

  function goNext() {
    const nextIdx = idx + 1;
    if (nextIdx >= questions.length) {
      setPhase("done");
      return;
    }
    setIdx(nextIdx);
    setSelected(null);
    setChecked(false);
    setCode(questions[nextIdx]?.starter || "");
    setRunResult(null);
    liveObjRef.current = questions[nextIdx]?.liveKind ? makeLiveObject(questions[nextIdx].liveKind) : null;
    setLiveTick((t) => t + 1);
  }

  if (phase === "intro") {
    return (
      <div className="question-card question-enter" style={cardStyle}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 10 }}>
          🌙 Финальный экзамен
        </div>
        <div style={{ fontSize: 13.5, color: T.textDim, lineHeight: 1.65, marginBottom: 18, maxWidth: 480 }}>
          {EXAM_QUESTION_COUNT} вопросов вперемешку из всех тем курса — и quiz, и код.
          На всё даётся {formatExamTime(EXAM_DURATION_SECONDS)} — таймер общий на весь экзамен,
          не ставится на паузу между вопросами; когда время выйдет, экзамен завершится
          автоматически с тем результатом, что успел набрать. Результат не влияет на
          прогресс курса, XP или достижения — это отдельная проверка себя, можно
          проходить сколько угодно раз.
        </div>
        <button
          onClick={startExam}
          style={{
            background: T.accent, color: "#fff", border: "none", borderRadius: 8,
            padding: "10px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6,
          }}
        >
          <Play size={14} strokeWidth={2.4} fill="currentColor" /> Начать экзамен
        </button>
      </div>
    );
  }

  if (phase === "done") {
    const pct = questions.length ? Math.round((score / questions.length) * 100) : 0;
    // Празднование масштабируется по результату — честно, а не одинаково
    // на любой процент: конфетти на 20% выглядело бы издевательски, а не
    // мотивирующе. Средний результат — просто спокойное завершение без
    // фанфар, слабый — поддерживающий тон маскота, не "ничего страшного,
    // ты справился", а буквально "давай пересдадим".
    const tier = pct >= 80 ? "strong" : pct >= 50 ? "mid" : "low";
    return (
      <div className="question-card question-enter" style={{ ...cardStyle, textAlign: "center", padding: "36px 28px" }}>
        {tier === "strong" && <Celebration active={examCelebrated} />}
        <div style={{ fontSize: tier === "strong" ? 56 : 40, marginBottom: 8, lineHeight: 1 }}>
          {tier === "strong" ? "🏆" : tier === "mid" ? "📘" : "💪"}
        </div>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: tier === "strong" ? 24 : 19, fontWeight: 700, marginBottom: 8 }}>
          {timeUp ? "⏱ Время вышло" : tier === "strong" ? "Экзамен пройден отлично!" : tier === "mid" ? "Экзамен завершён" : "Экзамен завершён — есть куда расти"}
        </div>
        <div style={{ fontSize: tier === "strong" ? 44 : 34, fontWeight: 700, color: tier === "strong" ? T.success : tier === "mid" ? T.accent : T.error, marginBottom: 6 }}>
          {pct}%
        </div>
        <div style={{ fontSize: 13.5, color: T.textDim, marginBottom: 22 }}>
          {score} из {questions.length} правильных ответов
          {timeUp && ` · успел дойти до вопроса ${Math.min(idx + 1, questions.length)} из ${questions.length}`}
        </div>

        <div style={{ maxWidth: 420, marginLeft: "auto", marginRight: "auto", textAlign: "left", marginBottom: 22 }}>
          <Mascot T={T} status={tier === "low" ? "wrong" : "correct"} seed={`exam-${score}-${questions.length}`} />
        </div>

        <button
          onClick={startExam}
          style={{
            background: T.accent, color: "#fff", border: "none", borderRadius: 8,
            padding: "10px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
            display: "inline-flex", alignItems: "center", gap: 6,
          }}
        >
          <RotateCcw size={14} strokeWidth={2.2} /> Пройти ещё раз
        </button>
      </div>
    );
  }

  if (!current) return null;

  const status = !checked ? null : isCode
    ? (!runResult.error && logsMatch(runResult.logs, current.expectedLogs) ? "correct" : "wrong")
    : (selected === current.correct ? "correct" : "wrong");

  return (
    <div className="question-card question-enter" style={cardStyle}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, fontSize: 12, color: T.textDim, flexWrap: "wrap", gap: 8 }}>
        <span>Вопрос {idx + 1} из {questions.length}</span>
        <span
          className="mono"
          style={{
            fontWeight: 700, fontSize: 13,
            color: timeLeftSec <= 60 ? T.error : T.textDim,
          }}
        >
          ⏱ {formatExamTime(timeLeftSec)}
        </span>
        <span>{current.topicTitle}</span>
      </div>

      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 600, lineHeight: 1.5, marginBottom: 18, wordBreak: "break-word" }}>
        {current.prompt}
      </div>

      {!isCode && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {current.options.map((opt, i) => {
            const isSelected = selected === i;
            const isCorrectOpt = i === current.correct;
            let bg = T.surfaceAlt;
            let border = T.border;
            if (checked && isSelected && isCorrectOpt) { bg = T.successBg; border = T.success; }
            else if (checked && isSelected && !isCorrectOpt) { bg = T.errorBg; border = T.error; }
            else if (checked && isCorrectOpt) { bg = T.successBg; border = T.success; }
            return (
              <button
                key={i}
                className="opt-btn"
                disabled={checked}
                onClick={() => submitQuizAnswer(i)}
                style={{
                  textAlign: "left", padding: "14px 16px", borderRadius: 14, width: "100%",
                  border: `1.5px solid ${border}`, background: bg, color: T.text,
                  cursor: checked ? "default" : "pointer", fontSize: 14,
                  fontFamily: "'JetBrains Mono', monospace", boxSizing: "border-box",
                  whiteSpace: "normal", wordBreak: "break-word",
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}

      {isCode && (
        <div>
          <CodeEditor
            T={T}
            value={code}
            onChange={setCode}
            minHeight={140}
            disabled={checked}
            onKeyDown={(e) => {
              if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                submitCodeAnswer();
              }
            }}
          />
          <div style={{ fontSize: 11, color: T.textDim, marginTop: 6 }}>
            Ctrl+Enter (⌘+Enter на Mac) — быстрый запуск
          </div>
          {current.liveKind && (
            <LiveDomPreview
              T={T}
              kind={current.liveKind}
              liveObj={liveObjRef.current}
              tick={liveTick}
              label={current.liveVarName}
              onClickButton={clickLiveButton}
            />
          )}
          {!checked && (
            <button
              onClick={submitCodeAnswer}
              disabled={isRunning}
              style={{
                marginTop: 10, background: T.accent, color: "#fff", border: "none", borderRadius: 8,
                padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: isRunning ? "default" : "pointer",
                display: "flex", alignItems: "center", gap: 6, opacity: isRunning ? 0.75 : 1,
              }}
            >
              {isRunning ? (
                <svg className="running-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round">
                  <path d="M12 2a10 10 0 0 1 10 10" />
                </svg>
              ) : (
                <Play size={14} strokeWidth={2.4} fill="currentColor" />
              )}
              {isRunning ? "Выполняется…" : "Выполнить и проверить"}
            </button>
          )}
          {runResult?.error && (
            <div style={{ marginTop: 10, fontSize: 12.5, color: T.error }}>Error: {runResult.error}</div>
          )}
        </div>
      )}

      {checked && (
        <div
          style={{
            marginTop: 16, padding: 16, borderRadius: 10,
            background: status === "correct" ? T.successBg : T.errorBg,
            border: `1px solid ${status === "correct" ? T.success : T.error}55`,
          }}
        >
          <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6, color: status === "correct" ? T.success : T.error, display: "flex", alignItems: "center", gap: 6 }}>
            {status === "correct" ? (<><CheckCircle2 size={16} strokeWidth={2.2} /> Верно</>) : (<><XCircle size={16} strokeWidth={2.2} /> Пока не так</>)}
          </div>
          <div style={{ fontSize: 13.5, lineHeight: 1.6, color: T.text }}>
            {status === "correct" ? current.why.right : (current.why.byOption?.[selected] ?? current.why.wrong)}
          </div>
        </div>
      )}

      {checked && (
        <button
          onClick={goNext}
          style={{
            marginTop: 16, background: T.accent, color: "#fff", border: "none", borderRadius: 8,
            padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6,
          }}
        >
          {idx + 1 >= questions.length ? "Завершить экзамен" : "Следующий вопрос"} <ArrowRight size={14} strokeWidth={2.2} />
        </button>
      )}
    </div>
  );
});

/* ============================================================
   КАРТА ЗНАНИЙ — дерево прогресса по темам курса
   ============================================================
   Группировка тем по смысловым веткам (а не по TOPIC-массиву
   напрямую) — намеренно отдельная структура: она НЕ меняет логику
   уровней/гейтинга (LEVELS/isLevelUnlocked остаются как есть),
   а просто даёт дереву более осмысленные подписи веток, чем
   «Новичок/Средний/Продвинутый». Angular-ветка — честный тизер
   направления курса: у неё нет ни одной темы внутри, она всегда
   заблокирована и никак не влияет на прогресс/проценты.
   ============================================================ */

const KNOWLEDGE_TREE = [
  { id: "basics", label: "Основы", emoji: "🌱", color: "#6BCB77", topicIds: ["vars", "strings", "destructuring"] },
  { id: "data", label: "Работа с данными", emoji: "📦", color: "#FFD93D", topicIds: ["arrays", "objects", "loops"] },
  { id: "advanced", label: "Продвинутое", emoji: "🔺", color: "#FF6B6B", topicIds: ["async", "classes", "dom"] },
  { id: "typescript", label: "TypeScript", emoji: "🔷", color: "#3178C6", topicIds: [], comingSoon: true },
  { id: "angular", label: "Angular", emoji: "🅰️", color: "#DD0031", topicIds: [], comingSoon: true },
];

// Короткие подписи для листьев — полные названия тем (например,
// «Массивы: map / filter / reduce») слишком длинные для маленького
// узла дерева, поэтому здесь отдельные, более компактные варианты.
const TREE_LEAF_LABEL = {
  vars: "let / const", strings: "Строки", destructuring: "Деструктуризация",
  arrays: "Массивы", objects: "Объекты", loops: "Циклы",
  async: "Async / await", classes: "Классы", dom: "DOM",
};

/**
 * Считает процент выполнения одной темы или процент по списку тем
 * (взвешенно по количеству вопросов, а не простым средним — так тема
 * с 8 вопросами не «весит» столько же, сколько тема с 1 вопросом).
 * @param {Object} topicProgress
 * @param {string[]} topicIds
 */
function weightedPct(topicProgress, topicIds) {
  let correct = 0, total = 0;
  topicIds.forEach((id) => {
    const p = topicProgress[id];
    if (!p) return;
    correct += p.correct;
    total += p.total;
  });
  return total > 0 ? Math.round((correct / total) * 100) : 0;
}

/**
 * Круглый узел дерева знаний: заливка/кольцо-прогресс растут вместе
 * с процентом решённых вопросов — «вершина постепенно заполняется».
 * Реализовано как один SVG на весь экран (см. KnowledgeTreeScreen),
 * этот компонент рендерит только содержимое одного узла (круг +
 * кольцо прогресса + подпись через foreignObject).
 *
 * @param {Object} props
 * @param {number} props.cx
 * @param {number} props.cy
 * @param {number} props.r
 * @param {number} props.pct - 0..100
 * @param {string} props.color
 * @param {string} props.label
 * @param {string} [props.emoji]
 * @param {boolean} [props.locked]
 * @param {boolean} [props.clickable]
 * @param {() => void} [props.onClick]
 * @param {ThemeTokens} props.T
 */
/**
 * Круговой индикатор прогресса (кольцо + процент по центру) — вместо
 * привычной горизонтальной полоски. Та же математика кольца, что и у
 * узлов дерева знаний (TreeNode), вынесенная в отдельный переиспользуемый
 * компонент для карточек тем и индикатора прогресса по теме.
 *
 * @param {Object} props
 * @param {number} props.pct - 0..100
 * @param {number} [props.size]
 * @param {number} [props.strokeWidth]
 * @param {string} props.color
 * @param {ThemeTokens} props.T
 * @param {boolean} [props.done] - показать галочку вместо процента при 100%
 */
function CircularProgress({ pct, size = 56, strokeWidth = 5, color, T, done }) {
  const clamped = Math.max(0, Math.min(100, pct));
  const r = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * r;
  const dash = (clamped / 100) * circumference;
  const showCheck = done && clamped >= 100;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: "block", flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.surfaceAlt} strokeWidth={strokeWidth} />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={strokeWidth}
        strokeLinecap="round" strokeDasharray={`${dash} ${circumference}`}
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dasharray 0.4s ease" }}
      />
      {showCheck ? (
        <path
          d={`M ${size * 0.32} ${size * 0.52} L ${size * 0.45} ${size * 0.65} L ${size * 0.7} ${size * 0.36}`}
          fill="none" stroke={color} strokeWidth={strokeWidth * 0.9} strokeLinecap="round" strokeLinejoin="round"
        />
      ) : (
        <text x={size / 2} y={size / 2 + size * 0.07} textAnchor="middle" fontSize={size * 0.26} fontWeight={700} fill={T.text} className="mono">
          {Math.round(clamped)}
        </text>
      )}
    </svg>
  );
}

function TreeNode({ cx, cy, r, pct, color, label, emoji, locked, clickable, onClick, T, labelWidth = 110, fontSize = 11 }) {
  const circumference = 2 * Math.PI * r;
  const dash = (Math.max(0, Math.min(100, pct)) / 100) * circumference;
  const isDone = pct >= 100;
  return (
    <g style={{ cursor: clickable ? "pointer" : "default" }} onClick={clickable ? onClick : undefined}>
      <circle cx={cx} cy={cy} r={r} fill={locked ? "transparent" : `${color}1A`} stroke={T.border} strokeWidth={1.5} strokeDasharray={locked ? "4 3" : "none"} />
      {!locked && (
        <circle
          cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={4} strokeLinecap="round"
          strokeDasharray={`${dash} ${circumference}`}
          transform={`rotate(-90 ${cx} ${cy})`}
          style={{ transition: "stroke-dasharray 0.4s ease" }}
        />
      )}
      {locked ? (
        <svg x={cx - r * 0.45} y={cy - r * 0.45} width={r * 0.9} height={r * 0.9} viewBox="0 0 24 24" fill="none" stroke={T.textDim} strokeWidth={2.2} strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      ) : (
        <text x={cx} y={cy + (emoji ? 6 : 5)} textAnchor="middle" fontSize={r} style={{ userSelect: "none" }}>
          {emoji}
        </text>
      )}
      {isDone && !locked && (
        <circle cx={cx + r * 0.72} cy={cy - r * 0.72} r={r * 0.32} fill={T.success} />
      )}
      {isDone && !locked && (
        <svg
          x={cx + r * 0.72 - r * 0.2} y={cy - r * 0.72 - r * 0.2} width={r * 0.4} height={r * 0.4}
          viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth={3.5} strokeLinecap="round" strokeLinejoin="round"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
      )}
      <foreignObject x={cx - labelWidth / 2} y={cy + r + 4} width={labelWidth} height={34}>
        <div
          // eslint-disable-next-line react/no-unknown-property
          xmlns="http://www.w3.org/1999/xhtml"
          style={{
            fontSize, textAlign: "center", lineHeight: 1.2, color: locked ? T.textDim : T.text,
            fontWeight: 600, fontStyle: locked ? "italic" : "normal",
          }}
        >
          {label}
          {!locked && <div style={{ fontSize: Math.max(9, fontSize - 1), color: T.textDim, fontWeight: 400 }}>{pct}%</div>}
          {locked && <div style={{ fontSize: Math.max(9, fontSize - 1), color: T.textDim, fontWeight: 400 }}>скоро</div>}
        </div>
      </foreignObject>
    </g>
  );
}

/**
 * Карта знаний — то же самое дерево тем, что и в сайдбаре, но как
 * визуальный граф вместо списка: корень «JavaScript» → ветки-категории
 * → листья-темы. Узел заполняется (кольцо-прогресс + заливка) по мере
 * решения вопросов темы — процент берётся из того же topicProgress,
 * что использует весь остальной курс, так что дерево не может разойтись
 * с реальным прогрессом. Клик по листу-теме уводит на неё же в обычном
 * режиме вопросов (через onJumpToTopic — тот же jumpToTopic, что и в
 * сайдбаре, включая проверку на заблокированный уровень).
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {Object} props.topicProgress
 * @param {(topicId: string) => boolean} props.isTopicLocked
 * @param {(topicId: string) => void} props.onJumpToTopic
 */
const KnowledgeTreeScreen = memo(function KnowledgeTreeScreen({ T, topicProgress, isTopicLocked, onJumpToTopic }) {
  const W = 900;
  const rootY = 46;
  const branchY = 190;
  const leafY = 340;
  const LEAF_LABEL_WIDTH = 50; // уже, чем у веток/корня (110) — при 3 листьях на ветку и 5 ветках это единственная ширина, при которой подписи не пересекаются ни между собой, ни с соседней веткой
  const branchXs = KNOWLEDGE_TREE.map((_, i) => ((i + 0.5) / KNOWLEDGE_TREE.length) * W);
  const slotWidth = W / KNOWLEDGE_TREE.length;
  const rootX = W / 2;
  const overallPct = weightedPct(topicProgress, KNOWLEDGE_TREE.filter((b) => !b.comingSoon).flatMap((b) => b.topicIds));

  // Шаг между листьями одной ветки должен одновременно: (а) быть не меньше
  // ширины подписи — иначе соседние листья ВНУТРИ одной ветки наедут друг
  // на друга, и (б) укладываться в slotWidth с запасом — иначе крайний лист
  // заедет в соседнюю ветку. Оба условия вместе и дают LEAF_LABEL_WIDTH=50:
  // при более широких подписях эти два требования противоречат друг другу
  // при 3 листьях на 5 равных веток.
  function leafGap(leafCount) {
    if (leafCount <= 1) return 0;
    const fitSlot = (slotWidth - LEAF_LABEL_WIDTH - 20) / (leafCount - 1);
    return Math.max(LEAF_LABEL_WIDTH, fitSlot);
  }

  function leafX(branchIdx, leafIdx, leafCount) {
    if (leafCount <= 1) return branchXs[branchIdx];
    return branchXs[branchIdx] + (leafIdx - (leafCount - 1) / 2) * leafGap(leafCount);
  }

  function elbowPath(x1, y1, x2, y2) {
    const midY = y1 + (y2 - y1) * 0.55;
    return `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 6 }}>
        🌳 Карта знаний
      </div>
      <div style={{ fontSize: 13, color: T.textDim, marginBottom: 18, maxWidth: 560 }}>
        То же самое дерево тем, что и в программе курса слева, только целиком.
        Каждая вершина заполняется по мере решения вопросов темы — нажми на лист,
        чтобы перейти к теме.
      </div>

      <div style={{ overflowX: "auto" }}>
        <svg viewBox={`0 0 ${W} 400`} width="100%" style={{ minWidth: 640, display: "block" }}>
          {/* линии-коннекторы: сначала все рёбра, потом узлы поверх */}
          <g fill="none" stroke={T.border} strokeWidth={1.5}>
            {branchXs.map((bx, i) => (
              <path key={`root-${KNOWLEDGE_TREE[i].id}`} d={elbowPath(rootX, rootY + 32, bx, branchY - 26)} />
            ))}
            {KNOWLEDGE_TREE.map((branch, bi) =>
              branch.topicIds.map((topicId, li) => {
                const leafCount = branch.topicIds.length;
                const lx = leafX(bi, li, leafCount);
                return <path key={`${branch.id}-${topicId}`} d={elbowPath(branchXs[bi], branchY + 26, lx, leafY - 20)} />;
              })
            )}
          </g>

          <TreeNode T={T} cx={rootX} cy={rootY} r={32} pct={overallPct} color={T.accent} emoji="🟣" label="JavaScript" />

          {KNOWLEDGE_TREE.map((branch, bi) => {
            const pct = branch.comingSoon ? 0 : weightedPct(topicProgress, branch.topicIds);
            return (
              <TreeNode
                key={branch.id} T={T} cx={branchXs[bi]} cy={branchY} r={26}
                pct={pct} color={branch.color} emoji={branch.emoji} label={branch.label} locked={branch.comingSoon}
              />
            );
          })}

          {KNOWLEDGE_TREE.map((branch, bi) =>
            branch.topicIds.map((topicId, li) => {
              const leafCount = branch.topicIds.length;
              const lx = leafX(bi, li, leafCount);
              const p = topicProgress[topicId] || { correct: 0, total: 0 };
              const pct = p.total > 0 ? Math.round((p.correct / p.total) * 100) : 0;
              const locked = isTopicLocked(topicId);
              return (
                <TreeNode
                  key={topicId} T={T} cx={lx} cy={leafY} r={20} pct={pct} color={branch.color}
                  emoji="📄" label={TREE_LEAF_LABEL[topicId] || topicId} locked={locked}
                  labelWidth={LEAF_LABEL_WIDTH} fontSize={9.5}
                  clickable={!locked} onClick={() => onJumpToTopic(topicId)}
                />
              );
            })
          )}
        </svg>
      </div>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, fontSize: 12, color: T.textDim }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><Check size={12} strokeWidth={3} style={{ color: T.success }} /> тема пройдена на 100%</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><Lock size={12} strokeWidth={2.2} /> закрыто (нужно поднять уровень) или ещё не в курсе</span>
      </div>
    </div>
  );
});

const PREDICT_SHUFFLED = shuffleValues(PREDICT_SNIPPETS, "predict-output");

/**
 * Сверяет предсказанный пользователем вывод с заранее посчитанным
 * expected-массивом: построчно, без учёта пробелов по краям строки,
 * пустые строки ввода игнорируются (чтобы случайный Enter в конце
 * не портил в остальном верный ответ).
 *
 * @param {string} userText
 * @param {string[]} expectedLines
 */
function gradePrediction(userText, expectedLines) {
  const userLines = userText.split("\n").map((l) => l.trim()).filter((l) => l !== "");
  const maxLen = Math.max(userLines.length, expectedLines.length);
  const rows = [];
  for (let i = 0; i < maxLen; i++) {
    const expected = expectedLines[i] ?? null;
    const actual = userLines[i] ?? null;
    rows.push({ expected, actual, correct: expected !== null && actual !== null && expected === actual });
  }
  const allCorrect = rows.every((r) => r.correct) && userLines.length === expectedLines.length;
  return { allCorrect, rows };
}

/**
 * Тренажёр «Предскажи вывод» — отдельный режим active recall: код
 * показывается, но вариантов ответа нет — нужно самому написать,
 * что выведет console.log. Полностью изолирован от прогресса курса
 * (никак не трогает answers/topicProgress/XP), score живёт только
 * в рамках сессии этого экрана, как и в Sandbox/Project.

const PredictScreen = memo(function PredictScreen({ T }) {

  const [score, setScore] = useState({ correct: 0, total: 0 });

  const snippet = PREDICT_SHUFFLED[idx];
  const isLast = idx === PREDICT_SHUFFLED.length - 1;

  function check() {
    if (!input.trim() || result) return;
    const graded = gradePrediction(input, snippet.expected);
    setResult(graded);
    setScore((prev) => ({ correct: prev.correct + (graded.allCorrect ? 1 : 0), total: prev.total + 1 }));
  }

  function next() {
    setIdx((i) => (i + 1) % PREDICT_SHUFFLED.length);
    setInput("");
    setResult(null);

  );

/* ============================================================
   ИСТОРИЯ ОБУЧЕНИЯ — лог попыток, сгруппированный по дням
   ============================================================
   historyLog — плоский массив { questionId, tags, topicId, topicTitle,
   correct, ts }, по одной записи на КАЖДУЮ попытку ответа (в отличие
   от answers, который хранит только последний статус). Копится только
   с момента появления этой фичи — старый прогресс, отвеченный раньше,
   в historyLog не попадает и показывается отдельным блоком "Раньше"
   (см. legacyEntries ниже), без даты, потому что даты для него просто
   не существует, а не потому что она не сохранилась.
   ============================================================ */

function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

const RU_MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

function formatDayLabel(dayStartTs) {
  const today = startOfDay(Date.now());
  const diffDays = Math.round((today - dayStartTs) / 86400000);
  if (diffDays === 0) return "Сегодня";
  if (diffDays === 1) return "Вчера";
  const d = new Date(dayStartTs);
  const withYear = d.getFullYear() !== new Date().getFullYear() ? `, ${d.getFullYear()}` : "";
  return `${d.getDate()} ${RU_MONTHS[d.getMonth()]}${withYear}`;
}

/**
 * Группирует лог попыток по календарным дням (локальное время устройства),
 * сортирует дни от новых к старым, а записи внутри дня — в порядке ответа.
 * @param {Array} historyLog
 */
function groupHistoryByDay(historyLog) {
  const byDay = {};
  historyLog.forEach((entry) => {
    const dayKey = startOfDay(entry.ts);
    if (!byDay[dayKey]) byDay[dayKey] = [];
    byDay[dayKey].push(entry);
  });
  return Object.keys(byDay)
    .map(Number)
    .sort((a, b) => b - a)
    .map((dayKey) => ({ dayKey, label: formatDayLabel(dayKey), entries: byDay[dayKey] }));
}

const DAY_MS = 86400000;
const CALENDAR_WEEKS = 14; // ~3 месяца — GitHub-стиль, но короче: у нас нет смысла тянуть на целый год данные, которых физически ещё не существует

/**
 * Строит сетку календаря активности (недели-колонки × 7 дней-строк,
 * воскресенье сверху — как в GitHub contribution graph), заканчивая
 * текущей неделей. Дни без единой попытки — count: 0, будущие дни
 * (после сегодня, в последней неполной неделе) помечены isFuture,
 * чтобы отрисовать их иначе, а не как "0 попыток".
 * @param {Array} historyLog
 */
function buildActivityCalendar(historyLog) {
  const counts = {};
  historyLog.forEach((e) => {
    const day = startOfDay(e.ts);
    counts[day] = (counts[day] || 0) + 1;
  });
  const todayStart = startOfDay(Date.now());
  const todayDow = new Date(todayStart).getDay(); // 0 = воскресенье
  const gridEnd = todayStart + (6 - todayDow) * DAY_MS; // конец текущей недели (суббота)
  const gridStart = gridEnd - (CALENDAR_WEEKS * 7 - 1) * DAY_MS;

  const weeks = [];
  for (let w = 0; w < CALENDAR_WEEKS; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const ts = gridStart + (w * 7 + d) * DAY_MS;
      week.push({ ts, count: counts[ts] || 0, isFuture: ts > todayStart, isToday: ts === todayStart });
    }
    weeks.push(week);
  }
  return weeks;
}

function activityColor(count, T) {
  if (count === 0) return T.surfaceAlt;
  if (count <= 2) return `${T.success}40`;
  if (count <= 5) return `${T.success}80`;
  return T.success;
}

/**
 * Календарь активности — сетка по образцу GitHub contribution graph:
 * колонка на неделю, 7 дней сверху вниз, интенсивность зелёного — по
 * числу попыток за день. Копится только с момента появления лога
 * истории (тот же historyLog, что и у "Истории обучения" по дням) —
 * дни до этого честно показываются пустыми, а не выдумываются.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {Array} props.historyLog
 */
const ActivityCalendar = memo(function ActivityCalendar({ T, historyLog }) {
  const weeks = useMemo(() => buildActivityCalendar(historyLog), [historyLog]);
  const cellSize = 16;
  const cellGap = 4;

  // Подписи месяцев над теми колонками, с которых начинается новый месяц
  const monthLabels = weeks.map((week, wi) => {
    const firstDay = new Date(week[0].ts);
    if (firstDay.getDate() > 7) return null; // подписываем только колонку, где месяц реально начинается
    if (wi === 0) return RU_MONTHS[firstDay.getMonth()].slice(0, 3);
    const prevWeekMonth = new Date(weeks[wi - 1][0].ts).getMonth();
    return firstDay.getMonth() !== prevWeekMonth ? RU_MONTHS[firstDay.getMonth()].slice(0, 3) : null;
  });

  return (
    <div style={{ overflowX: "auto" }}>
      <div style={{ display: "inline-block" }}>
        <div style={{ display: "flex", gap: cellGap, marginBottom: 6, marginLeft: 2 }}>
          {monthLabels.map((label, i) => (
            <div key={i} style={{ width: cellSize, fontSize: 11.5, color: T.textDim, textTransform: "capitalize", position: "relative" }}>
              {label && <span style={{ position: "absolute", left: 0, whiteSpace: "nowrap" }}>{label}</span>}
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: cellGap }}>
          {weeks.map((week, wi) => (
            <div key={wi} style={{ display: "flex", flexDirection: "column", gap: cellGap }}>
              {week.map((day, di) => (
                <div
                  key={di}
                  title={day.isFuture ? undefined : `${formatDayLabel(day.ts)}: ${day.count} ${day.count === 1 ? "попытка" : day.count < 5 && day.count > 0 ? "попытки" : "попыток"}`}
                  style={{
                    width: cellSize, height: cellSize, borderRadius: 4,
                    background: day.isFuture ? "transparent" : activityColor(day.count, T),
                    border: day.isToday ? `2px solid ${T.accent}` : day.isFuture ? "none" : `1px solid ${T.border}`,
                    boxSizing: "border-box",
                  }}
                />
              ))}
            </div>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10, fontSize: 12.5, color: T.textDim }}>
          <span>меньше</span>
          {[0, 1, 3, 6].map((c) => (
            <div key={c} style={{ width: cellSize, height: cellSize, borderRadius: 4, background: activityColor(c, T), border: `1px solid ${T.border}`, boxSizing: "border-box" }} />
          ))}
          <span>больше</span>
        </div>
      </div>
    </div>
  );
});

/**
 * Экран «История обучения»: что было отвечено сегодня, вчера и раньше,
 * с ✔/❌ по каждой попытке — реальный лог, а не пересчёт текущего
 * прогресса. Полезно смотреть спустя недели/месяцы, чтобы увидеть путь,
 * а не только текущий процент.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {Array} props.historyLog
 * @param {Object} props.answers
 */
const HistoryScreen = memo(function HistoryScreen({ T, historyLog, answers }) {
  const days = useMemo(() => groupHistoryByDay(historyLog), [historyLog]);

  // Вопросы, отвеченные до появления лога истории — есть в answers,
  // но ни разу не встречаются в historyLog. Показываем как есть,
  // без даты, честно помечая, что это "раньше".
  const legacyEntries = useMemo(() => {
    const loggedIds = new Set(historyLog.map((e) => e.questionId));
    return Object.keys(answers)
      .filter((id) => !loggedIds.has(id) && QUESTION_BY_ID[id])
      .map((id) => ({
        questionId: id,
        correct: answers[id]?.status === "correct",
        tags: QUESTION_BY_ID[id].tags || [],
        topicTitle: QUESTION_BY_ID[id].topicTitle,
      }));
  }, [historyLog, answers]);

  const isEmpty = days.length === 0 && legacyEntries.length === 0;

  function renderEntry(entry, idx) {
    const label = (entry.tags && entry.tags.length ? entry.tags.join(" / ") : entry.topicTitle);
    return (
      <div
        key={idx}
        style={{
          display: "flex", alignItems: "center", gap: 8, background: T.surfaceAlt,
          border: `1px solid ${T.border}`, borderRadius: 8, padding: "7px 12px", fontSize: 13,
        }}
      >
        {entry.correct ? (
          <Check size={14} strokeWidth={3} style={{ color: T.success, flexShrink: 0 }} />
        ) : (
          <XCircle size={14} strokeWidth={2.2} style={{ color: T.error, flexShrink: 0 }} />
        )}
        <span className="mono" style={{ color: T.text }}>{label}</span>
      </div>
    );
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 6 }}>
        📅 История обучения
      </div>
      <div style={{ fontSize: 13, color: T.textDim, marginBottom: 20, maxWidth: 560 }}>
        Что и когда было отвечено — по дням. Особенно интересно смотреть спустя месяц.
      </div>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 10 }}>
        Календарь активности
      </div>
      <div style={{ marginBottom: 26 }}>
        <ActivityCalendar T={T} historyLog={historyLog} />
      </div>

      {isEmpty ? (
        <EmptyState T={T} message="Пока пусто — ответь на несколько вопросов, и здесь появится история." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          {days.map((day) => (
            <div key={day.dayKey}>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.text, marginBottom: 10 }}>{day.label}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {day.entries.map((entry, i) => renderEntry(entry, `${day.dayKey}-${i}`))}
              </div>
            </div>
          ))}

          {legacyEntries.length > 0 && (
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.textDim, marginBottom: 10 }}>
                Раньше <span style={{ fontWeight: 400, fontStyle: "italic" }}>(до включения истории — без точной даты)</span>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {legacyEntries.map((entry, i) => renderEntry(entry, `legacy-${i}`))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
});

const BUG_SHUFFLED = shuffleValues(BUG_SNIPPETS, "find-the-bug");

/**
 * Тренажёр «Найди баг»: код показывается построчно, нужно кликнуть на
 * строку с проблемой (не выбрать из вариантов, не написать текст).
 * Полностью изолирован от прогресса курса, score — только в рамках
 * сессии этого экрана, как и в Sandbox/Predict.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 */
const FindBugScreen = memo(function FindBugScreen({ T }) {
  const [idx, setIdx] = useState(0);
  const [pickedLine, setPickedLine] = useState(null);
  const [checked, setChecked] = useState(false);
  const [score, setScore] = useState({ correct: 0, total: 0 });

  const snippet = BUG_SHUFFLED[idx];
  const lines = snippet.code.split("\n");
  const isLast = idx === BUG_SHUFFLED.length - 1;
  const isCorrect = checked && pickedLine === snippet.buggyLine;

  function pick(lineIdx) {
    if (checked) return;
    setPickedLine(lineIdx);
  }

  function check() {
    if (pickedLine === null || checked) return;
    setChecked(true);
    setScore((prev) => ({ correct: prev.correct + (pickedLine === snippet.buggyLine ? 1 : 0), total: prev.total + 1 }));
  }

  function next() {
    setIdx((i) => (i + 1) % BUG_SHUFFLED.length);
    setPickedLine(null);
    setChecked(false);
  }

  function restart() {
    setIdx(0);
    setPickedLine(null);
    setChecked(false);
    setScore({ correct: 0, total: 0 });
  }

  function lineStyle(i) {
    if (!checked) {
      return {
        background: pickedLine === i ? `${T.accent}33` : "transparent",
        borderLeft: pickedLine === i ? `3px solid ${T.accent}` : "3px solid transparent",
      };
    }
    if (i === snippet.buggyLine) {
      return { background: `${T.success}33`, borderLeft: `3px solid ${T.success}` };
    }
    if (i === pickedLine) {
      return { background: `${T.error}33`, borderLeft: `3px solid ${T.error}` };
    }
    return { background: "transparent", borderLeft: "3px solid transparent" };
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6, gap: 12, flexWrap: "wrap" }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700 }}>
          🐛 Найди баг
        </div>
        <button
          onClick={restart}
          style={{
            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 8,
            padding: "7px 12px", fontSize: 12.5, color: T.textDim, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
          }}
        >
          <RotateCcw size={13} strokeWidth={2.2} /> Начать заново
        </button>
      </div>
      <div style={{ fontSize: 13, color: T.textDim, marginBottom: 16, maxWidth: 560 }}>
        Кликни на строку, где спрятана проблема — не выбирай из списка, а именно найди её в коде.
      </div>

/* ============================================================
   SCOPE — цепочка областей видимости (scope chain)
   ============================================================ */

const SCOPE_CODE = [
  "let x = 'global';",
  "",
  "function outer() {",
  "  let y = 'outer';",
  "",
  "  function inner() {",
  "    let z = 'inner';",
  "    console.log(x, y, z);",
  "  }",
  "",
  "  inner();",
  "}",
  "",
  "outer();",
];

const G = { name: "Global", vars: [{ name: "x", value: "'global'" }] };
const O = { name: "outer()", vars: [{ name: "y", value: "'outer'" }] };
const I = { name: "inner()", vars: [{ name: "z", value: "'inner'" }] };

const SCOPE_STEPS = [
  { line: null, scopes: [], lookup: null, output: [], note: "Начинаем. Пока не создано ни одной области видимости, кроме глобальной." },
  { line: 0, scopes: [G], lookup: null, output: [], note: "let x — переменная попадает в глобальную область видимости." },
  { line: 13, scopes: [G], lookup: null, output: [], note: "outer() вызывается — это создаст новую область видимости, вложенную в глобальную." },
  { line: 2, scopes: [G, { name: "outer()", vars: [] }], lookup: null, output: [], note: "Внутри outer() открывается новая, вложенная область видимости." },
  { line: 3, scopes: [G, O], lookup: null, output: [], note: "let y — переменная попадает в область видимости outer(), а не в глобальную." },
  { line: 10, scopes: [G, O], lookup: null, output: [], note: "inner() вызывается — откроется ещё одна, ещё более вложенная область видимости." },
  { line: 5, scopes: [G, O, { name: "inner()", vars: [] }], lookup: null, output: [], note: "Внутри inner() — третий, самый вложенный уровень." },
  { line: 6, scopes: [G, O, I], lookup: null, output: [], note: "let z — переменная видна только внутри inner()." },
  { line: 7, scopes: [G, O, I], lookup: { variable: "z", foundIn: "inner()" }, output: [], note: "console.log ищет z — и сразу находит её в текущей, самой близкой области видимости." },
  { line: 7, scopes: [G, O, I], lookup: { variable: "y", foundIn: "outer()" }, output: [], note: "Ищет y — в inner() такой переменной нет, поднимается на уровень выше, в outer() — находит." },
  { line: 7, scopes: [G, O, I], lookup: { variable: "x", foundIn: "Global" }, output: [], note: "Ищет x — нет ни в inner(), ни в outer(), поднимается до самого верха, в Global — находит." },
  { line: 7, scopes: [G, O, I], lookup: null, output: ["global outer inner"], note: "Все три переменные найдены. Это и есть цепочка областей видимости — поиск идёт снизу вверх, изнутри наружу." },
  { line: 8, scopes: [G, O], lookup: null, output: ["global outer inner"], note: "inner() завершился — его область видимости (и z вместе с ней) уничтожается." },
  { line: 11, scopes: [G], lookup: null, output: ["global outer inner"], note: "outer() тоже завершился — его область видимости (и y) тоже уничтожается." },
  { line: null, scopes: [G], lookup: null, output: ["global outer inner"], note: "Остаётся только глобальная область видимости с x. Важно: снаружи никогда не видно y и z — подняться по цепочке можно только изнутри наружу, не наоборот." },
];

/**
 * Пошаговая визуализация цепочки областей видимости (scope chain):
 * как вложенные функции видят переменные внешних функций, но не
 * наоборот, и как устроен поиск переменной вверх по цепочке.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 */
const ScopeViz = memo(function ScopeViz({ T }) {
  const [stepIdx, setStepIdx] = useState(0);
  const step = SCOPE_STEPS[stepIdx];
  const isFirst = stepIdx === 0;
  const isLast = stepIdx === SCOPE_STEPS.length - 1;

  function renderNested(scopes) {
    if (scopes.length === 0) {
      return <div style={{ fontSize: 12, color: T.textDim, fontStyle: "italic" }}>пока ничего не создано</div>;
    }
    // рендерим рекурсивно с вложенностью — каждый следующий уровень
    // отступает внутрь предыдущего, визуально показывая вложенность scope
    function renderLevel(i) {
      const s = scopes[i];
      const isDeepest = i === scopes.length - 1;
      const highlighted = step.lookup && step.lookup.foundIn === s.name;
      return (
        <div
          key={s.name}
          style={{
            border: `1.5px solid ${highlighted ? T.success : T.border}`,
            background: highlighted ? `${T.success}14` : T.surfaceAlt,
            borderRadius: 10, padding: 12,

  { line: 0, chain: [], lookup: null, output: [], note: "Создаём animal — обычный объект со свойством eats и методом walk." },
  { line: 5, chain: [P_RABBIT_EMPTY, P_ANIMAL], lookup: null, output: [], note: "rabbit создаётся через Object.create(animal) — это значит, что скрытая ссылка rabbit → [[Prototype]] указывает на animal. Собственных свойств у rabbit пока нет." },
  { line: 6, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: null, output: [], note: "rabbit.jumps = true — добавляем СОБСТВЕННОЕ свойство прямо на rabbit, а не в animal." },
  { line: 8, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: { variable: "jumps", foundIn: "rabbit" }, output: [], note: "rabbit.jumps — движок сначала смотрит на сам rabbit. Находит сразу же — это собственное свойство, подниматься по цепочке не нужно." },
  { line: 8, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: { variable: "jumps", foundIn: "rabbit" }, output: ["true"], note: "Выводится true." },
  { line: 9, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: { variable: "eats", foundIn: "animal" }, output: ["true"], note: "rabbit.eats — на самом rabbit такого свойства нет. Движок поднимается по цепочке на уровень выше, в animal — и находит его там." },
  { line: 9, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: { variable: "eats", foundIn: "animal" }, output: ["true", "true"], note: "Выводится true — свойство унаследовано из прототипа, а не лежит на самом rabbit." },
  { line: 10, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: { variable: "walk", foundIn: "animal" }, output: ["true", "true"], note: "rabbit.walk() — метод walk тоже не свой у rabbit, находится в animal. Методы обычно живут именно в прототипе — так они не копируются в каждый отдельный объект." },
  { line: 10, chain: [P_RABBIT_FULL, P_ANIMAL], lookup: { variable: "walk", foundIn: "animal" }, output: ["true", "true", "'идёт'"], note: "Выводится 'идёт'." },
  { line: 11, chain: [P_RABBIT_FULL, P_ANIMAL, P_OBJECT_PROTO, P_NULL], lookup: { variable: "flies", foundIn: null }, output: ["true", "true", "'идёт'"], note: "rabbit.flies — ищем на rabbit (нет), поднимаемся в animal (нет), поднимаемся в Object.prototype (тоже нет). Цепочка заканчивается на null — подниматься дальше некуда." },
  { line: 11, chain: [P_RABBIT_FULL, P_ANIMAL, P_OBJECT_PROTO, P_NULL], lookup: { variable: "flies", foundIn: null }, output: ["true", "true", "'идёт'", "undefined"], note: "Когда свойство не нашлось нигде вплоть до null — результат undefined. Это и есть цепочка прототипов: поиск идёт вверх по [[Prototype]], пока не найдётся значение или цепочка не закончится в null." },

/**
 * Пошаговая визуализация цепочки прототипов (prototype chain):
 * почему rabbit видит свойства animal, даже не имея их у себя, и что
 * происходит, когда свойства нет нигде по всей цепочке до null.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 */
const PrototypeViz = memo(function PrototypeViz({ T }) {
  const [stepIdx, setStepIdx] = useState(0);
  const step = PROTOTYPE_STEPS[stepIdx];
  const isFirst = stepIdx === 0;
  const isLast = stepIdx === PROTOTYPE_STEPS.length - 1;

  function renderChain(chain) {
    if (chain.length === 0) {
      return <div style={{ fontSize: 12, color: T.textDim, fontStyle: "italic" }}>цепочка ещё не создана</div>;
    }
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
        {chain.map((s, idx) => {
          const isNull = s.name === "null";
          const found = step.lookup && step.lookup.foundIn === s.name;
          const exhausted = isNull && step.lookup && step.lookup.foundIn === null;
          const dim = isNull || s.name === "Object.prototype";
          return (
            <React.Fragment key={s.name}>
              {idx > 0 && <ArrowRight size={14} strokeWidth={2.2} style={{ color: T.textDim, flexShrink: 0 }} />}
              <div
                style={{
                  border: `1.5px ${isNull ? "dashed" : "solid"} ${found ? T.success : exhausted ? T.error : T.border}`,
                  background: found ? `${T.success}14` : exhausted ? `${T.error}14` : dim ? "transparent" : T.surfaceAlt,
                  borderRadius: 10, padding: 12, minWidth: 130,
                }}
              >
                <div
                  className="mono"
                  style={{
                    fontSize: 11, fontWeight: 700, marginBottom: s.vars.length ? 8 : 0,
                    color: found ? T.success : exhausted ? T.error : T.accent,
                    textTransform: "uppercase", letterSpacing: "0.04em",
                  }}
                >
                  {s.name}
                </div>
                {s.vars.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    {s.vars.map((v) => (
                      <div key={v.name} className="mono" style={{ fontSize: 12, color: T.text }}>
                        {v.name}: <span style={{ color: T.accent2 }}>{v.value}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </React.Fragment>
          );
        })}
      </div>
    );
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 6 }}>
        🧬 Prototype — цепочка прототипов
      </div>
      <div style={{ fontSize: 13, color: T.textDim, marginBottom: 18, maxWidth: 560 }}>
        Объект видит не только свои собственные свойства, но и свойства своего прототипа —
        и прототипа прототипа, и так далее вверх по цепочке, пока она не закончится на null.
      </div>

      <pre className="mono" style={{ background: T.console, color: T.consoleText, borderRadius: 9, padding: "12px 14px", fontSize: 13, lineHeight: 1.7, marginBottom: 16, overflowX: "auto" }}>
        {PROTOTYPE_CODE.map((line, i) => (
          <div key={i} style={{ background: step.line === i ? `${T.accent}33` : "transparent", borderLeft: step.line === i ? `3px solid ${T.accent}` : "3px solid transparent", padding: "0 8px", marginLeft: -8 }}>
            {line || "\u00A0"}
          </div>
        ))}
      </pre>

      <div style={{ marginBottom: 16, overflowX: "auto" }}>{renderChain(step.chain)}</div>

      {step.lookup && (
        <div style={{ fontSize: 12.5, color: T.textDim, marginBottom: 12, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          🔍 ищем <span className="mono" style={{ color: T.text, fontWeight: 600 }}>{step.lookup.variable}</span>
          {step.lookup.foundIn ? (
            <> → нашли в <span className="mono" style={{ color: T.success, fontWeight: 600 }}>{step.lookup.foundIn}</span></>
          ) : (
            <> → <span className="mono" style={{ color: T.error, fontWeight: 600 }}>нигде не нашли</span></>
          )}
        </div>
      )}

      <div style={{ background: `${T.accent}14`, border: `1px solid ${T.accent}44`, borderRadius: 9, padding: "10px 14px", fontSize: 13.5, lineHeight: 1.6, color: T.text, marginBottom: 16 }}>
        {step.note}
      </div>

      <div style={{ background: T.console, borderRadius: 9, overflow: "hidden", border: `1px solid ${T.border}`, marginBottom: 16 }}>
        <div style={{ padding: "6px 12px", fontSize: 10.5, letterSpacing: "0.06em", textTransform: "uppercase", color: "#7A7A90", borderBottom: "1px solid #FFFFFF14", display: "flex", alignItems: "center", gap: 5 }}>
          <Terminal size={11} strokeWidth={2.2} /> console
        </div>
        <div style={{ padding: "10px 12px", fontSize: 13, minHeight: 20 }} className="mono">
          {step.output.length === 0 ? (
            <div style={{ color: "#7A7A90" }}>// пока ничего не выведено</div>
          ) : (
            step.output.map((l, i) => (
              <div key={i} style={{ color: T.consoleText }}><span style={{ color: T.accent2 }}>❯ </span>{l}</div>
            ))
          )}
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <span style={{ fontSize: 12, color: T.textDim }}>Шаг {stepIdx + 1} из {PROTOTYPE_STEPS.length}</span>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setStepIdx(0)} disabled={isFirst} style={{ background: "transparent", border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 12px", fontSize: 12.5, color: isFirst ? T.textDim : T.text, cursor: isFirst ? "default" : "pointer", opacity: isFirst ? 0.5 : 1, display: "flex", alignItems: "center", gap: 5 }}>
            <RotateCcw size={13} strokeWidth={2.2} /> Сначала
          </button>
          <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={isFirst} style={{ background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 14px", fontSize: 12.5, color: isFirst ? T.textDim : T.text, cursor: isFirst ? "default" : "pointer", opacity: isFirst ? 0.5 : 1, display: "flex", alignItems: "center", gap: 5 }}>
            <ArrowLeft size={13} strokeWidth={2.2} /> Назад
          </button>
          <button onClick={() => setStepIdx((i) => Math.min(PROTOTYPE_STEPS.length - 1, i + 1))} disabled={isLast} style={{ background: isLast ? T.surfaceAlt : T.accent, border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 12.5, fontWeight: 600, color: isLast ? T.textDim : "#fff", cursor: isLast ? "default" : "pointer", display: "flex", alignItems: "center", gap: 5 }}>
            {isLast ? "Готово" : "Следующий шаг"} {!isLast && <ArrowRight size={13} strokeWidth={2.2} />}
          </button>
        </div>
      </div>
    </div>
  );
});

/**
 * Пошаговая визуализация всплытия событий (event bubbling):
 * клик по самому вложенному элементу запускает обработчики не только
 * на нём, но и на всех его родителях — снизу вверх по DOM-дереву.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 */
const BubblingViz = memo(function BubblingViz({ T }) {
  const [stepIdx, setStepIdx] = useState(0);
  const step = BUBBLING_STEPS[stepIdx];
  const isFirst = stepIdx === 0;
  const isLast = stepIdx === BUBBLING_STEPS.length - 1;

  function domBox(id, label, children) {
    const isActive = step.active === id;
    const hasFired = step.fired.includes(id);
    return (
      <div
        style={{
          border: `1.5px solid ${isActive ? T.accent : hasFired ? T.success : T.border}`,
          background: isActive ? `${T.accent}14` : hasFired ? `${T.success}0D` : T.surfaceAlt,
          borderRadius: 10, padding: 14,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: children ? 10 : 0 }}>
          <span className="mono" style={{ fontSize: 11, fontWeight: 700, color: isActive ? T.accent : hasFired ? T.success : T.textDim, textTransform: "uppercase", letterSpacing: "0.04em" }}>
            {label}
          </span>
          {isActive && <span style={{ fontSize: 14 }}>🫧</span>}
          {hasFired && <Check size={13} strokeWidth={3} style={{ color: T.success }} />}
        </div>
        {children}
      </div>
    );

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 6 }}>
        🫧 Event Bubbling — всплытие событий
      </div>
      <div style={{ fontSize: 13, color: T.textDim, marginBottom: 18, maxWidth: 560 }}>
        Клик по вложенному элементу не остаётся только на нём — событие поднимается вверх
        по дереву DOM, запуская обработчики всех родителей по пути.
      </div>

      <pre className="mono" style={{ background: T.console, color: T.consoleText, borderRadius: 9, padding: "12px 14px", fontSize: 13, lineHeight: 1.7, marginBottom: 16, overflowX: "auto" }}>
        {BUBBLING_CODE.map((line, i) => (
          <div key={i} style={{ background: step.line === i ? `${T.accent}33` : "transparent", borderLeft: step.line === i ? `3px solid ${T.accent}` : "3px solid transparent", padding: "0 8px", marginLeft: -8 }}>
            {line || "\u00A0"}
          </div>
        ))}
      </pre>

      <div style={{ marginBottom: 16 }}>
        {domBox("outer", "#outer", (
          <div style={{ marginLeft: 14 }}>
            {domBox("middle", "#middle", (
              <div style={{ marginLeft: 14 }}>
                {domBox("inner", "🔘 #inner (button)")}
              </div>
            ))}
          </div>
        ))}
      </div>

      <div style={{ background: `${T.accent}14`, border: `1px solid ${T.accent}44`, borderRadius: 9, padding: "10px 14px", fontSize: 13.5, lineHeight: 1.6, color: T.text, marginBottom: 16 }}>
        {step.note}
      </div>

      <div style={{ background: T.console, borderRadius: 9, overflow: "hidden", border: `1px solid ${T.border}`, marginBottom: 16 }}>
        <div style={{ padding: "6px 12px", fontSize: 10.5, letterSpacing: "0.06em", textTransform: "uppercase", color: "#7A7A90", borderBottom: "1px solid #FFFFFF14", display: "flex", alignItems: "center", gap: 5 }}>
          <Terminal size={11} strokeWidth={2.2} /> console
        </div>
        <div style={{ padding: "10px 12px", fontSize: 13, minHeight: 20 }} className="mono">
          {step.output.length === 0 ? (
            <div style={{ color: "#7A7A90" }}>// пока ничего не выведено</div>
          ) : (
            step.output.map((l, i) => (
              <div key={i} style={{ color: T.consoleText }}><span style={{ color: T.accent2 }}>❯ </span>{l}</div>
            ))

        </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <span style={{ fontSize: 12, color: T.textDim }}>Шаг {stepIdx + 1} из {BUBBLING_STEPS.length}</span>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setStepIdx(0)} disabled={isFirst} style={{ background: "transparent", border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 12px", fontSize: 12.5, color: isFirst ? T.textDim : T.text, cursor: isFirst ? "default" : "pointer", opacity: isFirst ? 0.5 : 1, display: "flex", alignItems: "center", gap: 5 }}>
            <RotateCcw size={13} strokeWidth={2.2} /> Сначала

          <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={isFirst} style={{ background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, padding: "8px 14px", fontSize: 12.5, color: isFirst ? T.textDim : T.text, cursor: isFirst ? "default" : "pointer", opacity: isFirst ? 0.5 : 1, display: "flex", alignItems: "center", gap: 5 }}>

          </button>
        </div>
      </div>
    </div>
  );
});


/**

 * @param {Object} props
 * @param {ThemeTokens} props.T

 * @param {Object|null} props.liveObj - Текущий живой объект (button/card/title/el)
 * @param {number} props.tick - Не используется в разметке напрямую — существует
 *   только чтобы «пробить» React.memo: liveObj мутируется на месте (та же

 */
const LiveDomPreview = memo(function LiveDomPreview({ T, kind, liveObj, tick, label, onClickButton }) {
  const bg = liveObj?.style?.backgroundColor || T.surfaceAlt;
  const text = liveObj?.textContent || "(пусто — задай textContent)";
  const classes = liveObj?.classList?.list || [];
  const isActive = classes.includes("active");
  const hasClickHandler = typeof liveObj?.handlers?.click === "function";

  const [flash, setFlash] = useState(false);
  function handleClick() {
    onClickButton();
    setFlash(true);
    setTimeout(() => setFlash(false), 350);
  }

  return (
    <div
      style={{
        marginTop: 12, background: T.surfaceAlt, border: `1px dashed ${T.border}`,
        borderRadius: 9, padding: "12px 14px",
