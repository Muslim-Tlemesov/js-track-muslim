/* ============================================================
   КАСТОМНЫЕ ХУКИ — вынесенное состояние и бизнес-логика App()
   ============================================================
   App() был "божественным компонентом": ~2000 строк, десятки useState/
   useCallback, всё вперемешку с JSX. Ниже — попытка вынести самые
   самостоятельные куски состояния в отдельные хуки, каждый со своей
   загрузкой из storage и своей логикой обновления, не трогая внешнее
   поведение приложения. Внешний CDN-стор (Zustand/Redux Toolkit)
   сознательно не использован — см. обсуждение: у Zustand нет
   готового browser-global билда для подключения голым <script>-тегом
   без сборщика, а Redux Toolkit тянет несколько пакетов сразу. Для
   ОДНОГО дерева экранов (не нескольких несвязанных страниц) обычные
   хуки поверх useState дают ту же изоляцию бизнес-логики без единой
   новой внешней зависимости.

   Разобраны не ВСЕ куски состояния — навигация между вопросами
   (двухфазный переход карточек) и сама отправка ответа (submitQuiz/
   submitCode) остались в App(): они слишком плотно завязаны на JSX
   конкретных экранов (DOM-рефы редактора кода, анимация карточки),
   и вынос дал бы больше риска регрессии, чем пользы от разделения.
   ============================================================ */

/**
 * Тема оформления (тёмная/светлая) — читает/пишет THEME_KEY, отдаёт
 * готовый набор цветов T.
 */
function useTheme() {
  const [themeMode, setThemeMode] = useState("dark");

  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(THEME_KEY);
        const saved = res && res.value ? JSON.parse(res.value) : null;
        if (saved === "dark" || saved === "light") setThemeMode(saved);
      } catch {
        // ключа ещё нет или повреждён — остаёмся на теме по умолчанию
      }
    })();
  }, []);

  const toggleTheme = useCallback(() => {
    setThemeMode((prev) => {
      const next = prev === "dark" ? "light" : "dark";
      safeStorage.set(THEME_KEY, JSON.stringify(next));
      return next;
    });
  }, []);

  return { themeMode, T: THEMES[themeMode], toggleTheme };
}

/**
 * Переключатель звуковых эффектов (фанфары/победный "динь") —
 * читает/пишет SOUND_KEY.
 */
function useSound() {
  const [soundEnabled, setSoundEnabled] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(SOUND_KEY);
        const saved = res && res.value ? JSON.parse(res.value) : null;
        if (saved === "off") setSoundEnabled(false);
      } catch {
        // ключа ещё нет — звук включён по умолчанию
      }
    })();
  }, []);

  const toggleSound = useCallback(() => {
    setSoundEnabled((prev) => {
      const next = !prev;
      safeStorage.set(SOUND_KEY, JSON.stringify(next ? "on" : "off"));
      return next;
    });
  }, []);

  return { soundEnabled, toggleSound };
}

/**
 * Гид для новичков — показывается ровно один раз, при самом первом
 * визите (до того, как пользователь успел хоть что-то ответить).
 * onboardingLoaded нужен, чтобы не показать гид на долю секунды ДО
 * того, как подгрузится сохранённый флаг "уже видел" — так же, как
 * answersLoaded защищает от ложного показа других тостов при загрузке.
 */
function useOnboarding() {
  const [onboardingSeen, setOnboardingSeen] = useState(true); // true по умолчанию — безопаснее не показать лишний раз, чем показать раньше времени
  const [onboardingLoaded, setOnboardingLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(ONBOARDING_SEEN_KEY);
        setOnboardingSeen(res && res.value === "1");
      } catch {
        setOnboardingSeen(false); // ключа ещё нет — значит, это первый визит
      }
      setOnboardingLoaded(true);
    })();
  }, []);

  const dismissOnboarding = useCallback(() => {
    setOnboardingSeen(true);
    safeStorage.set(ONBOARDING_SEEN_KEY, "1");
  }, []);

  return { onboardingSeen, onboardingLoaded, dismissOnboarding };
}

/**
 * XP, звание (ранг по очкам опыта) и связанные всплывающие подсказки —
 * начисление очков, вычисление текущего звания по формуле, обнаружение
 * момента повышения (тост «Байт: Поздравляю! Новое звание — ...»).
 */
function useXpAndRank() {
  const [xp, setXp] = useState(0);
  const [xpLoaded, setXpLoaded] = useState(false);
  const [rankToast, setRankToast] = useState(null); // number | null — новый ранг
  const [xpFloat, setXpFloat] = useState(null); // { amount, key } | null
  const prevRankRef = useRef(null); // null = ещё не инициализировано

  useEffect(() => {
    (async () => {
      let xpValue = 0;
      try {
        const res = await safeStorage.get(XP_KEY);
        if (res && res.value) xpValue = JSON.parse(res.value).xp || 0;
      } catch {
        // первого запуска ещё не было
      }
      setXp(xpValue);
      setXpLoaded(true);
    })();
  }, []);

  // rank — текущее звание игрока по очкам опыта (независимая
  // прогрессия, не связанная со сложностью тем). rankXpIntoRank/
  // rankXpForNext нужны для полоски прогресса до следующего звания.
  const rank = useMemo(() => rankForXp(xp), [xp]);
  const rankThresholdCurrent = useMemo(() => xpThresholdForRank(rank), [rank]);
  const rankThresholdNext = useMemo(() => xpThresholdForRank(rank + 1), [rank]);
  const rankXpIntoRank = xp - rankThresholdCurrent;
  const rankXpForNext = rankThresholdNext - rankThresholdCurrent;

  // Тост о новом звании — сравниваем с прошлым значением через реф и
  // не показываем ложное срабатывание при самой первой загрузке XP с диска.
  useEffect(() => {
    if (!xpLoaded) return;
    const prev = prevRankRef.current;
    if (prev === null) {
      prevRankRef.current = rank;
      return;
    }
    if (rank > prev) {
      prevRankRef.current = rank;
      setRankToast(rank);
      const timer = setTimeout(() => setRankToast(null), 4000);
      return () => clearTimeout(timer);
    }
    prevRankRef.current = rank;
  }, [xpLoaded, rank]);

  // Автоматически прячет всплывающую подпись «+25 XP» через 1.1с.
  useEffect(() => {
    if (!xpFloat) return;
    const timer = setTimeout(() => setXpFloat(null), 1100);
    return () => clearTimeout(timer);
  }, [xpFloat]);

  const addXp = useCallback((amount) => {
    setXp((prev) => {
      const next = prev + amount;
      safeStorage.set(XP_KEY, JSON.stringify({ xp: next }));
      return next;
    });
    setXpFloat({ amount, key: Date.now() });
  }, []);

  const resetXp = useCallback(() => {
    setXp(0);
    prevRankRef.current = 1;
    safeStorage.set(XP_KEY, JSON.stringify({ xp: 0 }));
  }, []);

  return { xp, xpLoaded, rank, rankToast, setRankToast, xpFloat, rankXpIntoRank, rankXpForNext, addXp, resetXp };
}

/**
 * Ежедневная серия занятий (не путать с currentStreak/bestStreak
 * внутри достижений — та серия ВЕРНЫХ ОТВЕТОВ ПОДРЯД, другое понятие).
 * Вычисляется один раз при загрузке: сравнивает сохранённую дату
 * последнего занятия с сегодня/вчера и либо продолжает серию, либо
 * обнуляет её (с коротким уведомлением о разрыве).
 */
function useDailyStreak() {
  const [streak, setStreak] = useState(null); // { count, best, lastDate } | null пока не загружено
  const [brokenStreakNotice, setBrokenStreakNotice] = useState(null); // число дней прерванной серии, или null

  useEffect(() => {
    (async () => {
      let record = { count: 0, best: 0, lastDate: null };
      try {
        const res = await safeStorage.get(STREAK_KEY);
        if (res && res.value) record = JSON.parse(res.value);
      } catch {
        // первого запуска ещё не было
      }
      // record.best может отсутствовать у записей, сохранённых до того,
      // как рекорд стали хранить отдельно — считаем как раньше не было
      const prevBest = record.best || 0;
      const today = new Date();
      const todayStr = today.toISOString().slice(0, 10);
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      let nextRecord;
      if (record.lastDate === todayStr) {
        nextRecord = { count: record.count, best: Math.max(prevBest, record.count), lastDate: todayStr };
      } else if (record.lastDate === yesterdayStr) {
        const count = record.count + 1;
        nextRecord = { count, best: Math.max(prevBest, count), lastDate: todayStr };
      } else {
        // разрыв в датах (или самый первый запуск): серия обнуляется.
        // Если до этого что-то накопилось — покажем короткое уведомление,
        // что серия прервалась, прежде чем начать заново с 1.
        if (record.count > 1) setBrokenStreakNotice(record.count);
        nextRecord = { count: 1, best: Math.max(prevBest, 1), lastDate: todayStr };
      }
      setStreak(nextRecord);
      safeStorage.set(STREAK_KEY, JSON.stringify(nextRecord));
    })();
  }, []);

  return { streak, brokenStreakNotice, setBrokenStreakNotice };
}

/**
 * Достижения (медали), серия ВЕРНЫХ ОТВЕТОВ ПОДРЯД (currentStreak/
 * bestStreak — НЕ дневная серия, см. useDailyStreak выше) и самый
 * быстрый верный ответ. Принимает извне то, что нужно для проверки
 * условий достижений (totalCorrect, topicProgress, isLevelUnlocked,
 * answersLoaded) — эти значения считаются в других частях состояния
 * (ответы/прогресс), достижения лишь читают их.
 *
 * @param {Object} deps
 * @param {boolean} deps.answersLoaded
 * @param {number} deps.totalCorrect
 * @param {Object} deps.topicProgress
 * @param {boolean} deps.isLevelUnlocked
 */
const INITIAL_ACHIEVEMENTS_STATE = { unlockedAchievements: {}, currentStreak: 0, bestStreak: 0, fastestAnswerMs: null };

/**
 * unlockedAchievements/currentStreak/bestStreak/fastestAnswerMs всегда
 * меняются вместе по одному и тому же событию («засчитан ответ») и
 * сохраняются в хранилище одним объектом — ровно тот случай, когда
 * useReducer честнее нескольких useState. Раньше bumpProgress был
 * вынужден вкладывать три setState-с-функцией друг в друга только ради
 * того, чтобы получить доступ ко всем трём prev-значениям сразу — и
 * именно в этой вложенности нашёлся реальный баг (React не гарантирует
 * синхронный порядок вложенных апдейтеров, как казалось). У reducer'а
 * это не проблема в принципе: он получает ВСЁ состояние сразу первым
 * аргументом, без вложенности.
 */
function achievementsReducer(state, action) {
  switch (action.type) {
    case "loaded":
      return {
        unlockedAchievements: Object.fromEntries(action.unlocked.map((id) => [id, true])),
        currentStreak: action.currentStreak,
        bestStreak: action.bestStreak,
        fastestAnswerMs: action.fastestAnswerMs ?? null,
      };
    case "answer_submitted": {
      const nextCurrent = nextStreakAfterAnswer(state.currentStreak, action.isCorrect);
      return {
        ...state,
        currentStreak: nextCurrent,
        bestStreak: nextBestStreak(state.bestStreak, nextCurrent),
        fastestAnswerMs: nextFastestAnswer(state.fastestAnswerMs, action.isCorrect, action.elapsedMs),
      };
    }
    case "unlock_achievements": {
      const unlockedAchievements = { ...state.unlockedAchievements };
      action.ids.forEach((id) => { unlockedAchievements[id] = true; });
      return { ...state, unlockedAchievements };
    }
    case "reset":
      return INITIAL_ACHIEVEMENTS_STATE;
    default:
      return state;
  }
}

function useAchievements({ answersLoaded, totalCorrect, topicProgress, isLevelUnlocked }) {
  const [state, dispatch] = useReducer(achievementsReducer, INITIAL_ACHIEVEMENTS_STATE);
  const { unlockedAchievements, currentStreak, bestStreak, fastestAnswerMs } = state;
  const [achievementsLoaded, setAchievementsLoaded] = useState(false);
  const [achievementToast, setAchievementToast] = useState(null); // Achievement | null
  const achievementToastQueueRef = useRef([]);

  useEffect(() => {
    (async () => {
      let achRecord = { unlocked: [], bestStreak: 0, currentStreak: 0, fastestAnswerMs: null };
      try {
        const res = await safeStorage.get(ACHIEVEMENTS_KEY);
        if (res && res.value) achRecord = { ...achRecord, ...JSON.parse(res.value) };
      } catch {
        // первого запуска ещё не было
      }
      dispatch({ type: "loaded", ...achRecord });
      setAchievementsLoaded(true);
    })();
  }, []);

  // Сохраняет unlockedAchievements/currentStreak/bestStreak/fastestAnswerMs
  // одним объектом при КАЖДОМ изменении state — раньше запись в хранилище
  // была разбросана по нескольким местам (bumpProgress, эффект проверки
  // достижений, resetAchievements), каждое из которых само решало, что
  // именно сохранить. Теперь источник состояния один (reducer), и
  // сохранение тоже одно — реагирует на сам state, а не дублируется
  // в каждом месте, которое его меняет. achievementsLoaded в условии —
  // чтобы не перезаписать хранилище пустым состоянием ДО того, как
  // сохранённый прогресс успел загрузиться.
  useEffect(() => {
    if (!achievementsLoaded) return;
    safeStorage.set(
      ACHIEVEMENTS_KEY,
      JSON.stringify({
        unlocked: Object.keys(unlockedAchievements),
        currentStreak,
        bestStreak,
        fastestAnswerMs,
      })
    );
  }, [achievementsLoaded, unlockedAchievements, currentStreak, bestStreak, fastestAnswerMs]);

  // Обновляет серию верных ответов подряд И рекорд скорости после каждого
  // нового ответа (вызывается из submitQuiz/submitCode). При ошибке серия
  // обнуляется; при верном ответе растёт, а bestStreak запоминает максимум
  // за всё время — именно он проверяется достижением 🔥 «10 подряд».
  // elapsedMs — сколько прошло с появления вопроса до ответа (см.
  // questionStartRef); если ответ верный и это быстрее прежнего рекорда,
  // обновляем fastestAnswerMs — его проверяет достижение ⚡ «за 10 секунд».
  const bumpProgress = useCallback((isCorrect, elapsedMs) => {
    dispatch({ type: "answer_submitted", isCorrect, elapsedMs });
  }, []);

  // Проверяет условия всех достижений при каждом изменении прогресса и
  // «разлочивает» новые. answersLoaded/achievementsLoaded в зависимостях —
  // чтобы не поймать ложное открытие при первой подгрузке сохранённого
  // прогресса, как и в эффекте открытия уровня в App().
  useEffect(() => {
    if (!answersLoaded || !achievementsLoaded) return;
    const ctx = { totalCorrect, bestStreak, topicProgress, isLevelUnlocked, fastestAnswerMs };
    const newlyUnlocked = ACHIEVEMENTS.filter(
      (a) => !unlockedAchievements[a.id] && a.check(ctx)
    );
    if (newlyUnlocked.length === 0) return;
    dispatch({ type: "unlock_achievements", ids: newlyUnlocked.map((a) => a.id) });
    achievementToastQueueRef.current.push(...newlyUnlocked);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [answersLoaded, achievementsLoaded, totalCorrect, bestStreak, topicProgress, isLevelUnlocked, fastestAnswerMs]);

  // Показывает достижения из очереди по одному, чтобы несколько
  // одновременных «разлоков» не перекрывали друг друга одним тостом.
  useEffect(() => {
    if (achievementToast) return;
    const next = achievementToastQueueRef.current.shift();
    if (next) {
      setAchievementToast(next);
      const timer = setTimeout(() => setAchievementToast(null), 4000);
      return () => clearTimeout(timer);
    }
  }, [achievementToast, unlockedAchievements]);

  const resetAchievements = useCallback(() => {
    dispatch({ type: "reset" });
  }, []);

  const dismissAchievementToast = useCallback(() => setAchievementToast(null), []);

  return {
    unlockedAchievements, currentStreak, bestStreak, fastestAnswerMs, achievementsLoaded,
    achievementToast, dismissAchievementToast, bumpProgress, resetAchievements,
  };
}

/**
 * Лог истории обучения — что и когда было отвечено, по одной записи
 * на КАЖДУЮ попытку (в отличие от answers, который хранит только
 * ПОСЛЕДНИЙ статус на вопрос). Хранится не более MAX_HISTORY_ENTRIES
 * последних попыток — старые обрезаются, чтобы сторадж не рос
 * бесконечно у активных пользователей.
 */
function useHistoryLog() {
  const [historyLog, setHistoryLog] = useState([]);

  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(HISTORY_KEY);
        if (res && res.value) setHistoryLog(JSON.parse(res.value));
      } catch {
        // истории ещё нет — это нормально при первом запуске или для старого прогресса
      }
    })();
  }, []);

  const logHistoryEntry = useCallback((entry) => {
    setHistoryLog((prev) => {
      const next = [...prev, { ...entry, ts: Date.now() }];
      const trimmed = next.length > MAX_HISTORY_ENTRIES ? next.slice(next.length - MAX_HISTORY_ENTRIES) : next;
      safeStorage.set(HISTORY_KEY, JSON.stringify(trimmed));
      return trimmed;
    });
  }, []);

  const resetHistory = useCallback(() => {
    setHistoryLog([]);
    safeStorage.set(HISTORY_KEY, JSON.stringify([]));
  }, []);

  return { historyLog, logHistoryEntry, resetHistory };
}

/**
 * Ответы пользователя, прогресс по темам/уровням сложности и
 * обнаружение момента открытия нового уровня. soundEnabled нужен
 * только для фанфары при открытии уровня — приходит из useSound().
 */
/**
 * Чистые функции прогресса — вынесены из useAnswers() специально, чтобы
 * их можно было протестировать напрямую (передать answers, проверить
 * результат), не рендеря вообще никакого React. Сам хук ниже — тонкая
 * обёртка вокруг них через useMemo.
 */

/** Прогресс по каждой теме: сколько отвечено (done) и сколько верно (correct) из total. */
function computeTopicProgress(answers) {
  const map = {};
  TOPICS.forEach((t) => {
    const qs = t.questions;
    const done = qs.filter((q) => answers[q.id]).length;
    const correct = qs.filter((q) => answers[q.id]?.status === "correct").length;
    map[t.id] = { done, total: qs.length, correct };
  });
  return map;
}

/**
 * Прогресс по каждому из 3 уровней сложности (🟢🟡🔴): сколько верных
 * ответов набрано из общего числа вопросов уровня. pct используется,
 * чтобы решить, открыт ли следующий уровень (см. LEVEL_UNLOCK_THRESHOLD).
 */
function computeLevelProgress(answers) {
  const map = {};
  LEVELS.forEach((lvl) => {
    const qs = TOPICS.filter((t) => t.level === lvl.level).flatMap((t) => t.questions);
    const correct = qs.filter((q) => answers[q.id]?.status === "correct").length;
    const total = qs.length;
    const needed = Math.ceil(total * LEVEL_UNLOCK_THRESHOLD);
    map[lvl.level] = { total, correct, pct: total ? correct / total : 0, needed, remaining: Math.max(0, needed - correct) };
  });
  return map;
}

/**
 * Уровень 1 открыт всегда; уровень N+1 — когда в уровне N набрано
 * достаточно верных ответов (LEVEL_UNLOCK_THRESHOLD). Принимает уже
 * посчитанный levelProgress, а не answers напрямую — так его можно
 * протестировать с искусственным levelProgress без пересчёта с нуля.
 */
function isLevelUnlockedFor(levelProgress, level) {
  return level <= 1 || (levelProgress[level - 1]?.pct ?? 0) >= LEVEL_UNLOCK_THRESHOLD;
}

/**
 * Три маленьких чистых функции вместо одной computeBumpProgress —
 * специально по одной на каждый уровень вложенности setState в
 * bumpProgress() ниже. Первая попытка объединить всё в один вызов
 * computeBumpProgress(), результат которого записывался в замыкание
 * из САМОГО глубокого вложенного апдейтера и читался во ВНЕШНИХ,
 * привела к реальному краху: React не гарантирует, что вложенные
 * setState-с-функцией здесь выполняются синхронно в порядке
 * вложенности (это оказалось не так, хотя выглядело логично) — снаружи
 * "computed" оставался undefined. Раз каждый апдейтер должен вернуть
 * своё значение самостоятельно, используя только то, что уже известно
 * НА ЭТОМ уровне (как и было в оригинальном рабочем коде), эти три
 * функции читают ровно по одному предыдущему значению — как и раньше,
 * просто вынесены из инлайна ради тестируемости.
 */
function nextStreakAfterAnswer(prevCurrent, isCorrect) {
  return isCorrect ? prevCurrent + 1 : 0;
}

function nextBestStreak(prevBest, nextCurrent) {
  return Math.max(prevBest, nextCurrent);
}

function nextFastestAnswer(prevFastest, isCorrect, elapsedMs) {
  if (!isCorrect || typeof elapsedMs !== "number") return prevFastest;
  return prevFastest == null ? elapsedMs : Math.min(prevFastest, elapsedMs);
}

/**
 * Композиция трёх функций выше — сама НЕ участвует в реальном
 * bumpProgress() ниже (там используются сами функции по отдельности,
 * на своём уровне вложенности), но именно так удобно протестировать
 * всю цепочку сразу одним вызовом с конкретным набором prev-значений.
 */
function computeBumpProgress(state, isCorrect, elapsedMs) {
  const nextCurrent = nextStreakAfterAnswer(state.currentStreak, isCorrect);
  const nextBest = nextBestStreak(state.bestStreak, nextCurrent);
  const nextFastest = nextFastestAnswer(state.fastestAnswerMs, isCorrect, elapsedMs);
  return { currentStreak: nextCurrent, bestStreak: nextBest, fastestAnswerMs: nextFastest };
}

/**
 * answers — тоже хорошая кандидатура для useReducer: recordAnswer/
 * resetAllAnswers/deleteAnswer — это ровно три вида "действий" над
 * одним и тем же объектом, каждое раньше само вызывало safeStorage.set
 * по отдельности (три места, которые нужно было держать в синхронном
 * виде вручную). Через reducer источник состояния один, и сохранение
 * в хранилище тоже одно — реагирует на сам answers, а не на каждое
 * действие по отдельности.
 */
function answersReducer(state, action) {
  switch (action.type) {
    case "loaded":
      return action.answers;
    case "record":
      return { ...state, [action.id]: action.record };
    case "delete": {
      const next = { ...state };
      delete next[action.id];
      return next;
    }
    case "reset_all":
      return {};
    default:
      return state;
  }
}

function useAnswers({ soundEnabled }) {
  const [answers, dispatch] = useReducer(answersReducer, {});
  const [answersLoaded, setAnswersLoaded] = useState(false);
  const [levelUnlockToast, setLevelUnlockToast] = useState(null); // {emoji, label} | null
  const prevUnlockedLevelsRef = useRef(null); // Set<number> | null — null = ещё не инициализировано

  // Зеркало answers в обычном рефе, обновляемое СИНХРОННО внутри самих
  // recordAnswer/deleteAnswer/resetAllAnswers — в отличие от `answers`
  // (состояние из useReducer), чтение которого через замыкание useEffect
  // может оказаться устаревшим, если сам эффект выполнился с задержкой
  // (см. большой комментарий у lastSubmittedIdRef/questionInitRef в
  // App() — именно из-за этой задержки был потерян видимый результат
  // ответа: эффект инициализации вопроса читал answers "до" записи
  // ответа, хотя формально уже был отправлен). answersRef.current
  // актуален всегда, независимо от того, когда именно React решит
  // прогнать связанные эффекты и перерендерить компонент.
  const answersRef = useRef({});
  useEffect(() => {
    answersRef.current = answers;
  }, [answers]);

  useEffect(() => {
    (async () => {
      let loaded = {};
      try {
        const res = await safeStorage.get(STORAGE_KEY);
        if (res && res.value) loaded = JSON.parse(res.value);
      } catch {
        // ключа ещё нет — это нормально при первом запуске
      }
      answersRef.current = loaded;
      dispatch({ type: "loaded", answers: loaded });
      setAnswersLoaded(true);
    })();
  }, []);

  // Единственное место, где answers пишется в хранилище — реагирует на
  // сам answers, а не дублируется в recordAnswer/resetAllAnswers/
  // deleteAnswer по отдельности, как было раньше. answersLoaded в
  // условии — чтобы не перезаписать хранилище пустым объектом ДО того,
  // как сохранённый прогресс успел загрузиться.
  useEffect(() => {
    if (!answersLoaded) return;
    safeStorage.set(STORAGE_KEY, JSON.stringify(answers));
  }, [answersLoaded, answers]);

  // dispatch у useReducer стабилен между рендерами сам по себе (гарантия
  // React), поэтому recordAnswer/resetAllAnswers/deleteAnswer остаются
  // такими же стабильными, как были с функциональной формой setAnswers —
  // submitQuiz/submitCode по-прежнему не пересоздаются на каждый ответ.
  // answersRef.current обновляется здесь же, синхронно, ДО dispatch —
  // так все дальнейшие синхронные проверки в этом же тике (пусть и в
  // другом компоненте/эффекте) увидят уже актуальное значение.
  const recordAnswer = useCallback((id, record) => {
    answersRef.current = { ...answersRef.current, [id]: record };
    dispatch({ type: "record", id, record });
  }, []);

  const resetAllAnswers = useCallback(() => {
    answersRef.current = {};
    dispatch({ type: "reset_all" });
  }, []);

  // Удаляет ответ на ОДИН конкретный вопрос — используется хоткеем R
  // («сбросить прогресс для этого вопроса»), в отличие от
  // resetAllAnswers, который стирает вообще всё.
  const deleteAnswer = useCallback((id) => {
    const next = { ...answersRef.current };
    delete next[id];
    answersRef.current = next;
    dispatch({ type: "delete", id });
  }, []);

  const totalAnswered = Object.keys(answers).length;
  const totalCorrect = Object.values(answers).filter((a) => a.status === "correct").length;
  const totalWrong = Object.values(answers).filter((a) => a.status === "wrong").length;
  const overallPct = Math.round((totalAnswered / ALL_QUESTIONS.length) * 100);

  const topicProgress = useMemo(() => computeTopicProgress(answers), [answers]);

  const levelProgress = useMemo(() => computeLevelProgress(answers), [answers]);

  // Уровень 1 открыт всегда; уровень N+1 — когда в уровне N набрано
  // достаточно верных ответов (LEVEL_UNLOCK_THRESHOLD).
  const isLevelUnlocked = useCallback(
    (level) => isLevelUnlockedFor(levelProgress, level),
    [levelProgress]
  );

  const isTopicLocked = useCallback(
    (topicId) => !isLevelUnlocked(TOPIC_LEVEL[topicId]),
    [isLevelUnlocked]
  );

  // Первый ещё закрытый уровень и уровень, чей прогресс его открывает —
  // используются для виджета «прогресс до следующего уровня» в сайдбаре.
  const nextLockedLevel = LEVELS.find((l) => !isLevelUnlocked(l.level));
  const gatingLevel = nextLockedLevel ? LEVELS.find((l) => l.level === nextLockedLevel.level - 1) : null;
  const gatingProg = gatingLevel ? levelProgress[gatingLevel.level] : null;

  // Показываем тост, когда открывается новый уровень. answersLoaded нужен,
  // чтобы не поймать «ложное» открытие в момент первой загрузки сохранённого
  // прогресса — тост должен появляться только при реальном переходе.
  useEffect(() => {
    if (!answersLoaded) return;
    const unlockedNow = new Set(LEVELS.filter((l) => isLevelUnlocked(l.level)).map((l) => l.level));
    const prev = prevUnlockedLevelsRef.current;
    if (prev === null) {
      prevUnlockedLevelsRef.current = unlockedNow;
      return;
    }
    const justUnlocked = LEVELS.find((l) => unlockedNow.has(l.level) && !prev.has(l.level));
    prevUnlockedLevelsRef.current = unlockedNow;
    if (justUnlocked) {
      setLevelUnlockToast(justUnlocked);
      playLevelUnlockFanfare(soundEnabled);
      const timer = setTimeout(() => setLevelUnlockToast(null), 4500);
      return () => clearTimeout(timer);
    }
  }, [answersLoaded, isLevelUnlocked, soundEnabled]);

  const wrongQuestions = useMemo(
    () => ALL_QUESTIONS.filter((q) => answers[q.id]?.status === "wrong"),
    [answers]
  );

  return {
    answers, answersRef, answersLoaded, recordAnswer, resetAllAnswers, deleteAnswer,
    totalAnswered, totalCorrect, totalWrong, overallPct,
    topicProgress, levelProgress, isLevelUnlocked, isTopicLocked,
    nextLockedLevel, gatingLevel, gatingProg,
    levelUnlockToast, setLevelUnlockToast, wrongQuestions,
  };
}

/**
 * Обнаруживает момент первого полного прохождения темы: показывает
 * короткое празднование (пара секунд, конфетти — см. Celebration в
 * JSX) и, если в теме были ошибки, предлагает баннер с рекомендацией
 * повторить конкретные слабые теги-концепты (не всю тему целиком —
 * только то, что подтверждено реальными неверными ответами).
 * Принимает topicProgress/answers/soundEnabled — эти значения считаются
 * в других частях состояния (useAnswers/useSound).
 */
function useTopicCelebration({ topicProgress, answers, soundEnabled }) {
  // Рекомендация после завершения темы: null, либо { topicId, topicTitle, items, questions }
  // (items — топ-концептов по ошибкам, questions — именно эти вопросы для повтора).
  const [topicRecommendation, setTopicRecommendation] = useState(null);
  // Празднование завершения темы: null | { topicId, topicTitle }. Держится
  // на экране несколько секунд, потом само гаснет (в отличие от баннера
  // рекомендации, который ждёт явного действия пользователя).
  const [topicCelebration, setTopicCelebration] = useState(null);
  // shownTopicCompletionsRef хранит id тем, для которых баннер уже показывался
  // в этой сессии — чтобы не всплывал повторно при каждом ре-рендере/пере-ответе.
  const shownTopicCompletionsRef = useRef(new Set());

  useEffect(() => {
    if (!topicCelebration) return;
    const timer = setTimeout(() => setTopicCelebration(null), 3200);
    return () => clearTimeout(timer);
  }, [topicCelebration]);

  // Как только тема впервые полностью пройдена (done === total) И в ней
  // была хотя бы одна ошибка — считаем, по каким тегам-концептам (не по
  // всей теме целиком) было больше всего ошибок, и предлагаем баннер
  // с конкретной рекомендацией. Тег без ошибок в рекомендацию не попадает —
  // мы не выдумываем слабые места, только показываем то, что подтверждено
  // реальными неверными ответами. shownTopicCompletionsRef защищает от
  // повторного показа при каждом ре-рендере после первого срабатывания.
  useEffect(() => {
    TOPICS.forEach((t) => {
      const p = topicProgress[t.id];
      if (!p || p.total === 0 || p.done !== p.total) return;
      if (shownTopicCompletionsRef.current.has(t.id)) return;
      shownTopicCompletionsRef.current.add(t.id);

      // Празднование — на КАЖДОЕ завершение темы, независимо от того,
      // были ли ошибки (в отличие от рекомендации ниже, которая
      // показывается только если реально есть что порекомендовать).
      setTopicCelebration({ topicId: t.id, topicTitle: t.title });
      playVictoryChime(soundEnabled);

      const tagStats = {};
      t.questions.forEach((q) => {
        const isWrong = answers[q.id]?.status === "wrong";
        (q.tags || []).forEach((tag) => {
          if (!tagStats[tag]) tagStats[tag] = { tag, wrong: 0, total: 0 };
          tagStats[tag].total += 1;
          if (isWrong) tagStats[tag].wrong += 1;
        });
      });
      const items = Object.values(tagStats)
        .filter((s) => s.wrong > 0)
        .sort((a, b) => b.wrong / b.total - a.wrong / a.total || b.wrong - a.wrong)
        .slice(0, 3);
      if (items.length === 0) return; // ни одной ошибки в теме — рекомендовать нечего

      const reviewTags = new Set(items.map((i) => i.tag));
      const questions = t.questions.filter(
        (q) => answers[q.id]?.status === "wrong" && (q.tags || []).some((tag) => reviewTags.has(tag))
      );
      setTopicRecommendation({ topicId: t.id, topicTitle: t.title, items, questions });
    });
  }, [topicProgress, answers, soundEnabled]);

  const dismissTopicRecommendation = useCallback(() => setTopicRecommendation(null), []);
  const dismissTopicCelebration = useCallback(() => setTopicCelebration(null), []);

  return { topicCelebration, dismissTopicCelebration, topicRecommendation, setTopicRecommendation, dismissTopicRecommendation };
}

function App() {
  const { themeMode, T, toggleTheme } = useTheme();
  const { soundEnabled, toggleSound } = useSound();
  const { onboardingSeen, onboardingLoaded, dismissOnboarding } = useOnboarding();
  const {
    answers, answersRef, answersLoaded, recordAnswer, resetAllAnswers, deleteAnswer,
    totalAnswered, totalCorrect, totalWrong, overallPct,
    topicProgress, levelProgress, isLevelUnlocked, isTopicLocked,
    nextLockedLevel, gatingLevel, gatingProg,
    levelUnlockToast, setLevelUnlockToast, wrongQuestions,
  } = useAnswers({ soundEnabled });

  const [currentIdx, setCurrentIdx] = useState(0);
  const [mode, setMode] = useState("home"); // "home" | "learn" | "summary" | "sandbox" | "project" | "exam" | "viz" | "tree" | "predict" | "history" | "findbug"
  const [reviewQueue, setReviewQueue] = useState(null); // null = обычный режим, иначе массив вопросов с ошибками
  const [reviewIdx, setReviewIdx] = useState(0);
  const inReview = reviewQueue !== null;
  // topicRecommendation/topicCelebration/shownTopicCompletionsRef теперь
  // приходят из useTopicCelebration() ниже — ей нужны topicProgress/answers
  // (из useAnswers()) и soundEnabled (из useSound()), которые уже посчитаны.
  const { topicCelebration, dismissTopicCelebration, topicRecommendation, setTopicRecommendation, dismissTopicRecommendation } =
    useTopicCelebration({ topicProgress, answers, soundEnabled });

  // Лог каждой попытки ответа (не только последней, в отличие от answers) —
  // нужен именно для истории по дням: answers хранит только текущий статус
  // вопроса, а тут — все прошлые попытки с датой. Копится только с момента
  // появления этой фичи: старый прогресс без таймстемпов сюда не попадает
  // (см. HistoryScreen — такой прогресс показывается отдельным блоком "Раньше").
  const { historyLog, logHistoryEntry, resetHistory } = useHistoryLog();

  const current = inReview ? reviewQueue[reviewIdx] : NAV_ITEMS[currentIdx];
  const isLesson = current.type === "lesson";

  const [selectedOption, setSelectedOption] = useState(null);
  const [drafts, setDrafts] = useState({}); // questionId -> черновик кода, не потеряется при переходе
  const [code, setCode] = useState(current.starter || "");
  const [runResult, setRunResult] = useState(null);
  const [isRunning, setIsRunning] = useState(false);
  const [checked, setChecked] = useState(false);
  const [answerFx, setAnswerFx] = useState(null); // null | "correct" | "wrong" — короткая анимация карточки после ответа
  const [showHint, setShowHint] = useState(false);
  const [showSolution, setShowSolution] = useState(false);
  const [attempts, setAttempts] = useState({}); // questionId -> число попыток
  const liveObjRef = useRef(null);
  const touchStartRef = useRef(null);
  // tick — это стейт (не реф!), который форсирует ре-рендер LiveDomPreview
  // после мутации liveObj. Без tick React.memo не заметит изменений,
  // потому что liveObj не меняет ссылку при мутации.
  // React батчит setLiveTick с другими setState, поэтому дополнительного
  // рендера не создаётся.
  const [liveTick, setLiveTick] = useState(0);
  const { streak, brokenStreakNotice, setBrokenStreakNotice } = useDailyStreak();
  const [copyStatus, setCopyStatus] = useState(null);
  // answers/answersLoaded/levelUnlockToast теперь приходят из useAnswers() выше.

  // unlockedAchievements/currentStreak/bestStreak/fastestAnswerMs/
  // achievementToast теперь приходят из useAchievements() ниже — ему
  // нужны totalCorrect/topicProgress/isLevelUnlocked, которые ещё не
  // посчитаны в этой точке функции, поэтому сам вызов хука стоит чуть
  // ниже, сразу после isLevelUnlocked.

  // Момент, когда текущий вопрос появился на экране — от него отсчитывается
  // время ответа для достижения ⚡. Обновляется в эффекте смены вопроса ниже.
  const questionStartRef = useRef(Date.now());
  // Синхронный лок от повторной отправки одного и того же вопроса —
  // см. подробный комментарий в submitQuiz/submitCode. Сравнение с
  // current.id (а не булев флаг) само собой "сбрасывается" при переходе
  // на любой другой вопрос — отдельный сброс никому не нужен.
  const lastSubmittedIdRef = useRef(null);

  const { xp, xpLoaded, rank, rankToast, setRankToast, xpFloat, rankXpIntoRank, rankXpForNext, addXp, resetXp } = useXpAndRank();

  const updateCode = useCallback((value) => {
    setCode(value);
    setDrafts((prev) => ({ ...prev, [current.id]: value }));
  }, [current.id]);

  // Загрузка answers/xp/streak/достижений/истории/темы/звука теперь
  // происходит внутри соответствующих хуков выше (useAnswers, useXpAndRank,
  // useDailyStreak, useAchievements, useHistoryLog, useTheme, useSound) —
  // отдельного общего mount-эффекта на всё сразу больше нет.

  // Сохраняет unlockedAchievements/currentStreak/bestStreak/fastestAnswerMs
  // persistAchievements теперь внутри useAchievements() выше.

  // addXp теперь приходит из useXpAndRank() выше.

  // recordAnswer/resetAllAnswers/totalAnswered/totalCorrect/totalWrong/
  // overallPct/topicProgress теперь приходят из useAnswers() выше.

  // logHistoryEntry теперь приходит из useHistoryLog() выше.

  // bumpProgress теперь приходит из useAchievements() выше.

  useEffect(() => {
    // Читаем из answersRef.current, а не из замыкания answers: этот
    // эффект — passive-эффект, который React может выполнить с задержкой
    // относительно коммита (особенно заметно сразу после двухфазного
    // перехода goTo с его собственной задержкой 130мс). Если пользователь
    // успевает кликнуть ответ ДО того, как этот эффект фактически
    // выполнился, `answers` в его замыкании может быть ещё "старым" (без
    // только что записанного ответа), и checked=true, выставленный
    // кликом, стирался бы обратно в false. answersRef.current обновляется
    // синхронно внутри recordAnswer (см. useAnswers) в момент самого
    // клика — всегда актуален, независимо от того, когда именно
    // выполнится этот конкретный эффект.
    const savedAnswer = answersRef.current[current.id];
    setCode(drafts[current.id] !== undefined ? drafts[current.id] : current.starter || "");
    setRunResult(null);
    setChecked(current.type !== "lesson" && !!savedAnswer);
    setSelectedOption(savedAnswer?.selected !== undefined ? savedAnswer.selected : null);
    setAnswerFx(null);
    setShowHint(false);
    setShowSolution(false);
    liveObjRef.current = current.liveKind ? makeLiveObject(current.liveKind) : null;
    if (current.liveKind) setLiveTick((t) => t + 1);
    // Обрываем выполнение в Worker, если пользователь ушёл с вопроса до
    // того, как код успел выполниться — иначе устаревший результат мог бы
    // "прилететь" уже на другой, новый вопрос.
    terminateActiveCodeWorker();
    // Засекаем момент показа вопроса — от него считается время ответа
    // для достижения ⚡ «быстрее 10 секунд».
    questionStartRef.current = Date.now();
    // answersLoaded намеренно в зависимостях: сохранённый прогресс подгружается
    // асинхронно, и без этого текущий вопрос мог остаться отмеченным как
    // непройденный, даже если ответ на самом деле уже сохранён на диске.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentIdx, inReview, reviewIdx, answersLoaded]);

  // Обнаружение прохождения темы, празднование и рекомендация теперь
  // приходят из useTopicCelebration() выше.

  // levelProgress/isLevelUnlocked/isTopicLocked/nextLockedLevel/gatingLevel/
  // gatingProg/тост открытия уровня теперь тоже приходят из useAnswers() выше.

  // rank/rankXpIntoRank/rankXpForNext, тост о новом звании и авто-скрытие
  // «+25 XP» теперь все приходят из useXpAndRank() выше.

  // Достижения (проверка условий, тост, currentStreak/bestStreak/
  // fastestAnswerMs, bumpProgress) — из useAchievements(): ему нужны
  // totalCorrect/topicProgress/isLevelUnlocked/answersLoaded, которые
  // к этой точке уже посчитаны выше в этой же функции.
  const { unlockedAchievements, currentStreak, bestStreak, fastestAnswerMs, achievementsLoaded, achievementToast, dismissAchievementToast, bumpProgress, resetAchievements } =
    useAchievements({ answersLoaded, totalCorrect, topicProgress, isLevelUnlocked });

  // Единый флаг "данные для самого первого экрана (Домой) готовы" —
  // answers/достижения/XP влияют на то, что там показывается (прогресс,
  // звание, серия), а streak сам по себе стартует как null и становится
  // объектом только после загрузки, так что его тоже стоит дождаться.
  // До этого момента показываем скелетон вместо резкой подмены "0 XP,
  // Начать обучение" на настоящие данные через долю секунды.
  const appDataLoaded = answersLoaded && achievementsLoaded && xpLoaded && streak !== null;

  // wrongQuestions теперь тоже приходит из useAnswers() выше.

  const shuffledOptions = useMemo(() => {
    if (current.type !== "quiz") return [];
    return shuffleWithIndex(current.options, current.id);
    // current.options намеренно не в зависимостях: он полностью определяется
    // current.id (у каждого вопроса свой фиксированный набор options), так что
    // отслеживать current.id достаточно — current.type нужен только для проверки
    // внутри функции и сам по себе не должен вызывать пересчёт.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [current.id, current.type]);

  const [isExiting, setIsExiting] = useState(false);
  const exitTimeoutRef = useRef(null);

  // Переход между вопросами/темами в 2 шага: сначала текущая карточка
  // на 130мс получает класс "уменьшается и исчезает" (card-exiting),
  // и только ПОСЛЕ этого реально меняется currentIdx/reviewIdx —
  // тогда старая карточка размонтируется и новая появится уже с
  // собственной анимацией входа (question-enter). Без этой задержки
  // React просто мгновенно подменяет контент — не видно самого
  // "выхода" старой карточки, только появление новой.
  useEffect(() => () => { if (exitTimeoutRef.current) clearTimeout(exitTimeoutRef.current); }, []);

  const navigateWithTransition = useCallback((applyFn) => {
    if (exitTimeoutRef.current) clearTimeout(exitTimeoutRef.current);
    setIsExiting(true);
    exitTimeoutRef.current = setTimeout(() => {
      applyFn();
      setIsExiting(false);
    }, 130);
  }, []);

  const goTo = useCallback((idx) => {
    if (idx < 0 || idx >= NAV_ITEMS.length) return;
    // Стрелки/кнопка «Далее» не должны пускать за пределы открытых уровней —
    // иначе можно случайно проскочить в заблокированную тему по клавиатуре.
    if (isTopicLocked(NAV_ITEMS[idx].topicId)) return;
    navigateWithTransition(() => setCurrentIdx(idx));
  }, [isTopicLocked, navigateWithTransition]);

  const goToReview = useCallback((idx) => {
    if (!reviewQueue || idx < 0 || idx >= reviewQueue.length) return;
    navigateWithTransition(() => setReviewIdx(idx));
  }, [reviewQueue, navigateWithTransition]);

  const jumpToTopic = useCallback((topicId) => {
    if (isTopicLocked(topicId)) return;
    const idx = NAV_ITEMS.findIndex((item) => item.topicId === topicId);
    if (idx < 0) return;
    navigateWithTransition(() => {
      setMode("learn");
      setReviewQueue(null);
      setCurrentIdx(idx);
    });
  }, [isTopicLocked, navigateWithTransition]);

  const startReview = useCallback(() => {
    if (wrongQuestions.length === 0) return;
    setReviewQueue(wrongQuestions);
    setReviewIdx(0);
    setMode("learn");
  }, [wrongQuestions]);

  const exitReview = useCallback(() => {
    setReviewQueue(null);
  }, []);

  // Повтор именно тех вопросов, что попали в рекомендацию после темы —
  // не всех ошибок за всё время, а только связанных со слабыми тегами
  // конкретно этой темы.
  const startTopicRecommendationReview = useCallback(() => {
    if (!topicRecommendation || topicRecommendation.questions.length === 0) return;
    setReviewQueue(topicRecommendation.questions);
    setReviewIdx(0);
    setMode("learn");
    setTopicRecommendation(null);
  }, [topicRecommendation, setTopicRecommendation]);

  // dismissTopicRecommendation теперь приходит из useTopicCelebration() выше.

  const resetProgress = useCallback(() => {
    const ok = window.confirm("Сбросить весь прогресс? Это действие нельзя отменить.");
    if (!ok) return;

    const code = window.prompt('Для подтверждения напишите слово "СБРОС"');
    if (code === null) return;

    const normalized = code.trim().toUpperCase();
    if (normalized !== "СБРОС") {
      alert('Сброс отменён. Нужно было написать "СБРОС".');
      return;
    }

    resetAllAnswers();
    resetHistory();
    resetAchievements();
    resetXp();
    setReviewQueue(null);
    setMode("learn");
    setCurrentIdx(0);
  }, [resetAllAnswers, resetHistory, resetAchievements, resetXp]);

  // toggleTheme/toggleSound теперь приходят из useTheme()/useSound() выше.

  const submitQuiz = useCallback((optionIdx) => {
    // Реф, а не state — обычная проверка "if (checked) return" не спасает
    // от быстрых повторных кликов ДО того, как React успеет перерендерить
    // disabled-кнопку: несколько кликов подряд в один тик видят одно и то
    // же устаревшее замыкание checked/answers и могут начислить XP
    // несколько раз за один и тот же верный ответ. Реф обновляется
    // синхронно и не зависит от цикла рендера.
    if (lastSubmittedIdRef.current === current.id) return;
    lastSubmittedIdRef.current = current.id;
    setSelectedOption(optionIdx);
    setChecked(true);
    const isCorrect = optionIdx === current.correct;
    const alreadyCorrect = answers[current.id]?.status === "correct";
    setAttempts((prev) => ({ ...prev, [current.id]: (prev[current.id] || 0) + 1 }));
    recordAnswer(current.id, { status: isCorrect ? "correct" : "wrong", selected: optionIdx });
    logHistoryEntry({ questionId: current.id, tags: current.tags || [], topicId: current.topicId, topicTitle: current.topicTitle, correct: isCorrect, elapsedMs: Date.now() - questionStartRef.current });
    bumpProgress(isCorrect, Date.now() - questionStartRef.current);
    if (isCorrect && !alreadyCorrect) addXp(XP_PER_CORRECT_ANSWER);
    if (isCorrect) playCorrectTick(soundEnabled);
    setAnswerFx(null);
    requestAnimationFrame(() => {
      setAnswerFx(isCorrect ? "correct" : "wrong");
      setTimeout(() => setAnswerFx(null), 420);
    });
  }, [current, answers, recordAnswer, logHistoryEntry, bumpProgress, addXp, soundEnabled]);

  const submitCode = useCallback(() => {
    // Тот же синхронный лок, что и в submitQuiz — здесь особенно важен,
    // потому что между кликом и реальной проверкой есть искусственная
    // задержка (350мс ниже): без лока за это время можно успеть нажать
    // кнопку ещё раз и запустить проверку параллельно.
    if (lastSubmittedIdRef.current === current.id) return;
    lastSubmittedIdRef.current = current.id;
    // Искусственная короткая пауза перед показом результата — само
    // выполнение кода синхронное и мгновенное, задержка нужна только
    // для ощущения «код действительно компилируется/запускается»,
    // а не мгновенной вспышки результата (см. RunningIndicator).
    setIsRunning(true);
    setTimeout(async () => {
    // liveObjRef — реф, не стейт: читаем .current в момент вызова,
    // а не через зависимости useCallback (мутация рефа не должна
    // и не может пересоздавать функцию — так и задумано).
    //
    // Пересоздаём объект ПЕРЕД КАЖДЫМ запуском, а не только когда его
    // ещё нет. Иначе повторный запуск одного и того же (правильного)
    // кода мог бы сработать иначе на «грязном» объекте с прошлого
    // прогона — например, el.classList.toggle('active') на второй
    // прогон снял бы класс, а не добавил, и правильный ответ
    // засчитался бы как неверный.
    if (current.liveKind) {
      liveObjRef.current = makeLiveObject(current.liveKind);
    }
    const extraArgs = current.liveVarName && liveObjRef.current
      ? { [current.liveVarName]: liveObjRef.current }
      : {};
    // extraArgs пустой у обычных вопросов без liveKind — код уйдёт в
    // Worker и не заблокирует UI, даже если внутри случайный
    // бесконечный цикл. У liveKind-вопросов extraArgs непустой —
    // выполнение остаётся синхронным на главном потоке (нужен
    // настоящий DOM-объект, Worker его не пропустит).
    const result = await runUserCode(code, extraArgs);
    setRunResult(result);
    setIsRunning(false);
    setChecked(true);
    if (current.liveKind) setLiveTick((t) => t + 1);
    const isCorrect = !result.error && logsMatch(result.logs, current.expectedLogs);
    const alreadyCorrect = answers[current.id]?.status === "correct";
    setAttempts((prev) => ({ ...prev, [current.id]: (prev[current.id] || 0) + 1 }));
    recordAnswer(current.id, { status: isCorrect ? "correct" : "wrong" });
    logHistoryEntry({ questionId: current.id, tags: current.tags || [], topicId: current.topicId, topicTitle: current.topicTitle, correct: isCorrect, elapsedMs: Date.now() - questionStartRef.current });
    bumpProgress(isCorrect, Date.now() - questionStartRef.current);
    if (isCorrect && !alreadyCorrect) addXp(XP_PER_CORRECT_ANSWER);
    if (isCorrect) playCorrectTick(soundEnabled);
    setAnswerFx(null);
    requestAnimationFrame(() => {
      setAnswerFx(isCorrect ? "correct" : "wrong");
      setTimeout(() => setAnswerFx(null), 420);
    });
    }, 350);
  }, [current, code, answers, recordAnswer, logHistoryEntry, bumpProgress, addXp, soundEnabled]);

  const goToNextFromLesson = useCallback(() => {
    goTo(currentIdx + 1);
  }, [goTo, currentIdx]);

  const backToLearnMode = useCallback(() => setMode("learn"), []);

  const clickLiveButton = useCallback(() => {
    const cb = liveObjRef.current?.handlers?.click;
    if (typeof cb === "function") {
      try {
        cb();
      } catch {
        // обработчик пользователя может содержать ошибку — это нормально до сдачи задачи
      }
      setLiveTick((t) => t + 1);
    }
  }, []);

  const status = !isLesson ? answers[current.id]?.status : null;
  const isCode = current.type === "code";
  const totalNav = inReview ? reviewQueue.length : NAV_ITEMS.length;
  const navIdx = inReview ? reviewIdx : currentIdx;
  // В режиме повторения (inReview) блокировки не действуют — там только
  // уже отвеченные вопросы, их темы по определению уже были открыты.
  const nextNavLocked =
    !inReview && navIdx + 1 < NAV_ITEMS.length && isTopicLocked(NAV_ITEMS[navIdx + 1].topicId);
  const currentTopicProgress = topicProgress[current.topicId];
  const currentTopicPct = currentTopicProgress
    ? Math.round((currentTopicProgress.done / currentTopicProgress.total) * 100)
    : 0;

  useEffect(() => {
    const handleKeyDown = (e) => {
      // Игнорируем, если пользователь печатает в текстовом поле
      const target = e.target;
      if (target.tagName === "INPUT" || target.tagName === "TEXTAREA") {
        return;
      }

      // Эти хоткеи (стрелки, R) имеют смысл только в самом режиме
      // вопросов — на «Итогах», «Домой», в песочнице, отладчике и любом
      // другом отдельном экране R сбрасывал бы невидимый вопрос, а
      // стрелки листали бы список вопросов, которого не видно на
      // экране. Раньше здесь проверялось только "!== summary", из-за
      // чего то же самое могло случайно произойти и на остальных
      // экранах — гасим сразу для всех, кроме самого режима вопросов.
      if (mode !== "learn") return;

      // Escape — закрыть подсказку/решение
      if (e.key === "Escape") {
        if (showHint) setShowHint(false);
        if (showSolution) setShowSolution(false);
        return;
      }

      // R — сброс текущего вопроса (только если вопрос, не теория).
      // Без модификаторов Ctrl/Shift намеренно: Ctrl+Shift+R в браузере —
      // это жёсткая перезагрузка страницы, её нельзя перехватить через
      // preventDefault, так что сочетание с этими модификаторами просто
      // никогда бы не сработало. Фокус уже исключён из INPUT/TEXTAREA выше,
      // так что одиночная "r" безопасна.
      if (e.key.toLowerCase() === "r") {
        if (!isLesson && current.id) {
          const ok = window.confirm(`Сбросить прогресс для вопроса "${current.prompt}"?`);
          if (ok) {
            // Удаляем ответ на текущий вопрос
            deleteAnswer(current.id);
            // Сбрасываем связанные состояния
            setSelectedOption(null);
            setChecked(false);
            setRunResult(null);
            lastSubmittedIdRef.current = null;
            setAttempts((prev) => {
              const next = { ...prev };
              delete next[current.id];
              return next;
            });
          }
        }
        return;
      }

      // ← и → — навигация
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (inReview) {
          goToReview(navIdx - 1);
        } else {
          goTo(navIdx - 1);
        }
        return;
      }

      if (e.key === "ArrowRight") {
        e.preventDefault();
        if (inReview) {
          goToReview(navIdx + 1);
        } else {
          goTo(navIdx + 1);
        }
        return;
      }
    };

    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [
    showHint, showSolution, mode, inReview, navIdx,
    current.id, current.prompt, isLesson,
    goTo, goToReview, deleteAnswer,
  ]);

  return (
    <div
      style={{
        minHeight: "100vh",
        maxWidth: "100vw",
        overflowX: "hidden",
        position: "relative",
        backgroundColor: T.bg,
        backgroundImage: `radial-gradient(${T.border} 1px, transparent 1px)`,
        backgroundSize: "24px 24px",
        backgroundAttachment: "fixed",
        color: T.text,
        fontFamily: "'Inter', system-ui, sans-serif",
        transition: "background-color 0.25s ease, color 0.25s ease",
      }}
    >
      {/* Skip-link — невидима, пока не получит фокус (Tab с самого начала
          страницы). Даёт клавиатурному пользователю пропустить шапку и
          боковую навигацию и сразу попасть в основной контент, не пролистывая
          Tab'ом каждый пункт меню заново на КАЖДОМ переходе между экранами. */}
      <a
        href="#main-content"
        style={{
          position: "absolute", left: 12, top: -60, zIndex: 30000,
          background: T.accent, color: "#fff", padding: "10px 16px", borderRadius: 8,
          fontSize: 13, fontWeight: 600, textDecoration: "none", transition: "top 0.15s ease",
        }}
        onFocus={(e) => { e.currentTarget.style.top = "12px"; }}
        onBlur={(e) => { e.currentTarget.style.top = "-60px"; }}
      >
        Перейти к основному содержимому
      </a>
      {/* Мягкие размытые пятна фона — сине-фиолетовый + бирюзовый в тёмной
          теме, гораздо более приглушённая пастельная версия в светлой (чтобы
          не спорить с белыми карточками). position:fixed + огромный blur —
          пятна лежат СТРОГО за контентом (см. z-index:1 у .layout/.app-header
          ниже), поэтому не мешают читать код/текст внутри карточек — видны
          только в зазорах фона. Движение очень медленное и плавное намеренно:
          это фон для чтения и написания кода, а не акцентный элемент. */}
      <div className="bg-aurora" aria-hidden="true">
        <div className="bg-blob bg-blob-1" />
        <div className="bg-blob bg-blob-2" />
        <div className="bg-blob bg-blob-3" />
      </div>

      <Celebration active={overallPct === 100} />
      <Celebration active={!!topicCelebration} />
      <Celebration active={!!levelUnlockToast} />
      <Celebration active={!!achievementToast} count={18} />

      {levelUnlockToast && (
        <div
          role="status"
          aria-live="polite"
          onClick={() => setLevelUnlockToast(null)}
          style={{
            position: "fixed", top: 18, left: "50%", transform: "translateX(-50%)", zIndex: 10000,
            background: `${T.surface}E6`, backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)", border: `2px solid ${levelUnlockToast.color}`, borderRadius: 16,
            padding: "22px 30px", boxShadow: `0 20px 48px rgba(0,0,0,0.35), 0 0 0 5px ${levelUnlockToast.color}22`,
            display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer",
            animation: "level-toast-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)", textAlign: "center", maxWidth: 320,
          }}
        >
          <span style={{ fontSize: 42, marginBottom: 2 }}>{levelUnlockToast.emoji}</span>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 700, color: T.text }}>
            Новый уровень открыт!
          </div>
          <div style={{ fontSize: 13.5, color: T.textDim }}>
            «{levelUnlockToast.label}» теперь доступен
          </div>
        </div>
      )}

      {topicCelebration && (
        <div
          onClick={dismissTopicCelebration}
          style={{
            position: "fixed", top: levelUnlockToast ? LEVEL_TOAST_OFFSET : 18, left: "50%", transform: "translateX(-50%)", zIndex: 9999,
            background: `${T.surface}E6`, backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", border: `1.5px solid ${T.accent2}`, borderRadius: 12,
            padding: "12px 18px", boxShadow: "0 8px 24px rgba(0,0,0,0.18)",
            display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
            animation: "level-toast-in 0.3s ease",
          }}
        >
          <span style={{ fontSize: 22 }}>🏆</span>
          <span style={{ fontSize: 13.5, color: T.text }}>
            <strong>Тема пройдена!</strong> «{topicCelebration.topicTitle}» — отличная работа.
          </span>
        </div>
      )}

      {rankToast && (
        <div
          role="status"
          aria-live="polite"
          onClick={() => setRankToast(null)}
          style={{
            position: "fixed", top: levelUnlockToast ? LEVEL_TOAST_OFFSET : 18, left: "50%", transform: "translateX(-50%)", zIndex: 10000,
            background: `${T.surface}E6`, backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", border: `1.5px solid ${T.accent}`, borderRadius: 12,
            padding: "12px 16px", boxShadow: "0 8px 24px rgba(0,0,0,0.18)",
            display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
            animation: "level-toast-in 0.3s ease", maxWidth: 360,
          }}
        >
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: `${T.accent}1A`, border: `1.5px solid ${T.accent}55`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <MascotIcon size={18} color={T.accent} mood="celebrate" />
          </div>
          <span style={{ fontSize: 13.5, color: T.text }}>
            <strong>Байт:</strong> Поздравляю! Новое звание — «{rankTitle(rankToast)}».
          </span>
        </div>
      )}

      {appDataLoaded && onboardingLoaded && !onboardingSeen && (
        <OnboardingModal T={T} onDismiss={dismissOnboarding} />
      )}

      {achievementToast && (
        <div
          role="status"
          aria-live="polite"
          onClick={dismissAchievementToast}
          style={{
            position: "fixed", top: (levelUnlockToast ? LEVEL_TOAST_OFFSET : 18) + (rankToast ? 60 : 0), left: "50%", transform: "translateX(-50%)", zIndex: 10000,
            background: `${T.surface}E6`, backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", border: `1.5px solid ${T.accent2}`, borderRadius: 12,
            padding: "12px 18px", boxShadow: "0 8px 24px rgba(0,0,0,0.18)",
            display: "flex", alignItems: "center", gap: 10, cursor: "pointer",
            animation: "level-toast-in 0.3s ease", maxWidth: 380,
          }}
        >
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: `${T.accent2}1A`, border: `1.5px solid ${T.accent2}55`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <MascotIcon size={18} color={T.accent2} mood="celebrate" />
          </div>
          <span style={{ fontSize: 13.5, color: T.text }}>
            <strong>{MASCOT_NAME}:</strong> {MASCOT_ACHIEVEMENT[hashStr(achievementToast.id) % MASCOT_ACHIEVEMENT.length]}
            {" "}{achievementToast.emoji} <strong>{achievementToast.title}</strong> — {achievementToast.description}
          </span>
        </div>
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }

        .question-card {
          box-shadow: ${themeMode === "dark"
            ? "0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.22)"
            : "0 1px 2px rgba(20,27,41,0.06), 0 4px 14px rgba(20,27,41,0.06)"};
          transition: box-shadow 0.25s ease, transform 0.25s ease, background-color 0.3s ease, border-color 0.3s ease;
          animation: question-enter 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .question-card:hover {
          box-shadow: ${themeMode === "dark"
            ? "0 14px 36px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.35)"
            : "0 14px 36px rgba(20,27,41,0.16), 0 3px 10px rgba(20,27,41,0.09)"};
          transform: translateY(-2px);
        }
        @media (prefers-reduced-motion: reduce) {
          .question-card { transition: none; animation: none; }
          .question-card:hover { transform: none; }
        }

        /* Карточки тем на экране "Итоги" — лёгкая тень + подъём при
           наведении, отдельно от .question-card (это вложенные карточки
           внутри экрана, не сам экран). */
        .topic-card {
          box-shadow: ${themeMode === "dark" ? "0 1px 2px rgba(0,0,0,0.3)" : "0 1px 2px rgba(20,27,41,0.06)"};
          transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
        }
        .topic-card:hover {
          box-shadow: ${themeMode === "dark"
            ? "0 12px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.25)"
            : "0 12px 24px rgba(20,27,41,0.12), 0 2px 6px rgba(20,27,41,0.06)"};
          transform: translateY(-4px);
          border-color: ${T.accent}66;
        }
        @media (prefers-reduced-motion: reduce) {
          .topic-card { transition: none; }
          .topic-card:hover { transform: none; }
          .xp-sparkle { display: none; }
        }

        /* Плавная смена цветов при переключении темы — на крупных
           контейнерах, а не глобально через *, чтобы не тормозить часто
           обновляемые вещи (таймер экзамена, живой вывод отладчика). */
        .layout, .app-header, .sidebar {
          transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        @media (prefers-reduced-motion: reduce) {
          .layout, .app-header, .sidebar { transition: none; }
        }

        /* Плавное лёгкое увеличение при наведении — единообразно для ВСЕХ
           кнопок разом, а не точечно на каждую (их в приложении сотни). */
        button:not(:disabled) {
          transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        button:not(:disabled):hover { transform: scale(1.025); }
        button:not(:disabled):active { transform: scale(0.975); }
        @media (prefers-reduced-motion: reduce) {
          button:not(:disabled) { transition: none; }
          button:not(:disabled):hover, button:not(:disabled):active { transform: none; }
        }

        @keyframes question-enter {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes level-toast-in {
          from { opacity: 0; transform: translate(-50%, -10px); }
          to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes xp-float-up {
          0% { opacity: 0; transform: translateY(0); }
          15% { opacity: 1; transform: translateY(-2px); }
          80% { opacity: 1; transform: translateY(-16px); }
          100% { opacity: 0; transform: translateY(-22px); }
        }
        /* Искры вокруг «+XP» — короткая вспышка при верном ответе, три
           частицы разлетаются в разные стороны и гаснут. Совсем не
           тот же keyframe, что у xp-float-up (тот двигается вверх
           текстом), эти — рассыпаются в стороны точками. */
        @keyframes sparkle-burst-1 {
          0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
          25% { opacity: 1; transform: translate(-10px, -10px) scale(1); }
          100% { opacity: 0; transform: translate(-18px, -20px) scale(0.6); }
        }
        @keyframes sparkle-burst-2 {
          0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
          25% { opacity: 1; transform: translate(12px, -6px) scale(1); }
          100% { opacity: 0; transform: translate(22px, -14px) scale(0.6); }
        }
        @keyframes sparkle-burst-3 {
          0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
          25% { opacity: 1; transform: translate(2px, -14px) scale(1); }
          100% { opacity: 0; transform: translate(4px, -26px) scale(0.6); }
        }
        .xp-sparkle {
          position: absolute; top: -4px; right: 10px; font-size: 10px; pointer-events: none;
        }
        .xp-sparkle-1 { animation: sparkle-burst-1 0.7s ease-out forwards; }
        .xp-sparkle-2 { animation: sparkle-burst-2 0.7s ease-out 0.05s forwards; }
        .xp-sparkle-3 { animation: sparkle-burst-3 0.7s ease-out 0.1s forwards; }
        @keyframes answer-bounce {
          0% { transform: scale(1) translateY(0); }
          35% { transform: scale(1.015) translateY(-4px); }
          60% { transform: scale(0.995) translateY(1px); }
          100% { transform: scale(1) translateY(0); }
        }
        @keyframes answer-shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-3px); }
          50% { transform: translateX(2px); }
          75% { transform: translateX(-1px); }
        }
        @keyframes run-pulse {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 1; }
        }
        @keyframes spin-smooth {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        /* Аврора-фон: сине-фиолетовый + бирюзовый в тёмной теме, гораздо
           более приглушённый пастельный вариант в светлой — чтобы не спорить
           с белыми карточками. Движение медленное (25-38s на цикл) и
           плавное — фон для чтения/кода, а не привлекающий внимание элемент. */
        .bg-aurora {
          position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .bg-blob {
          position: absolute; border-radius: 50%;
          filter: blur(${themeMode === "dark" ? "90px" : "70px"});
          opacity: ${themeMode === "dark" ? 1 : 1};
        }
        .bg-blob-1 {
          width: 560px; height: 560px; top: -180px; left: -120px;
          background: ${themeMode === "dark" ? "#3B82F6" : "#2563EB"};
          opacity: ${themeMode === "dark" ? 0.28 : 0.10};
          animation: drift-1 26s ease-in-out infinite alternate;
        }
        .bg-blob-2 {
          width: 620px; height: 620px; top: -140px; right: -160px;
          background: ${themeMode === "dark" ? "#8B5CF6" : "#7C3AED"};
          opacity: ${themeMode === "dark" ? 0.22 : 0.08};
          animation: drift-2 32s ease-in-out infinite alternate;
        }
        .bg-blob-3 {
          width: 520px; height: 520px; bottom: -200px; left: 30%;
          background: #06B6D4;
          opacity: ${themeMode === "dark" ? 0.18 : 0.08};
          animation: drift-3 38s ease-in-out infinite alternate;
        }
        @keyframes drift-1 {
          from { transform: translate(0, 0) scale(1); }
          to { transform: translate(60px, 40px) scale(1.08); }
        }
        @keyframes drift-2 {
          from { transform: translate(0, 0) scale(1); }
          to { transform: translate(-50px, 60px) scale(1.1); }
        }
        @keyframes drift-3 {
          from { transform: translate(0, 0) scale(1); }
          to { transform: translate(40px, -30px) scale(1.06); }
        }
        @media (prefers-reduced-motion: reduce) {
          .bg-blob-1, .bg-blob-2, .bg-blob-3 { animation: none; }
        }
        @media (max-width: 700px) {
          .bg-aurora { opacity: 0.7; }
        }

        .running-indicator { animation: run-pulse 1s ease-in-out infinite; }
        .running-spinner { animation: spin-smooth 0.8s linear infinite; }
        .console-result-enter { animation: question-enter 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .question-enter {
          animation: question-enter 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        /* Уход старой карточки перед появлением следующей (вопрос/тема) —
           130мс, тот же класс-переключатель, что описан у isExiting в App().
           !important — эта карточка одновременно несёт className
           "question-enter", чья собственная entrance-анимация иначе
           продолжила бы играть параллельно с уходом. */
        .card-exiting {
          animation: card-exit 0.13s ease-out forwards !important;
          pointer-events: none;
        }
        @keyframes card-exit {
          from { opacity: 1; transform: scale(1); }
          to { opacity: 0; transform: scale(0.97); }
        }
        .fx-correct { animation: answer-bounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .fx-wrong { animation: answer-shake 0.5s ease; }

        /* Плавные наведения и смена темы — по всему приложению разом,
           без переписывания каждого инлайн-стиля по отдельности. */
        button:not(:disabled) {
          transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        button:not(:disabled):hover { transform: scale(1.025); }
        button:not(:disabled):active { transform: scale(0.97); }
        /* Мягкое свечение при фокусе — textarea (редактор кода, свободная
           консоль) и обычные input (имя для сертификата и т.д.), одним
           правилом на всё приложение. */
        textarea:focus, input:focus {
          outline: none;
          box-shadow: 0 0 0 3px ${T.accent}33;
          transition: box-shadow 0.15s ease;

        @media (max-width: 860px) {

          .nav-btn { padding: 12px 14px !important; min-height: 44px !important; box-sizing: border-box !important; }

          .topic-row { flex-direction: row !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch;
