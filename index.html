            </div>
          )}

          <div className="topic-row" style={{ display: "flex", flexDirection: "column", gap: 3, minWidth: 0 }}>
            {LEVELS.map((lvl, li) => {
              const topicsInLevel = TOPICS.filter((t) => t.level === lvl.level);
              const locked = !isLevelUnlocked(lvl.level);
              const sectionMargin = li === 0 ? 0 : 14;

              if (locked) {
                const prevLvl = LEVELS[li - 1];
                const prevProg = levelProgress[prevLvl.level];
                return (
                  <div
                    key={lvl.level}
                    style={{
                      marginTop: sectionMargin, textAlign: "center", background: T.surfaceAlt,
                      border: `1.5px dashed ${T.border}`, borderRadius: 10, padding: "16px 12px",
                    }}
                  >
                    <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: "50%", background: T.surface, marginBottom: 8 }}>
                      <Lock size={15} strokeWidth={2.2} style={{ color: T.textDim }} />
                    </div>
                    <div style={{ fontSize: 13.5, fontWeight: 700, color: T.text, marginBottom: 6, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                      <LevelDot color={lvl.color} /> {lvl.label}
                    </div>
                    <div style={{ fontSize: 12, color: T.textDim, lineHeight: 1.55 }}>
                      Чтобы открыть этот уровень, наберите ещё{" "}
                      <strong style={{ color: T.text }}>
                        {prevProg.remaining} {pluralizeRu(prevProg.remaining, "правильный ответ", "правильных ответа", "правильных ответов")}
                      </strong>{" "}
                      на уровне «<LevelDot color={prevLvl.color} /> {prevLvl.label}».
                    </div>
                  </div>
                );
              }

              return (
                <div key={lvl.level} style={{ marginTop: sectionMargin }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, color: T.text, margin: "0 0 2px 4px" }}>
                    <LevelDot color={lvl.color} />
                    <span>{lvl.label}</span>
                  </div>
                  {topicsInLevel.map((t) => {
                    const prog = topicProgress[t.id];
                    const isActive = current.topicId === t.id;
                    const isComplete = prog.done === prog.total;
                    return (
                      <button
                        key={t.id}
                        className="topic-btn"
                        onClick={() => jumpToTopic(t.id)}
                        style={{
                          display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                          padding: "9px 10px", borderRadius: 8, border: "none",
                          background: isActive ? T.surfaceAlt : "transparent", cursor: "pointer", color: T.text,
                        }}
                      >
                        <span
                          style={{
                            width: 20, height: 20, borderRadius: 5, display: "flex", alignItems: "center",
                            justifyContent: "center", flexShrink: 0,
                            background: isComplete ? T.success : "transparent",
                            border: isComplete ? "none" : `1.5px solid ${T.border}`,
                          }}
                        >
                          {isComplete && <Check size={13} strokeWidth={3} style={{ color: "#fff" }} />}
                        </span>
                        <span style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
                          <span
                            style={{
                              fontSize: 13.5, fontWeight: 500, lineHeight: 1.3,
                              color: isComplete ? T.textDim : T.text,
                              textDecoration: isComplete ? "line-through" : "none",
                            }}
                          >
                            {t.title}
                          </span>
                          <span className="topic-sub" style={{ fontSize: 11, color: T.textDim }}>{prog.done}/{prog.total}</span>
                        </span>
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </aside>

        <main
          id="main-content"
          tabIndex={-1}
          style={{ minWidth: 0 }}
          onTouchStart={(e) => {
            // Игнорируем жесты внутри textarea/input (редактор кода,
            // поля ввода) — иначе выделение текста или позиционирование
            // курсора пальцем внутри кода могло бы случайно засчитаться
            // за горизонтальный свайп и перекинуть на другой вопрос,
            // потеряв визуальный контекст прямо во время набора кода.
            const tag = e.target.tagName;
            if (tag === "TEXTAREA" || tag === "INPUT") {
              touchStartRef.current = null;
              return;
            }
            touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }}
          onTouchEnd={(e) => {
            if (!touchStartRef.current || mode === "summary") return;
            const dx = e.changedTouches[0].clientX - touchStartRef.current.x;
            const dy = e.changedTouches[0].clientY - touchStartRef.current.y;
            touchStartRef.current = null;
            if (Math.abs(dy) > Math.abs(dx)) return; // это вертикальный скролл, а не свайп
            if (Math.abs(dx) < 60) return; // слишком короткий свайп — игнорируем
            const forward = dx < 0; // свайп влево = вперёд
            if (inReview) {
              goToReview(forward ? reviewIdx + 1 : reviewIdx - 1);
            } else {
              goTo(forward ? currentIdx + 1 : currentIdx - 1);
            }
          }}
        >
          {!appDataLoaded ? (
            <HomeScreenSkeleton T={T} />
          ) : mode === "home" ? (
            <HomeScreen
              T={T}
              overallPct={overallPct}
              totalCorrect={totalCorrect}
              totalAnswered={totalAnswered}
              totalQuestions={ALL_QUESTIONS.length}
              rank={rank}
              streak={streak}
              onContinue={() => {
                setCurrentIdx(findResumeIndex(NAV_ITEMS, answers, topicProgress));
                setMode("learn");
              }}
            />
          ) : mode === "summary" ? (
            <SummaryScreen
              T={T}
              totalCorrect={totalCorrect}
              totalWrong={totalWrong}
              totalAnswered={totalAnswered}
              totalQuestions={ALL_QUESTIONS.length}
              topics={TOPICS}
              topicProgress={topicProgress}
              wrongQuestions={wrongQuestions}
              unlockedAchievements={unlockedAchievements}
              streak={streak}
              fastestAnswerMs={fastestAnswerMs}
              historyLog={historyLog}
              xp={xp}
              rank={rank}
              onReview={startReview}
              onBack={backToLearnMode}
              onResetProgress={resetProgress}
            />
          ) : mode === "profile" ? (
            <ProfileScreen
              T={T}
              xp={xp}
              rank={rank}
              streak={streak}
              topics={TOPICS}
              topicProgress={topicProgress}
              historyLog={historyLog}
              onGoToSummary={() => { setReviewQueue(null); setMode("summary"); }}
            />
          ) : mode === "sandbox" ? (
            <SandboxScreen T={T} />
          ) : mode === "project" ? (
            <ProjectScreen T={T} />
          ) : mode === "exam" ? (
            <ExamScreen T={T} soundEnabled={soundEnabled} />
          ) : mode === "viz" ? (
            <VizHub T={T} />
          ) : mode === "tree" ? (
            <KnowledgeTreeScreen T={T} topicProgress={topicProgress} isTopicLocked={isTopicLocked} onJumpToTopic={jumpToTopic} />
          ) : mode === "predict" ? (
            <PredictScreen T={T} />
          ) : mode === "history" ? (
            <HistoryScreen T={T} historyLog={historyLog} answers={answers} />
          ) : mode === "findbug" ? (
            <FindBugScreen T={T} />
          ) : (
            <>
              {topicRecommendation && !inReview && (
                <TopicRecommendationCard
                  T={T}
                  recommendation={topicRecommendation}
                  onReview={startTopicRecommendationReview}
                  onDismiss={dismissTopicRecommendation}
                />
              )}
              {inReview && (
                <div
                  style={{
                    display: "flex", alignItems: "center", justifyContent: "space-between",
                    background: `${T.accent}1A`, border: `1px solid ${T.accent}55`, borderRadius: 10,
                    padding: "10px 14px", marginBottom: 14, fontSize: 13,
                  }}
                >
                  <span style={{ color: T.text, display: "flex", alignItems: "center", gap: 6 }}>
                    <Repeat size={14} strokeWidth={2.2} /> Режим повторения ошибок · {reviewIdx + 1} из {reviewQueue.length}
                  </span>
                  <button
                    onClick={exitReview}
                    style={{ background: "none", border: "none", color: T.accent, cursor: "pointer", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}
                  >
                    Выйти <LogOut size={13} strokeWidth={2.4} />
                  </button>
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                <div style={{ fontSize: 12.5, color: T.textDim }}>
                  {inReview
                    ? `${current.topicTitle} · повторение`
                    : isLesson
                    ? `${current.topicTitle} · Теория`
                    : `${current.topicTitle} · вопрос ${
                        SHUFFLED_TOPICS.find((t) => t.id === current.topicId).questions.findIndex((q) => q.id === current.id) + 1
                      } из ${SHUFFLED_TOPICS.find((t) => t.id === current.topicId).questions.length}`}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    className="nav-arrow-btn"
                    title="← (стрелка влево)"
                    onClick={() => (inReview ? goToReview(navIdx - 1) : goTo(navIdx - 1))}
                    disabled={navIdx === 0}
                    style={{ ...navBtnStyle(T, navIdx === 0), display: "flex", alignItems: "center", gap: 4 }}
                  >
                    <ArrowLeft size={13} strokeWidth={2.2} /> <span className="nav-label">Назад</span>
                  </button>
                  <button
                    className="nav-arrow-btn"
                    title={nextNavLocked ? "Следующая тема заблокирована — см. уровни в списке слева" : "→ (стрелка вправо)"}
                    onClick={() => (inReview ? goToReview(navIdx + 1) : goTo(navIdx + 1))}
                    disabled={navIdx === totalNav - 1 || nextNavLocked}
                    style={{ ...navBtnStyle(T, navIdx === totalNav - 1 || nextNavLocked), display: "flex", alignItems: "center", gap: 4 }}
                  >
                    <span className="nav-label">{isLesson ? "Начать вопросы" : "Далее"}</span>{" "}
                    {nextNavLocked ? <Lock size={13} strokeWidth={2.2} /> : <ArrowRight size={13} strokeWidth={2.2} />}
                  </button>
                </div>
              </div>

              {!isLesson && !inReview && currentTopicProgress && (
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
                  <CircularProgress
                    pct={currentTopicPct} color={currentTopicPct === 100 ? T.success : T.accent} T={T}
                    size={34} strokeWidth={4} done={currentTopicPct === 100}
                  />
                  <div style={{ fontSize: 11.5, color: T.textDim }}>
                    Прогресс по теме: <span style={{ color: T.text, fontWeight: 600 }}>{currentTopicProgress.done}/{currentTopicProgress.total}</span>
                  </div>
                </div>
              )}

              {isLesson ? (
                <div key={`lesson-${current.topicId}`} className={`question-enter${isExiting ? " card-exiting" : ""}`}>
                  <LessonCard T={T} lesson={current.lesson} topicId={current.topicId} topicTitle={current.topicTitle} onStart={goToNextFromLesson} />
                </div>
          ) : (
            <div key={current.id} className={`question-enter${isExiting ? " card-exiting" : ""}`}>
            <div
              className={`question-card${answerFx === "correct" ? " fx-correct" : ""}${answerFx === "wrong" ? " fx-wrong" : ""}`}
              style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}
            >
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 600, lineHeight: 1.5, marginBottom: 18, wordBreak: "break-word" }}>
                {current.prompt}
              </div>

              {!isCode && (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {shuffledOptions.map(({ v: opt, i }) => {
                    const isSelected = selectedOption === i;
                    const isCorrectOpt = i === current.correct;
                    let bg = T.surfaceAlt;
                    let border = T.border;
                    if (checked && isSelected && isCorrectOpt) { bg = T.successBg; border = T.success; }
                    else if (checked && isSelected && !isCorrectOpt) { bg = T.errorBg; border = T.error; }
                    else if (checked && isCorrectOpt) { bg = T.successBg; border = T.success; }
                    return (
                      <button
                        key={i}
                        className="opt-btn"
                        disabled={checked}
                        onClick={() => submitQuiz(i)}
                        style={{
                          textAlign: "left", padding: "14px 16px", borderRadius: 14, width: "100%",
                          border: `1.5px solid ${border}`, background: bg, color: T.text,
                          cursor: checked ? "default" : "pointer", fontSize: 14,
                          fontFamily: "'JetBrains Mono', monospace", boxSizing: "border-box",
                          whiteSpace: "normal", wordBreak: "break-word",
                        }}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>
              )}

              {isCode && (
                <div className="ide-split">
                <div className="ide-split-left">
                  <CodeEditor
                    T={T}
                    value={code}
                    onChange={updateCode}
                    minHeight={140}
                    onKeyDown={(e) => {
                      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                        e.preventDefault();
                        submitCode();
                      }
                    }}
                  />
                  <div style={{ fontSize: 11, color: T.textDim, marginTop: 6 }}>
                    Ctrl+Enter (⌘+Enter на Mac) — быстрый запуск кода
                  </div>
                  <div style={{ display: "flex", gap: 10, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
                    <button
                      onClick={submitCode}
                      disabled={isRunning}
                      style={{
                        background: T.accent, color: "#fff", border: "none", borderRadius: 8,
                        padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: isRunning ? "default" : "pointer",
                        display: "flex", alignItems: "center", gap: 6, opacity: isRunning ? 0.75 : 1,
                      }}
                    >
                      {isRunning ? (
                        <svg className="running-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round">
                          <path d="M12 2a10 10 0 0 1 10 10" />
                        </svg>
                      ) : (
                        <Play size={14} strokeWidth={2.4} fill="currentColor" />
                      )}
                      {isRunning ? "Выполняется…" : "Выполнить и проверить"}
                    </button>
                    {current.hint && !showHint && (
                      <button
                        onClick={() => setShowHint(true)}
                        style={{
                          background: "transparent", color: T.accent2, border: `1px solid ${T.accent2}66`,
                          borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                          display: "flex", alignItems: "center", gap: 6,
                        }}
                      >
                        <Lightbulb size={14} strokeWidth={2.2} /> Показать подсказку
                      </button>
                    )}
                    {current.solution && status === "wrong" && (attempts[current.id] || 0) >= 2 && !showSolution && (
                      <button
                        onClick={() => setShowSolution(true)}
                        style={{
                          background: "transparent", color: T.error, border: `1px solid ${T.error}66`,
                          borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                          display: "flex", alignItems: "center", gap: 6,
                        }}
                      >
                        <Unlock size={14} strokeWidth={2.2} /> Показать решение
                      </button>
                    )}
                    {checked && !isRunning && (
                      <span style={{ fontSize: 12.5, color: T.textDim, alignSelf: "center" }}>
                        Ожидаемый вывод: {current.expectedLogs.join(", ")}
                      </span>
                    )}
                  </div>

                  {showHint && current.hint && (
                    <div
                      style={{
                        marginTop: 10, fontSize: 13, lineHeight: 1.6, color: T.text,
                        background: `${T.accent2}14`, border: `1px solid ${T.accent2}55`,
                        borderRadius: 9, padding: "10px 14px", display: "flex", gap: 8,
                      }}
                    >
                      <Lightbulb size={15} strokeWidth={2.2} style={{ flexShrink: 0, marginTop: 1, color: T.accent2 }} />
                      <span>{current.hint}</span>
                    </div>
                  )}

                  {showSolution && current.solution && (
                    <div
                      style={{
                        marginTop: 10, fontSize: 13, color: T.text,
                        background: T.console, border: `1px solid ${T.border}`,
                        borderRadius: 9, padding: "12px 14px",
                      }}
                    >
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <div style={{ fontSize: 11, color: T.textDim, textTransform: "uppercase", letterSpacing: "0.05em", display: "flex", alignItems: "center", gap: 5 }}>
                          <Unlock size={12} strokeWidth={2.2} /> Решение
                        </div>
                        <button
                          onClick={() => {
                            navigator.clipboard?.writeText(current.solution).then(
                              () => { setCopyStatus("copied"); setTimeout(() => setCopyStatus(null), 1500); },
                              () => { setCopyStatus("failed"); setTimeout(() => setCopyStatus(null), 1500); }
                            );
                          }}
                          style={{
                            background: "transparent", border: `1px solid ${T.border}`, borderRadius: 6,
                            padding: "3px 9px", fontSize: 11, color: T.textDim, cursor: "pointer",
                            display: "flex", alignItems: "center", gap: 4,
                          }}
                        >
                          {copyStatus === "copied" ? (
                            <><Check size={11} strokeWidth={2.4} /> Скопировано</>
                          ) : copyStatus === "failed" ? (
                            "Не вышло"
                          ) : (
                            <><Copy size={11} strokeWidth={2.2} /> Копировать</>
                          )}
                        </button>
                      </div>
                      <pre
                        className="mono"
                        style={{ margin: 0, whiteSpace: "pre-wrap", color: T.consoleText, fontSize: 13 }}
                        dangerouslySetInnerHTML={{ __html: highlightJs(current.solution, T) }}
                      />
                    </div>
                  )}

                  {current.liveKind && (
                    <LiveDomPreview
                      T={T}
                      kind={current.liveKind}
                      liveObj={liveObjRef.current}
                      tick={liveTick}
                      label={current.liveVarName}
                      onClickButton={clickLiveButton}
                    />
                  )}
                </div>

                <div className="ide-split-right">
                  {runResult && (
                    <div className="console-result-enter" style={{ background: T.console, borderRadius: 9, overflow: "hidden", border: `1px solid ${T.border}` }}>
                      <div style={{ padding: "6px 12px", fontSize: 10.5, letterSpacing: "0.06em", textTransform: "uppercase", color: "#7A7A90", borderBottom: "1px solid #FFFFFF14", display: "flex", alignItems: "center", gap: 5 }}>
                        <Terminal size={11} strokeWidth={2.2} /> console
                      </div>
                      <div style={{ padding: "10px 12px", fontSize: 13 }} className="mono">
                        {runResult.error && (
                          <div style={{ color: T.error, display: "flex", alignItems: "center", gap: 5 }}>
                            <XCircle size={13} strokeWidth={2.2} /> Error: {runResult.error}
                          </div>
                        )}
                        {!runResult.error && runResult.logs.length === 0 && (
                          <div style={{ color: "#7A7A90" }}>// нет вывода — добавь console.log(...)</div>
                        )}
                        {runResult.logs.map((l, i) => (
                          <div key={i} style={{ color: T.consoleText }}>
                            <span style={{ color: T.accent2 }}>❯ </span>{l}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {!runResult && (
                    <div style={{ background: T.surfaceAlt, borderRadius: 9, border: `1px dashed ${T.border}`, padding: "16px 14px", fontSize: 12.5, color: T.textDim, textAlign: "center" }}>
                      Нажми «Выполнить и проверить» — здесь появится вывод консоли
                    </div>
                  )}
                  {checked && (
                    <div
                      style={{
                        marginTop: 14, padding: 16, borderRadius: 10,
                        background: status === "correct" ? T.successBg : T.errorBg,
                        border: `1px solid ${status === "correct" ? T.success : T.error}55`,
                      }}
                    >
                      <Mascot T={T} status={status} seed={current.id} />
                      <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6, color: status === "correct" ? T.success : T.error, display: "flex", alignItems: "center", gap: 6 }}>
                        {status === "correct" ? (
                          <><CheckCircle2 size={16} strokeWidth={2.2} /> Верно</>
                        ) : (
                          <><XCircle size={16} strokeWidth={2.2} /> Пока не так</>
                        )}
                      </div>
                      <div style={{ fontSize: 13.5, lineHeight: 1.6, color: T.text }}>
                        {status === "correct" ? current.why.right : (current.why.byOption?.[selectedOption] ?? current.why.wrong)}
                      </div>
                      {status !== "correct" && (
                        <div style={{ marginTop: 16, fontSize: 13, lineHeight: 1.6, color: T.textDim, borderTop: `1px solid ${T.border}66`, paddingTop: 16 }}>
                          <strong style={{ color: T.text }}>Как правильно: </strong>
                          {current.why.right}
                        </div>
                      )}
                      {status !== "correct" && (
                        <EscalationHelper T={T} attemptCount={attempts[current.id] || 0} tags={current.tags} />
                      )}
                    </div>
                  )}
                </div>
                </div>
              )}

              {!isCode && checked && (
                <div
                  style={{
                    marginTop: 16, padding: 16, borderRadius: 10,
                    background: status === "correct" ? T.successBg : T.errorBg,
                    border: `1px solid ${status === "correct" ? T.success : T.error}55`,
                  }}
                >
                  <Mascot T={T} status={status} seed={current.id} />
                  <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 6, color: status === "correct" ? T.success : T.error, display: "flex", alignItems: "center", gap: 6 }}>
                    {status === "correct" ? (
                      <><CheckCircle2 size={16} strokeWidth={2.2} /> Верно</>
                    ) : (
                      <><XCircle size={16} strokeWidth={2.2} /> Пока не так</>
                    )}
                  </div>
                  <div style={{ fontSize: 13.5, lineHeight: 1.6, color: T.text }}>
                    {status === "correct" ? current.why.right : (current.why.byOption?.[selectedOption] ?? current.why.wrong)}
                  </div>
                  {status !== "correct" && (
                    <div style={{ marginTop: 16, fontSize: 13, lineHeight: 1.6, color: T.textDim, borderTop: `1px solid ${T.border}66`, paddingTop: 16 }}>
                      <strong style={{ color: T.text }}>Как правильно: </strong>
                      {current.why.right}
                    </div>
                  )}
                  {status !== "correct" && (
                    <EscalationHelper T={T} attemptCount={attempts[current.id] || 0} tags={current.tags} />
                  )}
                  {status !== "correct" && current.type === "quiz" && (
                    <button
                      onClick={() => { setSelectedOption(null); setChecked(false); lastSubmittedIdRef.current = null; }}
                      style={{
                        marginTop: 12, background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8,
                        padding: "8px 14px", fontSize: 12.5, color: T.text, cursor: "pointer",
                        display: "flex", alignItems: "center", gap: 6,
                      }}
                    >
                      <Repeat size={13} strokeWidth={2.2} /> Попробовать ещё раз
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
          )}

          <div
            style={{
              marginTop: 24,
              fontSize: 11,
              color: T.textDim,
              textAlign: "center",
              opacity: 0.6,
              display: "flex",
              justifyContent: "center",
              gap: 16,
              flexWrap: "wrap",
            }}
          >
            <span>← → навигация</span>
            {isCode && <span>Esc — закрыть подсказку/решение</span>}
            {!isLesson && <span>R — сбросить вопрос</span>}
          </div>
            </>
          )}
        </main>
      </div>
    </div>
  );
}

/**
 * Экран «Итоги»: процент верных ответов, разбивка по темам,
 * список вопросов с ошибками и сертификат при 100% прохождении.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {number} props.totalCorrect
 * @param {number} props.totalWrong
 * @param {number} props.totalAnswered
 * @param {number} props.totalQuestions
 * @param {Topic[]} props.topics
 * @param {Object<string, {done: number, total: number, correct: number}>} props.topicProgress
 * @param {(Question & {topicId: string, topicTitle: string})[]} props.wrongQuestions
 * @param {Object<string, boolean>} props.unlockedAchievements - id -> true для открытых достижений
 * @param {() => void} props.onReview - Запустить режим повторения ошибок
 * @param {() => void} props.onBack - Вернуться к обычному прохождению
 */
const SummaryScreen = memo(function SummaryScreen({ T, totalCorrect, totalWrong, totalAnswered, totalQuestions, topics, topicProgress, wrongQuestions, unlockedAchievements, streak, fastestAnswerMs, historyLog, xp, rank, onReview, onBack, onResetProgress }) {
  const pct = totalQuestions ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
  const isComplete = totalAnswered >= totalQuestions;

  // Среднее время на вопрос — только по попыткам, где elapsedMs реально
  // записан (эта метрика появилась позже самого лога истории, поэтому
  // самые старые записи могут быть без неё — честно их не считаем,
  // а не подставляем 0).
  const avgAnswerMs = useMemo(() => {
    const withTime = historyLog.filter((e) => typeof e.elapsedMs === "number");
    if (withTime.length === 0) return null;
    return withTime.reduce((sum, e) => sum + e.elapsedMs, 0) / withTime.length;
  }, [historyLog]);

  // Топ-3 темы, где чаще всего ошибается — только среди начатых тем
  // (нет смысла "рекомендовать повторить" тему, до которой ещё не
  // дошли), отсортировано по проценту верных от худшего к лучшему.
  const weakestTopics = useMemo(() => {
    return topics
      .map((t) => {
        const p = topicProgress[t.id];
        const pctT = p && p.total > 0 ? Math.round((p.correct / p.total) * 100) : null;
        return { t, p, pctT };
      })
      .filter((x) => x.p && x.p.done > 0 && x.pctT !== null && x.pctT < 100)
      .sort((a, b) => a.pctT - b.pctT)
      .slice(0, 3);
  }, [topics, topicProgress]);

  const [certName, setCertName] = useState("");
  const [showDetailedStats, setShowDetailedStats] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(CERT_NAME_KEY);
        if (res && res.value) setCertName(res.value);
      } catch {
        // сохранённого имени нет — оставляем поле пустым
      }
    })();
  }, []);
  function updateCertName(value) {
    setCertName(value);
    safeStorage.set(CERT_NAME_KEY, value);
  }

  function downloadCertificate() {
    const canvas = document.createElement("canvas");
    canvas.width = 1000;
    canvas.height = 640;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = T.accent;
    ctx.lineWidth = 6;
    ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);

    ctx.fillStyle = T.accent;
    ctx.font = "600 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("JS.TRACK", canvas.width / 2, 110);

    ctx.fillStyle = T.text;
    ctx.font = "700 44px sans-serif";
    ctx.fillText("Сертификат о прохождении курса", canvas.width / 2, 200);

    ctx.font = "400 22px sans-serif";
    ctx.fillStyle = T.textDim;
    ctx.fillText("От Beginner до Junior · JavaScript (ES6+)", canvas.width / 2, 250);

    const trimmedName = certName.trim();
    if (trimmedName) {
      ctx.font = "600 30px sans-serif";
      ctx.fillStyle = T.text;
      ctx.fillText(trimmedName, canvas.width / 2, 315);
    }

    ctx.font = "700 64px sans-serif";
    ctx.fillStyle = T.accent;
    ctx.fillText(`${pct}%`, canvas.width / 2, 380);

    ctx.font = "600 24px sans-serif";
    ctx.fillStyle = T.accent2;
    ctx.fillText(rankTitle(rank), canvas.width / 2, 420);

    ctx.font = "400 20px sans-serif";
    ctx.fillStyle = T.textDim;
    ctx.fillText(`правильных ответов · ${totalCorrect} из ${totalQuestions} вопросов`, canvas.width / 2, 455);

    const dateStr = new Date().toLocaleDateString("ru-RU", { year: "numeric", month: "long", day: "numeric" });
    ctx.font = "400 18px sans-serif";
    ctx.fillStyle = T.textDim;
    ctx.fillText(dateStr, canvas.width / 2, 560);

    const link = document.createElement("a");
    link.download = "js-track-certificate.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  if (isComplete && !showDetailedStats) {
    return (
      <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: "36px 28px", textAlign: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 6, lineHeight: 1 }}>🏆</div>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 26, fontWeight: 700, color: T.text, marginBottom: 8 }}>
          Поздравляем!
        </div>
        <div style={{ fontSize: 15, color: T.textDim, marginBottom: 28 }}>
          Вы изучили JavaScript — от переменных до async/await.
        </div>

        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 12 }}>
          Получено
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 16, marginBottom: 28, maxWidth: 520, marginLeft: "auto", marginRight: "auto" }}>
          <DashboardCard T={T} emoji="⭐" label="Опыта получено" stripeColor={T.accent} value={`${xp} XP`} />
          <DashboardCard
            T={T} emoji="🔥" label="Серия" stripeColor={T.accent2}
            value={streak && streak.count > 0 ? `${streak.count} ${streak.count === 1 ? "день" : streak.count < 5 ? "дня" : "дней"}` : "—"}
          />
          <DashboardCard T={T} emoji="🥇" label="Звание сертификата" stripeColor={T.success} value={rankTitle(rank)} />
        </div>

        <div style={{ maxWidth: 320, margin: "0 auto" }}>
          <input
            type="text"
            value={certName}
            onChange={(e) => updateCertName(e.target.value)}
            placeholder="Имя для сертификата (необязательно)"
            aria-label="Имя для сертификата"
            maxLength={60}
            style={{
              display: "block", width: "100%", marginBottom: 12,
              background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8,
              padding: "9px 12px", fontSize: 13, color: T.text, textAlign: "center", boxSizing: "border-box",
            }}
          />
          <button
            onClick={downloadCertificate}
            style={{
              width: "100%", background: T.accent, color: "#fff", border: "none", borderRadius: 8,
              padding: "10px 16px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", marginBottom: 10,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            }}
          >
            <Award size={14} strokeWidth={2.2} /> Скачать сертификат (PNG)
          </button>
          <button
            onClick={onResetProgress}
            style={{
              width: "100%", background: "transparent", color: T.textDim, border: `1px solid ${T.border}`, borderRadius: 8,
              padding: "9px 16px", fontSize: 13, cursor: "pointer", marginBottom: 14,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            }}
          >
            <RotateCcw size={13} strokeWidth={2.2} /> Повторить курс
          </button>
          <button
            onClick={() => setShowDetailedStats(true)}
            style={{ background: "transparent", border: "none", color: T.accent, fontSize: 12.5, cursor: "pointer", textDecoration: "underline" }}
          >
            Посмотреть подробную статистику
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700 }}>
          Итоги
        </div>
        {isComplete && (
          <button
            onClick={() => setShowDetailedStats(false)}
            style={{ background: "transparent", border: "none", color: T.accent, fontSize: 12.5, cursor: "pointer" }}
          >
            🏆 Назад к празднику
          </button>
        )}
      </div>
      <div style={{ fontSize: 13, color: T.textDim, marginBottom: 20 }}>
        Пройдено {totalAnswered} из {totalQuestions} вопросов
      </div>

      {isComplete && (
        <div
          style={{
            marginBottom: 22, padding: 18, borderRadius: 12,
            background: `linear-gradient(135deg, ${T.accent}22, ${T.accent2}18)`,
            border: `1.5px solid ${T.accent}55`,
          }}
        >
          <div style={{ fontSize: 15, fontWeight: 700, color: T.text, marginBottom: 4, display: "flex", alignItems: "center", gap: 7 }}>
            <GraduationCap size={18} strokeWidth={2.2} /> Курс пройден полностью!
          </div>
          <div style={{ fontSize: 13, color: T.textDim, marginBottom: 12 }}>
            {pct}% правильных ответов из {totalQuestions} вопросов. Можно скачать сертификат на память.
          </div>
          <input
            type="text"
            value={certName}
            onChange={(e) => updateCertName(e.target.value)}
            placeholder="Имя для сертификата (необязательно)"
            aria-label="Имя для сертификата"
            maxLength={60}
            style={{
              display: "block", width: "100%", maxWidth: 320, marginBottom: 12,
              background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8,
              padding: "8px 12px", fontSize: 13, color: T.text,
            }}
          />
          <button
            onClick={downloadCertificate}
            style={{
              background: T.accent, color: "#fff", border: "none", borderRadius: 8,
              padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer",
              display: "flex", alignItems: "center", gap: 6,
            }}
          >
            <Award size={14} strokeWidth={2.2} /> Скачать сертификат (PNG)
          </button>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 16, marginBottom: 16 }}>
        <DashboardCard
          T={T} emoji="🔥" label="Серия" stripeColor={T.accent2}
          value={streak && streak.count > 0 ? `${streak.count} ${streak.count === 1 ? "день" : streak.count < 5 ? "дня" : "дней"}` : "—"}
        />
        <DashboardCard T={T} emoji="⭐" label="Верных ответов" stripeColor={T.accent} value={`${pct}%`} />
        <DashboardCard
          T={T} emoji="📚" label="Тем изучено" stripeColor={T.success}
          value={`${topics.filter((t) => { const p = topicProgress[t.id]; return p && p.total > 0 && p.done === p.total; }).length}/${topics.length}`}
        />
        <DashboardCard T={T} emoji="🏆" label="Звание" stripeColor={T.error} value={rankTitle(rank)} />
      </div>

      <div style={{ display: "flex", gap: 12, marginBottom: 22, flexWrap: "wrap" }}>
        <StatCard T={T} value={totalCorrect} label="верно" color={T.success} />
        <StatCard T={T} value={totalWrong} label="с ошибкой" color={T.error} />
        {fastestAnswerMs != null && (
          <StatCard
            T={T}
            value={`⚡ ${(fastestAnswerMs / 1000).toFixed(1)}с`}
            label="самый быстрый верный ответ"
            color={T.accent2}
          />
        )}
        {avgAnswerMs != null && (
          <StatCard
            T={T}
            value={`⏱️ ${(avgAnswerMs / 1000).toFixed(1)}с`}
            label="среднее время на вопрос"
            color={T.accent}
          />
        )}
        <StatCard T={T} value={`${xp} XP`} label="всего опыта" color={T.accent2} />
      </div>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 10 }}>
        Тренд точности за 2 недели
      </div>
      <div style={{ marginBottom: 22, padding: "8px 4px", background: T.surfaceAlt, borderRadius: 10, border: `1px solid ${T.border}` }}>
        <ProgressTrendChart T={T} historyLog={historyLog} />
      </div>

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 10 }}>
        Достижения ({Object.keys(unlockedAchievements).length}/{ACHIEVEMENTS.length})
      </div>
      <div
        style={{
          display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))",
          gap: 16, marginBottom: 22,
        }}
      >
        {ACHIEVEMENTS.map((a) => {
          const unlocked = !!unlockedAchievements[a.id];
          return (
            <div
              key={a.id}
              title={a.description}
              style={{
                background: unlocked ? `${T.accent}14` : T.surfaceAlt,
                border: `1.5px solid ${unlocked ? T.accent : T.border}`,
                borderRadius: 10, padding: "10px 12px",
                opacity: unlocked ? 1 : 0.55,
                // Штамп-тень — только у УЖЕ открытых достижений: это
                // "получено", как оттиск печати, а не у ещё не
                // заработанных серых плиток.
                boxShadow: unlocked ? `2.5px 2.5px 0 0 ${T.accent}55` : "none",
              }}
            >
              <div style={{ fontSize: 22, marginBottom: 4, filter: unlocked ? "none" : "grayscale(1)" }}>
                {a.emoji}
              </div>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: T.text, marginBottom: 2 }}>
                {a.title}
              </div>
              <div style={{ fontSize: 11, color: T.textDim, lineHeight: 1.4 }}>
                {a.description}
              </div>
            </div>
          );
        })}
      </div>

      {weakestTopics.length > 0 && (
        <div style={{ marginBottom: 22, padding: 16, borderRadius: 10, background: `${T.error}0D`, border: `1px solid ${T.error}44` }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: T.error, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
            ⚠️ Стоит повторить в первую очередь
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {weakestTopics.map(({ t, p, pctT }) => (
              <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                <span style={{ color: T.text }}>{t.title}</span>
                <span className="mono" style={{ color: T.error, fontWeight: 600 }}>{pctT}% ({p.correct}/{p.total})</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 10 }}>
        По темам
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 16, marginBottom: 22 }}>
        {topics
          .map((t) => {
            const p = topicProgress[t.id];
            const pct = p.total ? Math.round((p.correct / p.total) * 100) : 0;
            const started = p.done > 0;
            return { t, p, pct, started };
          })
          // сначала начатые темы — от самой слабой к самой сильной,
          // затем ещё не начатые: так сразу видно, что повторить в первую очередь
          .sort((a, b) => {
            if (a.started !== b.started) return a.started ? -1 : 1;
            return a.pct - b.pct;
          })
          .map(({ t, p, pct, started }) => {
            const barColor = !started ? T.textDim : pct >= 85 ? T.success : pct >= 60 ? T.accent2 : T.error;
            const stripeColor = LEVELS[t.level - 1]?.color || T.accent;
            return (
              <div
                key={t.id}
                className="topic-card"
                style={{
                  background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14,
                  overflow: "hidden", display: "flex", flexDirection: "column",
                }}
              >
                <div style={{ height: 4, background: stripeColor, flexShrink: 0 }} />
                <div style={{ padding: "16px 14px", display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
                  <div style={{ fontSize: 30, marginBottom: 10 }}>
                    {TOPIC_EMOJI[t.id] || "📘"}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.text, textAlign: "center", marginBottom: 12, lineHeight: 1.3 }}>
                    {t.title}
                  </div>
                  <CircularProgress pct={started ? pct : 0} color={started ? barColor : T.border} T={T} size={58} strokeWidth={5} done={started && pct === 100} />
                  <div style={{ fontSize: 11, color: T.textDim, marginTop: 8 }}>{p.correct}/{p.total}</div>
                </div>
              </div>
            );
          })}
      </div>

      {wrongQuestions.length > 0 && (
        <>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: T.textDim, fontWeight: 600, marginBottom: 10 }}>
            Вопросы с ошибкой ({wrongQuestions.length})
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 22 }}>
            {wrongQuestions.map((q) => (
              <div
                key={q.id}
                style={{ background: T.errorBg, border: `1px solid ${T.error}33`, borderRadius: 8, padding: "8px 12px", fontSize: 13 }}
              >
                <span style={{ color: T.textDim }}>{q.topicTitle}: </span>
                <span style={{ color: T.text }}>{q.prompt}</span>
              </div>
            ))}
          </div>
        </>
      )}

      <div style={{ display: "flex", gap: 10 }}>
        <button
          onClick={onReview}
          disabled={wrongQuestions.length === 0}
          style={{
            background: wrongQuestions.length === 0 ? T.surfaceAlt : T.accent,
            color: wrongQuestions.length === 0 ? T.textDim : "#fff",
            border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13.5, fontWeight: 600,
            cursor: wrongQuestions.length === 0 ? "default" : "pointer",
            display: "flex", alignItems: "center", gap: 6,
          }}
        >
          <Repeat size={14} strokeWidth={2.2} /> Повторить ошибки
        </button>
        <button
          onClick={onBack}
          style={{
            background: T.surfaceAlt, color: T.text, border: `1px solid ${T.border}`, borderRadius: 8,
            padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
          }}
        >
          Назад к вопросам
        </button>
      </div>
    </div>
  );
});

/**
 * Экран «Профиль» — личность (имя, аватар, дата первого визита) и
 * полная таблица прогресса по ВСЕМ темам курса. Сознательно НЕ
 * дублирует то, что уже есть на «Итогах» (достижения, тренд точности,
 * сертификат) — там уже полноценный дашборд, а здесь ровно то, чего
 * не хватало: имя пользователя на первом месте и разбивка по каждой
 * теме, а не только топ-3 самых слабых.
 */
const ProfileScreen = memo(function ProfileScreen({ T, xp, rank, streak, topics, topicProgress, historyLog, onGoToSummary }) {
  const [certName, setCertName] = useState("");
  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(CERT_NAME_KEY);
        if (res && res.value) setCertName(res.value);
      } catch {
        // имя ещё не вводили — поле просто останется пустым
      }
    })();
  }, []);
  function updateCertName(value) {
    setCertName(value);
    safeStorage.set(CERT_NAME_KEY, value);
  }

  // Резервное копирование прогресса — см. exportProgressData/
  // importProgressData выше. fileInputRef — скрытый <input type="file">,
  // открываем его кликом по обычной кнопке (нативный file-picker нельзя
  // стилизовать напрямую, это стандартный приём).
  const fileInputRef = useRef(null);
  const [importStatus, setImportStatus] = useState(null); // null | {type: "error", message}

  async function handleImportFile(e) {
    const file = e.target.files[0];
    e.target.value = ""; // сброс — иначе повторный выбор ТОГО ЖЕ файла не вызовет onChange
    if (!file) return;
    const ok = window.confirm(
      "Импорт заменит весь текущий прогресс данными из файла (ответы, XP, достижения, серию, историю). Это действие нельзя отменить. Продолжить?"
    );
    if (!ok) return;
    try {
      await importProgressData(file);
      // Перезагрузка — самый надёжный способ применить импортированные
      // данные: они разбросаны по answers/xp/achievements/streak/history
      // в доброй дюжине разных хуков, и куда проще перечитать всё заново
      // с чистого листа, чем аккуратно проталкивать импорт в каждый кусок
      // React-состояния по отдельности.
      window.location.reload();
    } catch (err) {
      setImportStatus({ type: "error", message: err.message });
    }
  }

  // "С нами с ..." — по самой ранней записи в historyLog. historyLog
  // хранит не более MAX_HISTORY_ENTRIES (500) последних попыток — при
  // 51 вопросе курса это означает, что на практике первая запись
  // почти всегда останется настоящей датой первого ответа; отдельный
  // ключ хранения just for this не заводим — цена не стоит выгоды.
  const memberSince = useMemo(() => {
    if (!historyLog || historyLog.length === 0) return null;
    const earliestTs = historyLog.reduce((min, e) => (e.ts < min ? e.ts : min), historyLog[0].ts);
    return new Date(earliestTs).toLocaleDateString("ru-RU", { year: "numeric", month: "long", day: "numeric" });
  }, [historyLog]);

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 26 }}>
        <div
          style={{
            width: 64, height: 64, borderRadius: "50%", flexShrink: 0,

/**
 * Маленькая карточка с одной цифрой и подписью (используется на экране итогов).
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {string|number} props.value
 * @param {string} props.label
 * @param {string} props.color
 */
/**
 * Готовит точки для графика тренда точности: по одному значению на
 * каждый день из последних `days`, где реально была хотя бы одна
 * попытка — дни без единой попытки пропускаются (не подставляем 0%,
 * чтобы не изображать "провал" там, где просто не занимались).
 * @param {Array} historyLog
 * @param {number} days
 */
function buildDailyAccuracy(historyLog, days = 14) {
  const today = startOfDay(Date.now());
  const byDay = {};
  historyLog.forEach((e) => {
    const day = startOfDay(e.ts);
    if (!byDay[day]) byDay[day] = { correct: 0, total: 0 };
    byDay[day].total += 1;
    if (e.correct) byDay[day].correct += 1;
  });
  const points = [];
  for (let i = days - 1; i >= 0; i--) {
    const day = today - i * DAY_MS;
    const d = byDay[day];
    if (d) points.push({ day, pct: Math.round((d.correct / d.total) * 100), total: d.total });
  }
  return points;
}

/**
 * График тренда точности за последние ~2 недели — простой SVG-график
 * (не столбцы прогресса и не календарь активности: это именно ТРЕНД
 * во времени, которого раньше не было). Показывается, только если
 * реально накопилось хотя бы 2 дня с данными — на одной точке график
 * ничего не говорит, честнее показать заглушку.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {Array} props.historyLog
 */
const ProgressTrendChart = memo(function ProgressTrendChart({ T, historyLog }) {
  const points = useMemo(() => buildDailyAccuracy(historyLog, 14), [historyLog]);
  if (points.length < 2) {
    return (
      <div style={{ fontSize: 12.5, color: T.textDim, fontStyle: "italic", padding: "20px 0", textAlign: "center" }}>
        Пока маловато данных для графика — покажется, как только наберётся хотя бы пара дней занятий.
      </div>
    );
  }
  const W = 600, H = 130, padX = 8, padY = 14;
  const stepX = (W - padX * 2) / Math.max(1, points.length - 1);
  const coords = points.map((p, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - p.pct / 100) * (H - padY * 2),
    ...p,
  }));
  const linePath = coords.map((c, i) => `${i === 0 ? "M" : "L"} ${c.x} ${c.y}`).join(" ");
  const areaPath = `${linePath} L ${coords[coords.length - 1].x} ${H - padY} L ${coords[0].x} ${H - padY} Z`;

  return (
    <div style={{ overflowX: "auto" }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 420, display: "block" }}>
        {[0, 50, 100].map((v) => {
          const y = padY + (1 - v / 100) * (H - padY * 2);
          return (
            <g key={v}>
              <line x1={padX} y1={y} x2={W - padX} y2={y} stroke={T.border} strokeWidth={1} strokeDasharray="3 3" />
              <text x={padX} y={y - 3} fontSize={9} fill={T.textDim}>{v}%</text>
            </g>
          );
        })}
        <path d={areaPath} fill={`${T.accent}1A`} stroke="none" />
        <path d={linePath} fill="none" stroke={T.accent} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
        {coords.map((c, i) => (
          <circle key={i} cx={c.x} cy={c.y} r={3.5} fill={T.surface} stroke={T.accent} strokeWidth={2}>
            <title>{formatDayLabel(c.day)}: {c.pct}% ({c.total} {c.total === 1 ? "вопрос" : c.total < 5 ? "вопроса" : "вопросов"})</title>
          </circle>
        ))}
      </svg>
    </div>
  );
});

const SANDBOX_DEFAULT_CODE = "let a = 5;\nlet b = 10;\n\nconsole.log(a + b);\n";

/**
 * Свободная консоль — не привязана ни к одному вопросу, никакой
 * проверки на правильность. Просто редактор + «Выполнить» + вывод,
 * чтобы можно было экспериментировать с любым JS вне рамок конкретного
 * задания. Использует те же runUserCode/highlightJs, что и обычные
 * упражнения — включая защиту от бесконечных циклов (injectLoopGuard).
 * Черновик кода сохраняется в safeStorage и переживает перезагрузку.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 */
const SandboxScreen = memo(function SandboxScreen({ T }) {
  const [code, setCode] = useState(SANDBOX_DEFAULT_CODE);
  const [runResult, setRunResult] = useState(null);
  const [isRunning, setIsRunning] = useState(false);
  const [copyStatus, setCopyStatus] = useState(null);
  // debugSession === null — обычный редактор; иначе { steps, idx, error, code }
  // (code внутри сессии — «замороженная» на момент запуска копия, чтобы
  // правки в textarea во время просмотра шагов не расходились со снимками).
  const [debugSession, setDebugSession] = useState(null);
  // Ручной трекинг интервалов больше не нужен: свободный код в «Консоли»
  // (без live-объектов) теперь выполняется в Web Worker (см. runUserCode),
  // а завершение/повторный запуск воркера через terminate() автоматически
  // останавливает ЛЮБЫЕ таймеры внутри него — специально отслеживать id
  // каждого setInterval вручную больше незачем.
  // Реф на отложенный запуск (см. setTimeout в run() ниже) — если
  // пользователь уходит с экрана до истечения искусственной задержки,
  // нужно отменить сам этот таймер, а не только то, что он должен был бы создать.
  const pendingRunTimeoutRef = useRef(null);

  useEffect(() => {
    return () => {
      if (pendingRunTimeoutRef.current) clearTimeout(pendingRunTimeoutRef.current);
      terminateActiveCodeWorker();
    };
  }, []);

  function stopPendingRun() {
    if (pendingRunTimeoutRef.current) {
      clearTimeout(pendingRunTimeoutRef.current);
      pendingRunTimeoutRef.current = null;
    }
    terminateActiveCodeWorker();
  }

  useEffect(() => {
    (async () => {
      try {
        const res = await safeStorage.get(SANDBOX_KEY);
        if (res && res.value) setCode(res.value);
      } catch {
        // черновика ещё нет — остаёмся на примере по умолчанию
      }
    })();
  }, []);

  function updateCode(value) {
    setCode(value);
    safeStorage.set(SANDBOX_KEY, value);
  }

  function run() {
    stopPendingRun();
    // Та же искусственная короткая пауза, что и в основном потоке
    // вопросов (см. RunningIndicator) — для ощущения запуска, а не
    // мгновенной вспышки результата. Сам код выполняется в Worker
    // (runUserCode без extraArgs) — свободный код здесь может содержать
    // что угодно, включая случайный бесконечный цикл, и это больше не
    // блокирует интерфейс.
    setIsRunning(true);
    pendingRunTimeoutRef.current = setTimeout(async () => {
      pendingRunTimeoutRef.current = null;
      const result = await runUserCode(code);
      setRunResult(result);
      setIsRunning(false);
    }, 350);
  }

  function resetToExample() {
    stopPendingRun();
    updateCode(SANDBOX_DEFAULT_CODE);
    setRunResult(null);
  }

  function startDebug() {
    const result = runUserCodeStepByStep(code);
    setDebugSession({ steps: result.steps, idx: 0, error: result.error, code });
  }

  function stopDebug() {
    setDebugSession(null);
  }

  return (
    <div className="question-card question-enter" style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 18, padding: 26 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18, gap: 12, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 4 }}>
            Свободная консоль
          </div>
          <div style={{ fontSize: 13, color: T.textDim }}>
            Пиши любой JS и смотри результат — без привязки к заданиям, без проверки ответа.
          </div>
        </div>
        {!debugSession && (
          <button
            onClick={resetToExample}
            style={{
              background: "transparent", border: `1px solid ${T.border}`, borderRadius: 8,
              padding: "7px 12px", fontSize: 12.5, color: T.textDim, cursor: "pointer",
              display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
            }}
          >
            <RotateCcw size={13} strokeWidth={2.2} /> Пример по умолчанию
          </button>
        )}
      </div>

      {debugSession ? (
        <DebugPanel T={T} session={debugSession} setSession={setDebugSession} onExit={stopDebug} />
      ) : (
        <>
          <CodeEditor
            T={T}
            value={code}
            onChange={updateCode}
            minHeight={220}
            onKeyDown={(e) => {
              if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                run();
              }
            }}
          />
          <div style={{ fontSize: 11, color: T.textDim, marginTop: 6 }}>
            Ctrl+Enter (⌘+Enter на Mac) — быстрый запуск кода
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
            <button
              onClick={run}
              disabled={isRunning}
              style={{
                background: T.accent, color: "#fff", border: "none", borderRadius: 8,
                padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: isRunning ? "default" : "pointer",
                display: "flex", alignItems: "center", gap: 6, opacity: isRunning ? 0.75 : 1,
              }}
            >
              {isRunning ? (
                <svg className="running-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round">
                  <path d="M12 2a10 10 0 0 1 10 10" />
                </svg>
              ) : (
                <Play size={14} strokeWidth={2.4} fill="currentColor" />
              )}
              {isRunning ? "Выполняется…" : "Выполнить"}
            </button>
            <button
              onClick={startDebug}
              style={{
                background: T.surfaceAlt, color: T.text, border: `1px solid ${T.border}`, borderRadius: 8,
                padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer",
                display: "flex", alignItems: "center", gap: 6,
              }}
              title="Выполнить построчно, с подсветкой текущей строки и значениями переменных"
            >
              🐞 Отладчик
            </button>
            {runResult && (
              <button
                onClick={() => {
                  navigator.clipboard?.writeText(code).then(
                    () => { setCopyStatus("copied"); setTimeout(() => setCopyStatus(null), 1500); },
                    () => { setCopyStatus("failed"); setTimeout(() => setCopyStatus(null), 1500); }
                  );
                }}
                style={{
                  background: "transparent", border: `1px solid ${T.border}`, borderRadius: 8,
                  padding: "8px 14px", fontSize: 12.5, color: T.textDim, cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 6,
                }}
              >
                {copyStatus === "copied" ? (
                  <><Check size={13} strokeWidth={2.4} /> Скопировано</>
                ) : copyStatus === "failed" ? (
                  "Не вышло"
                ) : (
                  <><Copy size={13} strokeWidth={2.2} /> Копировать код</>
                )}
              </button>
            )}
          </div>

          {runResult && (
            <div style={{ marginTop: 14, background: T.console, borderRadius: 9, overflow: "hidden", border: `1px solid ${T.border}` }}>
              <div style={{ padding: "6px 12px", fontSize: 10.5, letterSpacing: "0.06em", textTransform: "uppercase", color: "#7A7A90", borderBottom: "1px solid #FFFFFF14", display: "flex", alignItems: "center", gap: 5 }}>
                <Terminal size={11} strokeWidth={2.2} /> console
              </div>
              <div style={{ padding: "10px 12px", fontSize: 13 }} className="mono">
                {runResult.error && (
                  <div style={{ color: T.error, display: "flex", alignItems: "center", gap: 5 }}>
                    <XCircle size={13} strokeWidth={2.2} /> Error: {runResult.error}
                  </div>
                )}
                {!runResult.error && runResult.logs.length === 0 && (
                  <div style={{ color: "#7A7A90" }}>// нет вывода — добавь console.log(...)</div>
                )}
                {runResult.logs.map((l, i) => (
                  <div key={i} style={{ color: T.consoleText }}>
                    <span style={{ color: T.accent2 }}>❯ </span>{l}
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
});

/**
 * Панель пошагового отладчика: подсвечивает текущую строку кода,
 * показывает значения переменных сразу после неё и накопленный
 * вывод console.log вплоть до текущего шага. session.steps уже
 * полностью посчитан заранее (см. runUserCodeStepByStep) — панель
 * только листает готовый массив, никакого повторного выполнения кода.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {{steps: Array, idx: number, error: string|null, code: string}} props.session
 * @param {(updater: Function) => void} props.setSession
 * @param {() => void} props.onExit
 */
const DebugPanel = memo(function DebugPanel({ T, session, setSession, onExit }) {
  const { steps, idx, error, code } = session;
  const hasSteps = steps.length > 0;
  const step = hasSteps ? steps[idx] : null;
  const isFirst = idx === 0;
  const isLast = idx === steps.length - 1;
  const codeLines = code.split("\n");
  const outputSoFar = hasSteps ? steps.slice(0, idx + 1).flatMap((s) => s.logs) : [];

  function goToStep(delta) {
