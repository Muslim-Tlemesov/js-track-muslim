<script>
  // Простая замена window.storage (API из Claude.ai) на localStorage,
  // чтобы прогресс сохранялся между запусками в обычном браузере.
  window.storage = {
    async get(key) {
      try {
        const raw = localStorage.getItem("jstrack:" + key);
        if (raw === null) return null;
        return { key, value: raw, shared: false };
      } catch {
        return null;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem("jstrack:" + key, value);
        return { key, value, shared: false };
      } catch {
        return null;
      }
    },
    async delete(key) {
      try {
        localStorage.removeItem("jstrack:" + key);
        return { key, deleted: true, shared: false };
      } catch {
        return null;
      }
    },
    async list(prefix) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("jstrack:" + (prefix || ""))) keys.push(k.slice(8));
        }
        return { keys, prefix, shared: false };
      } catch {
        return null;
      }
    },
  };
</script>

];

// Простой детерминированный "случайный" порядок — стабилен в рамках сессии
// (не прыгает при каждом ре-рендере), но отличается при каждой перезагрузке —
// сделано намеренно, чтобы нельзя было запомнить "правильный вариант — второй"
// между визитами. Для реальных пользователей window.__JS_TRACK_SHUFFLE_SEED__
// никогда не установлен, так что поведение не меняется ни на йоту. Тестам это
// давало ровно ту нестабильность, с которой пришлось мириться весь этот
// разговор ("известная флакийность", зависящая от порядка перемешивания) —
// один явный переключатель для инъекции фиксированного сида решает это раз
// и навсегда, не трогая продакшен-логику.
function seededRandom(seedStr) {
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
  const sessionEntropy =
    typeof window !== "undefined" && window.__JS_TRACK_SHUFFLE_SEED__ !== undefined
      ? window.__JS_TRACK_SHUFFLE_SEED__
      : Date.now();
  seed = (seed ^ sessionEntropy) >>> 0;
  return () => {
    seed = (seed * 1103515245 + 12345) >>> 0;
    return (seed >>> 8) / 0x1000000;
  };
}

function shuffleValues(arr, seedStr) {
  const rand = seededRandom(seedStr);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleWithIndex(arr, seedStr) {
  const rand = seededRandom(seedStr);
  const a = arr.map((v, i) => ({ v, i }));
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Порядок вопросов внутри темы перемешан один раз за сессию —
// порядок самих тем (01, 02, 03...) остаётся по программе курса.
const SHUFFLED_TOPICS = TOPICS.map((t) => ({
  ...t,
  questions: shuffleValues(t.questions, t.id),
}));

// Плоский список ТОЛЬКО вопросов — используется для подсчёта прогресса
const ALL_QUESTIONS = TOPICS.flatMap((t) =>
  t.questions.map((q) => ({ ...q, topicId: t.id, topicTitle: t.title }))
);

// Быстрый поиск вопроса по id — нужен HistoryScreen для старого прогресса,
// отвеченного ещё до появления лога истории (там есть только id в answers,
// без тегов/темы, которые приходится подсматривать здесь).
const QUESTION_BY_ID = Object.fromEntries(ALL_QUESTIONS.map((q) => [q.id, q]));

// Плоский список для НАВИГАЦИИ — перед вопросами каждой темы вставлен экран теории
const NAV_ITEMS = SHUFFLED_TOPICS.flatMap((t) => [
  { type: "lesson", topicId: t.id, topicTitle: t.title, lesson: t.lesson },
  ...t.questions.map((q) => ({ ...q, topicId: t.id, topicTitle: t.title })),
]);

/**
 * Индекс, на который должно вести "Продолжить обучение" — первый
 * неотвеченный вопрос по всему курсу (не всегда NAV_ITEMS[0]!). Если
 * это первый вопрос ещё не начатой темы, возвращает индекс её экрана
 * теории, а не сразу вопроса — чтобы пользователь увидел объяснение
 * перед практикой, как и при обычном линейном прохождении.
 *
 * Раньше "Продолжить обучение" просто переключало mode на "learn",
 * оставляя currentIdx на дефолтных 0 — то есть буквально всегда вело
 * в самое начало курса, даже если первая тема уже пройдена целиком.
 *
 * @param {Array} navItems
 * @param {Object} answers
 * @param {Object} topicProgress
 */
function findResumeIndex(navItems, answers, topicProgress) {
  for (let i = 0; i < navItems.length; i++) {
    const item = navItems[i];
    if (item.type === "lesson") continue;
    if (!answers[item.id]) {
      const topicDone = topicProgress[item.topicId]?.done || 0;
      if (topicDone === 0) {
        const lessonIdx = navItems.findIndex((it) => it.type === "lesson" && it.topicId === item.topicId);
        return lessonIdx !== -1 ? lessonIdx : i;
      }
      return i;
    }
  }
  return 0; // всё отвечено — курс пройден, экран завершения покажется независимо от индекса
}

/** @type {{level: 1|2|3, emoji: string, label: string, color: string, genitive: string}[]} */

// topicId -> level, для быстрого поиска

// Иконка-эмодзи для карточки темы на экране "Итоги" — та же логика,

/** @typedef {Object} Achievement

/**
 * Русские формы множественного числа: 1 ответ / 2 ответа / 5 ответов.
 * @param {number} n
 * @param {string} one
 * @param {string} few
 * @param {string} many
 */
function pluralizeRu(n, one, few, many) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

/* ============================================================
   ВЫПОЛНЕНИЕ КОДА ПОЛЬЗОВАТЕЛЯ
   ============================================================ */

/**
 * Сравнивает фактический вывод console.log (result.logs) с ожидаемым
 * (current.expectedLogs) для code-вопросов. Обрезает пробелы по краям
 * КАЖДОЙ строки перед сравнением — иначе `console.log("Алматы ")` (один
 * лишний пробел в конце, невидимый глазу) засчитывался бы как неверный
 * ответ, хотя суть задания выполнена верно. Не обрезает пробелы ВНУТРИ
 * строки и не делает никакого нечёткого/регулярного сопоставления — это
 * учебный курс синтаксиса JS, и точный вывод (например, точка с запятой
 * внутри строки или регистр букв) как раз часть того, что проверяется;
 * смягчать это дальше означало бы поощрять неверное понимание.
 * @param {string[]} actualLogs
 * @param {string[]} expectedLogs
 * @returns {boolean}
 */
function logsMatch(actualLogs, expectedLogs) {
  const trimJoin = (arr) => (arr || []).map((l) => l.trim()).join("\n");
  return trimJoin(actualLogs) === trimJoin(expectedLogs);
}

function formatArg(a) {
  if (typeof a === "string") return a;
  try {
    return JSON.stringify(a);
  } catch {
    return String(a);
  }
}

const MAX_LOOP_ITERATIONS = 100000;

/**
 * Best-effort защита от случайных бесконечных циклов (typo вроде i--
 * вместо i++, забытое обновление счётчика). Оборачивает счётчиком
 * итераций только УСЛОВИЕ while(...) и C-style for(;;) — не тело
 * цикла. Тело сознательно не трогаем: искать его парную "}" надёжно
 * невозможно без полноценного парсера JS (произвольная вложенность
 * скобок), а ложное срабатывание там сломало бы синтаксически верный
 * код новичка — хуже, чем вообще не защищать.
 *
 * for...of / for...in не трогаются — они естественно ограничены
 * размером перебираемой коллекции.
 *
 * Строки, шаблонные литералы и комментарии пропускаются как непрозрачные
 * блоки, чтобы текст вида "while (x)" внутри строки не приняли за цикл.
 * Регулярные выражения (/.../ ) не разбираются отдельно — на коротких
 * учебных сниппетах этого разумного упрощения достаточно; при любой
 * неопределённости функция ничего не меняет, а не рискует сломать код.
 */
function injectLoopGuard(code) {
  try {
    return transformLoops(code);
  } catch {
    return code;
  }
}

function transformLoops(src) {
  let out = "";
  let i = 0;
  const n = src.length;

  while (i < n) {
    const ch = src[i];

    // строки/шаблонные литералы — копируем как есть, не заглядывая внутрь
    if (ch === "'" || ch === '"' || ch === "`") {
      const quote = ch;
      let j = i + 1;
      while (j < n) {
        if (src[j] === "\\") { j += 2; continue; }
        if (src[j] === quote) { j++; break; }
        j++;
      }
      out += src.slice(i, j);
      i = j;
      continue;
    }

    // однострочные и блочные комментарии — тоже не трогаем
    if (ch === "/" && src[i + 1] === "/") {
      let j = src.indexOf("\n", i);
      if (j === -1) j = n;
      out += src.slice(i, j);
      i = j;
      continue;
    }
    if (ch === "/" && src[i + 1] === "*") {
      let j = src.indexOf("*/", i + 2);
      j = j === -1 ? n : j + 2;
      out += src.slice(i, j);
      i = j;
      continue;
    }

    const rest = src.slice(i);
    const whileMatch = /^while\s*\(/.exec(rest);
    const forMatch = !whileMatch && /^for\s*\(/.exec(rest);
    const isWordBefore = i > 0 && /[A-Za-z0-9_$]/.test(src[i - 1]);

    if ((whileMatch || forMatch) && !isWordBefore) {
      const kw = whileMatch ? "while" : "for";
      const openParenIdx = src.indexOf("(", i + kw.length);
      const closeParenIdx = findMatchingParen(src, openParenIdx);
      if (closeParenIdx === -1) {
        // не нашли парную скобку (не должно случаться на валидном JS,
        // но на всякий случай не рискуем) — копируем ключевое слово как есть
        out += kw;
        i += kw.length;
        continue;
      }
      const header = src.slice(openParenIdx + 1, closeParenIdx);
      const newHeader = kw === "while" ? guardCondition(header) : guardForHeader(header);
      out += kw + "(" + newHeader + ")";
      i = closeParenIdx + 1;
      continue;
    }

    out += ch;
    i++;
  }

  return out;
}

function findMatchingParen(src, openIdx) {
  let depth = 0;
  for (let k = openIdx; k < src.length; k++) {
    const c = src[k];
    if (c === "'" || c === '"' || c === "`") {
      const quote = c;
      k++;
      while (k < src.length) {
        if (src[k] === "\\") { k += 2; continue; }
        if (src[k] === quote) break;
        k++;
      }
      continue;
    }
    if (c === "(") depth++;
    else if (c === ")") {
      depth--;
      if (depth === 0) return k;
    }
  }
  return -1;
}

function guardCondition(cond) {
  const trimmed = cond.trim();
  if (trimmed === "") return "__jsTrackLoopGuard()";
  return `__jsTrackLoopGuard() && (${cond})`;
}

// разбивает заголовок C-style for на 3 части по верхнеуровневым ';'
// (не внутри скобок/строк) — если частей не 3, это for...of/for...in
// или что-то нестандартное, и мы его не трогаем
function guardForHeader(header) {
  const parts = splitTopLevel(header, ";");
  if (parts.length !== 3) return header;
  const [init, cond, update] = parts;
  return `${init};${guardCondition(cond)};${update}`;
}

function splitTopLevel(str, sep) {
  const parts = [];
  let depth = 0;
  let start = 0;
  for (let k = 0; k < str.length; k++) {
    const c = str[k];
    if (c === "'" || c === '"' || c === "`") {
      const quote = c;
      k++;
      while (k < str.length) {
        if (str[k] === "\\") { k += 2; continue; }
        if (str[k] === quote) break;
        k++;
      }
      continue;
    }
    if (c === "(" || c === "[" || c === "{") depth++;
    else if (c === ")" || c === "]" || c === "}") depth--;
    else if (c === sep && depth === 0) {
      parts.push(str.slice(start, k));
      start = k + 1;
    }
  }
  parts.push(str.slice(start));
  return parts;
}

/**
 * Реально выполняет JS-код пользователя (через new Function) и
 * перехватывает вызовы console.log. extraArgs позволяет передать
 * в код именованные «живые» объекты (button/card/title/el) для
 * DOM-песочницы. Перед выполнением код проходит через injectLoopGuard —
 * best-effort защиту от случайных бесконечных циклов (см. комментарий выше).
 *
 * @param {string} code
 * @param {Object<string, any>} [extraArgs]
 * @returns {{logs: string[], error: string|null}}
 */
/**
 * Синхронная реализация — используется ТОЛЬКО когда в extraArgs есть
 * «живые» объекты (DOM-подобные button/card/title/el для liveKind-
 * вопросов, или display/startBtn в Мини-проекте): Worker не имеет
 * доступа к DOM и не может держать такие объекты — их нельзя передать
 * через postMessage (structured clone не поддерживает DOM-узлы и
 * объекты с геттерами/сеттерами, завязанными на React state).
 */
function runUserCodeSync(code, extraArgs = {}) {
  const logs = [];
  const fakeConsole = {
    log: (...args) => logs.push(args.map(formatArg).join(" ")),
  };
  const guardPrelude =
    `let __jsTrackLoopCount = 0;\n` +
    `function __jsTrackLoopGuard() {\n` +
    `  if (++__jsTrackLoopCount > ${MAX_LOOP_ITERATIONS}) {\n` +
    `    throw new Error('Слишком много итераций — похоже на бесконечный цикл. Проверь условие выхода.');\n` +
    `  }\n` +
    `  return true;\n` +
    `}\n`;
  const guardedCode = guardPrelude + injectLoopGuard(code);
  // Те же опасные глобальные имена, что и в воркере (см. подробный
  // комментарий в buildWorkerSource), затенены и здесь — этот путь
  // выполняется на ГЛАВНОМ потоке для liveKind DOM-вопросов, так что
  // случайный fetch/postMessage/close тут потенциально даже заметнее
  // (реальная вкладка, а не изолированный воркер), хотя ни одно
  // упражнение курса не рассчитывает на доступ к этим именам.
  const dangerousNames = ["postMessage", "fetch", "XMLHttpRequest", "importScripts", "close", "WebSocket"];
  const argNames = ["console", ...dangerousNames, ...Object.keys(extraArgs)];
  const argValues = [fakeConsole, ...dangerousNames.map(() => undefined), ...Object.values(extraArgs)];
  try {
    // eslint-disable-next-line no-new-func
    const fn = new Function(...argNames, guardedCode);
    fn(...argValues);
    return { logs, error: null };
  } catch (e) {
    return { logs, error: e.message };
  }
}

/* ============================================================
   ВЫПОЛНЕНИЕ КОДА В WEB WORKER
   ============================================================
   Раньше весь код пользователя (включая случайный `while (true) {}`)
   выполнялся синхронно на главном потоке — единственной защитой был
   best-effort счётчик итераций (injectLoopGuard), который всё равно
   блокирует UI до срабатывания, а если инструментация не распознала
   какую-то конструкцию цикла — зависает насовсем, без единого способа
   прервать выполнение (JS-поток нельзя прервать снаружи).

   Web Worker решает обе проблемы: выполнение идёт в отдельном потоке
   (UI не блокируется вообще), и его в любой момент можно принудительно
   остановить через worker.terminate() — настоящий "выключатель", а не
   просто счётчик, надеющийся поймать цикл вовремя.

   Ограничение: Worker не видит DOM и не может получить объекты с
   геттерами/сеттерами, завязанными на React state (structured clone
   их не пропустит) — поэтому используется ТОЛЬКО когда extraArgs
   пустой. Все 4 liveKind DOM-вопроса и Мини-проект (там тоже передаются
   псевдо-DOM объекты) по-прежнему выполняются синхронно на главном
   потоке через runUserCodeSync — это небольшой курируемый набор
   заданий, а не произвольный код, так что риск там ниже.
   ============================================================ */

const WORKER_EXECUTION_TIMEOUT_MS = 4000; // если Worker не ответил за это время — считаем зависшим и прерываем

// Текст воркера собирается из строковых представлений уже существующих
// чистых функций (.toString()) — они не трогают DOM/window, поэтому
// один в один переносятся в изолированный контекст воркера без
// дублирования логики вручную.
function buildWorkerSource() {
  return `
${formatArg.toString()}
${injectLoopGuard.toString()}
${transformLoops.toString()}
${findMatchingParen.toString()}
${guardCondition.toString()}
${guardForHeader.toString()}
${splitTopLevel.toString()}
const MAX_LOOP_ITERATIONS = ${MAX_LOOP_ITERATIONS};

self.onmessage = function (e) {
  const code = e.data.code;
  const logs = [];
  const fakeConsole = {
    log: function () {
      const args = Array.prototype.slice.call(arguments);
      logs.push(args.map(formatArg).join(" "));
    },
  };
  const guardPrelude =
    "let __jsTrackLoopCount = 0;\\n" +
    "function __jsTrackLoopGuard() {\\n" +
    "  if (++__jsTrackLoopCount > " + MAX_LOOP_ITERATIONS + ") {\\n" +
    "    throw new Error('Слишком много итераций — похоже на бесконечный цикл. Проверь условие выхода.');\\n" +
    "  }\\n" +
    "  return true;\\n" +
    "}\\n";
  const guardedCode = guardPrelude + injectLoopGuard(code);
  try {
    // Затеняем опасные глобальные имена воркера как undefined-параметры:
    // new Function(...) выполняет тело в ГЛОБАЛЬНОЙ области видимости
    // воркера (не в замыкании этого onmessage), так что код пользователя
    // технически мог бы напрямую обратиться к self.postMessage (подделать
    // наш собственный результат раньше, чем реальный код доработает),
    // fetch/XMLHttpRequest (сетевые запросы из воркера — здесь никаких
    // легитимных сценариев для этого нет, это песочница синтаксиса JS,
    // а не курс по сети), importScripts (загрузка стороннего кода) или
    // close() (сам себя убить). Параметры с этими именами перекрывают
    // одноимённые глобальные переменные ТОЛЬКО внутри тела этой функции —
    // сам воркер продолжает пользоваться ими как обычно (self.postMessage
    // ниже в этом же файле не затронут, это отдельная область видимости).
    const fn = new Function(
      "console", "postMessage", "self", "fetch", "XMLHttpRequest", "importScripts", "close", "WebSocket",
      guardedCode
    );
    fn(fakeConsole);
    // Та же самая пауза перед фиксацией результата, что и в синхронном
    // пути (см. подробный комментарий у ASYNC_FLUSH_DELAY_MS в
    // runUserCode) — иначе console.log внутри async/await-кода после
    // await никогда бы не попал в logs, отправленные обратно.
    setTimeout(() => {
      self.postMessage({ logs: logs, error: null });
    }, ${ASYNC_FLUSH_DELAY_MS});
  } catch (err) {
    self.postMessage({ logs: logs, error: err.message });
  }
};
`;
}

let workerSourceUrl = null;
function getWorkerSourceUrl() {
  if (!workerSourceUrl) {
    const blob = new Blob([buildWorkerSource()], { type: "application/javascript" });
    workerSourceUrl = URL.createObjectURL(blob);
  }
  return workerSourceUrl;
}

// Ссылка на активный воркер — нужна, чтобы явно прервать ПРЕДЫДУЩЕЕ
// выполнение, если пользователь запускает код повторно до того, как
// предыдущий запуск успел ответить (быстрый повторный клик "Выполнить").
let activeCodeWorker = null;

function terminateActiveCodeWorker() {
  if (activeCodeWorker) {
    activeCodeWorker.terminate();
    activeCodeWorker = null;
  }
}

/**
 * Выполняет код в Web Worker и возвращает Promise<{logs, error}> — тот
 * же формат результата, что и у runUserCodeSync, так что вызывающему
 * коду не важно, каким путём код на самом деле выполнился.
 */
function runUserCodeInWorker(code) {
  return new Promise((resolve) => {
    terminateActiveCodeWorker();
    let worker;
    try {
      worker = new Worker(getWorkerSourceUrl());
    } catch {
      // Worker не удалось создать (очень старый браузер, ограничения
      // окружения) — откатываемся на синхронное выполнение, а не
      // проваливаем весь запуск.
      resolve(runUserCodeSync(code));
      return;
    }
    activeCodeWorker = worker;

    const timeoutId = setTimeout(() => {
      worker.terminate();
      if (activeCodeWorker === worker) activeCodeWorker = null;
      resolve({ logs: [], error: "Код выполняется слишком долго — похоже на бесконечный цикл. Выполнение прервано." });
    }, WORKER_EXECUTION_TIMEOUT_MS);

    worker.onmessage = (e) => {
      clearTimeout(timeoutId);
      worker.terminate();
      if (activeCodeWorker === worker) activeCodeWorker = null;
      resolve(e.data);
    };

    worker.onerror = (err) => {
      clearTimeout(timeoutId);
      worker.terminate();
      if (activeCodeWorker === worker) activeCodeWorker = null;
      resolve({ logs: [], error: err.message || "Ошибка выполнения кода." });
    };

    worker.postMessage({ code });
  });
}

/**
 * Реально выполняет JS-код пользователя и перехватывает вызовы
 * console.log. extraArgs позволяет передать в код именованные «живые»
 * объекты (button/card/title/el для DOM-песочницы, display/startBtn
 * для Мини-проекта) — если он непустой, выполнение идёт синхронно на
 * главном потоке (см. runUserCodeSync), потому что такие объекты
 * нельзя передать в Worker. Если extraArgs пустой (обычные code-
 * вопросы, свободная «Консоль», экзамен) — выполнение уходит в Worker,
 * не блокируя UI и с возможностью принудительно прервать зависший код.
 *
 * ВСЕГДА возвращает Promise<{logs, error}> — единообразно для обоих
 * путей, чтобы вызывающему коду не нужно было знать, как именно код
 * выполнился на этот раз.
 *
 * КРИТИЧНО: после синхронного выполнения ждём короткую паузу, чтобы
 * дать шанс отработать простым async/await-цепочкам (например,
 * `async function f() { const x = await Promise.resolve(1); console.log(x); }`)
 * ДО того, как результат будет зафиксирован. new Function(...) выполняется
 * синхронно, а тело после await — это микрозадача, которая планируется
 * выполниться ПОСЛЕ синхронного вызова, а не во время него. Без этой
 * паузы console.log внутри такой функции никогда бы не попал в logs —
 * баг, который был найден именно на эталонном решении вопроса async-3
 * (там ровно такой паттерн: async function + await Promise.resolve(...)).
 * `logs` — тот же самый массив (по ссылке), что был передан в
 * fakeConsole внутри runUserCodeSync/воркера, так что дозаписи в него
 * ПОСЛЕ синхронного возврата, но ДО этой паузы, будут отражены здесь же.
 *
 * @param {string} code
 * @param {Object<string, any>} [extraArgs]
 * @returns {Promise<{logs: string[], error: string|null}>}
 */
const ASYNC_FLUSH_DELAY_MS = 60;

async function runUserCode(code, extraArgs = {}) {
  const hasLiveObjects = Object.keys(extraArgs).length > 0;
  if (hasLiveObjects || typeof Worker === "undefined") {
    const result = runUserCodeSync(code, extraArgs);
    await new Promise((resolve) => setTimeout(resolve, ASYNC_FLUSH_DELAY_MS));
    return result;
  }
  return runUserCodeInWorker(code);
}

/* ============================================================
   ПОШАГОВЫЙ ОТЛАДЧИК — «инструментация + повтор»
   ============================================================
   В браузере нет способа честно поставить обычный синхронный код
   на паузу после каждой строки (это умеют только generators/async
   или настоящий debugger protocol, которых здесь нет). Вместо этого
   используется приём «инструментация + повтор»:
     1. Код пользователя один раз ПОЛНОСТЬЮ разбирается на верхнеуровневые
        операторы (сюда же рекурсивно входят тела if/for/while/do —
        это НЕ полноценный JS-парсер, а компактный посимвольный разбор,
        похожий по духу на injectLoopGuard выше, только делает больше).
     2. После каждого оператора вставляется вызов __dbgSnap(line, {a, b, ...}),
        где {a, b} — это буквально объект с сокращённой записью свойств:
        он вычисляется в момент вызова и подхватывает ТЕКУЩИЕ значения
        переменных, известных в этой точке. Никакой «рефлексии» не нужно —
        имена переменных для каждой точки уже известны на этапе разбора.
     3. Инструментированный код выполняется одним махом через new Function,
        как и обычный запуск, — а __dbgSnap на каждом вызове складывает
        снимок в массив. Дальше пользователь просто листает уже готовый
        массив снимков кнопками «Назад/Далее» — это и создаёт ощущение
        настоящей построчной отладки.

   Сознательные упрощения (документируем явно, а не прячем):
   - Внутрь тел function/try/switch/class мы НЕ заходим — вызов функции
     считается одним атомарным шагом (без стека вызовов). Для этого же
     нужен был бы полноценный трекинг фреймов вызова — оверкил для
     учебных примеров, где обычно интересен именно линейный поток.
   - Деструктурирующие объявления (let {a, b} = obj) не поддерживаются —
     учитывается только простое `let/const/var name = ...`.
   - `var` для простоты считается видимым только внутри блока, где он
     объявлен (как let/const) — с точки зрения области видимости это
     чуть отличается от настоящего JS (var поднимается до функции), но
     в учебных примерах это почти никогда не имеет значения.
   - Ограничение MAX_DEBUG_STEPS защищает от зависания браузера на
     случайном бесконечном цикле — ровно та же идея, что и
     MAX_LOOP_ITERATIONS у обычного запуска.
   ============================================================ */

function isIdentStart(ch) { return /[a-zA-Z_$]/.test(ch); }
function isIdentPart(ch) { return /[a-zA-Z0-9_$]/.test(ch); }

function readIdentifierAt(src, i) {
  if (i >= src.length || !isIdentStart(src[i])) return null;
  let j = i + 1;
  while (j < src.length && isIdentPart(src[j])) j++;
  return { word: src.slice(i, j), end: j };
}

function skipTrivia(src, i) {
  const n = src.length;
  while (i < n) {
    const ch = src[i];
    if (ch === " " || ch === "\t" || ch === "\n" || ch === "\r") { i++; continue; }
    if (ch === "/" && src[i + 1] === "/") { let j = src.indexOf("\n", i); i = j === -1 ? n : j; continue; }
    if (ch === "/" && src[i + 1] === "*") { let j = src.indexOf("*/", i + 2); i = j === -1 ? n : j + 2; continue; }
    break;
  }
  return i;
}

// Находит индекс символа, парного открывающему на openIdx ('(' / '{' / '['),
// пропуская строки/шаблонные литералы/комментарии как непрозрачные блоки —
// тот же приём, что и в transformLoops выше.
function matchBracket(src, openIdx) {
  const open = src[openIdx];
  const close = open === "(" ? ")" : open === "{" ? "}" : "]";
  let depth = 0;
  let i = openIdx;
  const n = src.length;
  while (i < n) {
    const ch = src[i];
    if (ch === "'" || ch === '"' || ch === "`") {
      const quote = ch;
      i++;
      while (i < n) {
        if (src[i] === "\\") { i += 2; continue; }
        if (src[i] === quote) { i++; break; }
        i++;
      }
      continue;
    }
    if (ch === "/" && src[i + 1] === "/") { let j = src.indexOf("\n", i); i = j === -1 ? n : j; continue; }
    if (ch === "/" && src[i + 1] === "*") { let j = src.indexOf("*/", i + 2); i = j === -1 ? n : j + 2; continue; }
    if (ch === open) { depth++; i++; continue; }
    if (ch === close) { depth--; i++; if (depth === 0) return i - 1; continue; }
    i++;
  }
  return n - 1;
}

function splitTopLevelCommas(str) {
  const parts = [];
  let depth = 0, start = 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === "'" || ch === '"' || ch === "`") {
      const quote = ch; i++;
      while (i < str.length) {
        if (str[i] === "\\") { i += 2; continue; }
        if (str[i] === quote) break;
        i++;
      }
      continue;
    }
    if (ch === "(" || ch === "[" || ch === "{") depth++;
    else if (ch === ")" || ch === "]" || ch === "}") depth--;
    else if (ch === "," && depth === 0) { parts.push(str.slice(start, i)); start = i + 1; }
  }
  parts.push(str.slice(start));
  return parts;
}

function extractDeclaredNames(raw) {
  const m = /^\s*(let|const|var)\s+/.exec(raw);
  if (!m) return [];
  const rest = raw.slice(m[0].length);
  const parts = splitTopLevelCommas(rest);
  const names = [];
  parts.forEach((p) => {
    // деструктуризация ({a,b}/[a,b]) сознательно не поддерживается —
    // см. пояснение в комментарии к разделу выше.
    const nm = /^\s*([a-zA-Z_$][\w$]*)/.exec(p);
    if (nm) names.push(nm[1]);
  });
  return names;
}

function extractTopLevelDeclaredName(raw) {
  const m = /^\s*function\s*\*?\s+([a-zA-Z_$][\w$]*)/.exec(raw);
  return m ? m[1] : null;
}

function extractForLoopVarNames(headerSrc) {
  const inner = headerSrc.slice(1, -1);
  const m = /^\s*(let|const|var)\s+([a-zA-Z_$][\w$]*)/.exec(inner);
  return m ? [m[2]] : [];
}

function parseSimpleStatement(src, from, to) {
  let i = from;
  let depth = 0;
  while (i < to) {
    const ch = src[i];
    if (ch === "'" || ch === '"' || ch === "`") {
      const quote = ch; i++;
      while (i < to) {
        if (src[i] === "\\") { i += 2; continue; }
        if (src[i] === quote) { i++; break; }
        i++;
      }
      continue;
    }
    if (ch === "/" && src[i + 1] === "/") { let j = src.indexOf("\n", i); i = (j === -1 || j > to) ? to : j; continue; }
    if (ch === "/" && src[i + 1] === "*") { let j = src.indexOf("*/", i + 2); i = (j === -1 || j > to) ? to : j + 2; continue; }
    if (ch === "(" || ch === "[" || ch === "{") { depth++; i++; continue; }
    if (ch === ")" || ch === "]" || ch === "}") { depth--; i++; continue; }
    if (ch === ";" && depth <= 0) { i++; break; }
    i++;
  }
  return { kind: "simple", start: from, end: i, raw: src.slice(from, i) };
}

// function/try/switch/class целиком — не заходим внутрь (см. пояснение выше).
function parseAtomicBlockStatement(src, from, to) {
  let j = from;
  let depth = 0;
  while (j < to) {
    const ch = src[j];
    if (ch === "'" || ch === '"' || ch === "`") {
      const quote = ch; j++;
      while (j < to) {
        if (src[j] === "\\") { j += 2; continue; }
        if (src[j] === quote) { j++; break; }
        j++;
      }
      continue;
    }
    if (ch === "(" || ch === "[") { depth++; j++; continue; }
    if (ch === ")" || ch === "]") { depth--; j++; continue; }
    if (ch === "{" && depth === 0) break;
    j++;
  }
  if (j >= to) return { kind: "atomic", start: from, end: to, raw: src.slice(from, to) };
  const close = matchBracket(src, j);
  const end = close + 1;
  return { kind: "atomic", start: from, end, raw: src.slice(from, end) };
}

function parseBlockOrSingle(src, i, to) {
  i = skipTrivia(src, i);
  if (src[i] === "{") {
    const close = matchBracket(src, i);
    return { braced: true, innerStart: i + 1, innerEnd: close, end: close + 1 };
  }
  const node = parseOneStatement(src, i, to);
  return { braced: false, single: node, end: node.end };
}

function parseIfChain(src, i, to) {
  const start = i;
  i += 2; // 'if'
  i = skipTrivia(src, i);
  const condOpen = i;
  const condClose = matchBracket(src, condOpen);
  const cond = { start: condOpen, end: condClose + 1 };
  const thenBody = parseBlockOrSingle(src, condClose + 1, to);
  let end = thenBody.end;
  let elseBody = null;
  let j = skipTrivia(src, end);
  const elseId = readIdentifierAt(src, j);
  if (elseId && elseId.word === "else") {
    let k = skipTrivia(src, elseId.end);
    const ifId = readIdentifierAt(src, k);
    if (ifId && ifId.word === "if") {
      const nested = parseIfChain(src, k, to);
      elseBody = { kind: "if-node", node: nested };
      end = nested.end;
    } else {
      const blk = parseBlockOrSingle(src, k, to);
      elseBody = { kind: "block-or-single", value: blk };
      end = blk.end;
    }
  }
  return { kind: "if", start, end, cond, thenBody, elseBody };
}

function parseLoopHeaderAndBody(src, i, to, keyword) {
  const start = i;
  i += keyword.length;
  i = skipTrivia(src, i);
  const parenOpen = i;
  const parenClose = matchBracket(src, parenOpen);
  const header = { start: parenOpen, end: parenClose + 1 };
  const body = parseBlockOrSingle(src, parenClose + 1, to);
  return { kind: "loop", keyword, start, end: body.end, header, body };
}

function parseDoWhile(src, i, to) {
  const start = i;
  i += 2; // 'do'
  const body = parseBlockOrSingle(src, i, to);
  let j = skipTrivia(src, body.end);
  const whileId = readIdentifierAt(src, j);
  let end = body.end;
  let header = null;
  if (whileId && whileId.word === "while") {
    let k = skipTrivia(src, whileId.end);
    const parenClose = matchBracket(src, k);
    header = { start: k, end: parenClose + 1 };
    end = parenClose + 1;
    let m = skipTrivia(src, end);
    if (src[m] === ";") end = m + 1;
  }
  return { kind: "dowhile", start, end, header, body };
}

function parseOneStatement(src, i, to) {
  i = skipTrivia(src, i);
  const id = readIdentifierAt(src, i);
  const word = id ? id.word : null;
  if (word === "if") return parseIfChain(src, i, to);
  if (word === "for" || word === "while") return parseLoopHeaderAndBody(src, i, to, word);
  if (word === "do") return parseDoWhile(src, i, to);
  if (word === "function" || word === "try" || word === "switch" || word === "class") {
    return parseAtomicBlockStatement(src, i, to);
  }
  return parseSimpleStatement(src, i, to);
}

function parseStatements(src, from, to) {
  const stmts = [];
  let i = skipTrivia(src, from);
  while (i < to) {
    const node = parseOneStatement(src, i, to);
    stmts.push(node);
    const next = skipTrivia(src, node.end);
    if (next <= i) break; // защита от зависания при неожиданном вводе
    i = next;
  }
  return stmts;
}

function lineOf(src, pos) {
  let line = 0;
  for (let k = 0; k < pos && k < src.length; k++) if (src[k] === "\n") line++;
  return line;
}

// {a, b} — сокращённая запись свойств объекта: значения a и b подставятся
// из текущей области видимости в момент вызова __dbgSnap, никакой
// дополнительной «рефлексии» переменных не требуется.
function makeSnapshotCall(src, pos, vars) {
  const line = lineOf(src, pos);
  const obj = vars.length === 0 ? "{}" : `{${vars.join(", ")}}`;
  return `\n__dbgSnap(${line}, ${obj});\n`;
}

function emitStatements(src, stmts, knownVars, out) {
  let vars = knownVars.slice();
  for (const node of stmts) {
    if (node.kind === "simple") {
      out.push(node.raw);
      extractDeclaredNames(node.raw).forEach((n) => { if (!vars.includes(n)) vars.push(n); });
      out.push(makeSnapshotCall(src, node.end, vars));
    } else if (node.kind === "atomic") {
      out.push(node.raw);
      const nm = extractTopLevelDeclaredName(node.raw);
      if (nm && !vars.includes(nm)) vars.push(nm);
      out.push(makeSnapshotCall(src, node.end, vars));
    } else if (node.kind === "if") {
      out.push(src.slice(node.start, node.cond.end));
      emitBranchBody(src, node.thenBody, vars, out);
      if (node.elseBody) {
        out.push(" else ");
        if (node.elseBody.kind === "if-node") {
          emitStatements(src, [node.elseBody.node], vars, out);
        } else {
          emitBranchBody(src, node.elseBody.value, vars, out);
        }
      }
    } else if (node.kind === "loop") {
      out.push(src.slice(node.start, node.header.end));
      const loopVars = extractForLoopVarNames(src.slice(node.header.start, node.header.end));
      const bodyVars = vars.concat(loopVars.filter((v) => !vars.includes(v)));
      emitBranchBody(src, node.body, bodyVars, out);
    } else if (node.kind === "dowhile") {
      out.push("do ");
      emitBranchBody(src, node.body, vars, out);
      if (node.header) {
        out.push(" while " + src.slice(node.header.start, node.header.end) + ";");
      }
    }
  }
}

// Тело блока инструментируется своей копией списка известных переменных
// (vars.slice() у вызывающей emitStatements) — поэтому let/const, объявленные
// внутри if/for/while, естественным образом не «протекают» в снимки ПОСЛЕ
// выхода из блока, как и в настоящем JS.
function emitBranchBody(src, body, vars, out) {
  if (body.braced) {
    out.push("{\n");
    const inner = parseStatements(src, body.innerStart, body.innerEnd);
    emitStatements(src, inner, vars, out);
    out.push("}\n");
  } else {
    out.push("{\n");
    emitStatements(src, [body.single], vars, out);
    out.push("}\n");
  }
}

const MAX_DEBUG_STEPS = 500;

function instrumentForDebugger(code) {
  const stmts = parseStatements(code, 0, code.length);
  const out = [];
  emitStatements(code, stmts, [], out);
  return out.join("");
}

/**
 * Выполняет код пользователя в пошаговом режиме и возвращает список
 * «снимков»: { line, vars, logs } — номер строки исходника, значения
 * переменных сразу после её выполнения и console.log, вызванные именно
 * в этой строке. UI затем просто листает готовый массив шагов.
 *
 * @param {string} code
 * @returns {{steps: Array<{line:number, vars:Object, logs:string[]}>, error: string|null}}
 */
function runUserCodeStepByStep(code) {
  const steps = [];
  let pendingLogs = [];
  const fakeConsole = {
    log: (...args) => pendingLogs.push(args.map(formatArg).join(" ")),
  };
  function __dbgSnap(line, vars) {
    if (steps.length >= MAX_DEBUG_STEPS) {
      throw new Error("Слишком много шагов — похоже на бесконечный цикл. Проверь условие выхода.");
    }
    steps.push({ line, vars, logs: pendingLogs });
    pendingLogs = [];
  }
  let instrumented;
  try {
    instrumented = instrumentForDebugger(code);
  } catch (e) {
    return { steps: [], error: "Не получилось разобрать код для пошагового режима: " + e.message };
  }
  try {
    // eslint-disable-next-line no-new-func
    const fn = new Function("console", "__dbgSnap", instrumented);
    fn(fakeConsole, __dbgSnap);
    if (pendingLogs.length) {
      steps.push({ line: steps.length ? steps[steps.length - 1].line : null, vars: steps.length ? steps[steps.length - 1].vars : {}, logs: pendingLogs });
    }
    return { steps, error: null };
  } catch (e) {
    return { steps, error: e.message };
  }
}

/**
 * Форматирует значение переменной для отображения в панели отладчика:
 * строки — в кавычках, функции — как ƒ (), остальное — через JSON.stringify.
 * @param {*} v
 */
function formatDebugValue(v) {
  if (typeof v === "function") return "ƒ ()";
  if (typeof v === "string") return `"${v}"`;
  if (v === undefined) return "undefined";
  try {
    const s = JSON.stringify(v);
    return s === undefined ? String(v) : s;
  } catch {
    return String(v);
  }
}

const JS_KEYWORDS =
  "const|let|var|function|return|if|else|for|while|of|in|class|extends|new|this|async|await|true|false|null|undefined|typeof|try|catch|throw|import|export|default|super|break|continue";


function escapeHtml(s) {
  // Экранируем только &, < и > — этого достаточно для безопасности
  // именно в текущем использовании: подсвеченный код всегда попадает в
  // текстовое содержимое <span>...</span>, а не в значение атрибута
  // (единственный атрибут здесь — style="color:${T.цвет}", подставляется
  // цвет темы, а не код пользователя), а < и > — ровно те символы,
  // которыми можно вырваться из текстового узла и создать новый тег.
  //
  // Кавычки НАРОЧНО не экранируются — подсветка строковых литералов
  // (highlightJs ниже) ищет буквальные ' " ` в уже экранированной
  // строке; экранирование кавычек здесь ломает эту подсветку целиком
  // (проверено на практике при попытке добавить это "для полноты").
  //
  // ВАЖНО ПРИ ПЕРЕИСПОЛЬЗОВАНИИ: если эту функцию когда-нибудь
  // используют для вставки текста в значение HTML-атрибута (например
  // title="..."), кавычки экранировать обязательно — здесь этого не
  // сделано осознанно и только потому, что подсвеченный код никогда не
  // становится значением атрибута.
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/**
 * Лёгкая подсветка синтаксиса JS без внешних библиотек:
 * оборачивает комментарии/строки/ключевые слова/числа в <span>.
 *
 * @param {string} code
 * @param {ThemeTokens} T
 * @returns {string} HTML-строка для dangerouslySetInnerHTML
 */
/**
 * Живая проверка синтаксиса — использует window.Babel (уже загружен
 * через <script> для трансформации JSX самого приложения, отдельная
 * библиотека не нужна). presets: [] — нужен только парсинг + генерация
 * без каких-либо трансформаций, этого достаточно, чтобы Babel выбросил
 * SyntaxError на невалидном JS. Возвращает null для валидного кода или
 * пустой строки — подсказку незачем показывать, пока никто не начал
 * печатать.
 *
 * Сообщение Babel обычно выглядит так:
 *   "unknown: Unexpected token (1:10)\n\n> 1 | const x = ;\n    | ^\n"
 * — обрезаем до первой строки и убираем префикс/координаты (сам номер
 * строки уже показываем отдельно через loc.line).
 *
 * @param {string} code
 * @returns {{line: number, message: string}|null}
 */
function checkSyntaxError(code) {
  if (!code || !code.trim()) return null;
  if (typeof window === "undefined" || !window.Babel) return null;
  try {
    window.Babel.transform(code, { presets: [] });
    return null;
  } catch (e) {
    if (!e.loc) return null; // не синтаксическая ошибка Babel — не наш случай, молчим
    const firstLine = String(e.message).split("\n")[0];
    const message = firstLine.replace(/^unknown:\s*/, "").replace(/\s*\(\d+:\d+\)\s*$/, "");
    return { line: e.loc.line, message };
  }
}

function highlightJs(code, T) {
  const escaped = escapeHtml(code);
  const pattern = new RegExp(
    "(//.*$)|(`(?:\\\\.|[^`\\\\])*`|'(?:\\\\.|[^'\\\\])*'|\"(?:\\\\.|[^\"\\\\])*\")|(\\b(?:" +
      JS_KEYWORDS +
      ")\\b)|(\\b\\d+(?:\\.\\d+)?\\b)",
    "gm"
  );
  return escaped.replace(pattern, (match, comment, str, kw, num) => {
    if (comment) return `<span style="color:${T.textDim}">${comment}</span>`;
    if (str) return `<span style="color:${T.success}">${str}</span>`;
    if (kw) return `<span style="color:${T.accent}; font-weight:600">${kw}</span>`;
    if (num) return `<span style="color:${T.accent2}">${num}</span>`;
    return match;
  });
}

/* ============================================================
   ПЕРЕИСПОЛЬЗУЕМЫЙ РЕДАКТОР КОДА — номера строк + автодополнение
   ============================================================
   Один общий компонент вместо четырёх независимых копий textarea+pre
   (в вопросах с кодом, мини-проекте, песочнице и экзамене) — чтобы
   номера строк и автодополнение появились везде одинаково, а не
   в одном месте случайно, в другом забыто.

   Автодополнение построено с нуля на голом textarea (у него нет
   браузерного API для этого): позиция курсора в пикселях считается
   не через тяжёлый DOM-миррор, а арифметически — раз шрифт
   моноширинный (JetBrains Mono), ширина одного символа постоянна и
   меряется один раз через canvas.measureText и кэшируется. Строка
   курсора и колонка — просто подсчёт '\n' и длины хвоста до курсора.
   Это заметно дешевле и надёжнее, чем клонировать DOM на каждое
   нажатие клавиши, и для моноширинного шрифта даёт точный результат.
   ============================================================ */

const JS_AUTOCOMPLETE_WORDS = Array.from(new Set([
  // ключевые слова
  "let", "const", "var", "function", "return", "if", "else", "for", "while", "of", "in",
  "class", "extends", "new", "this", "async", "await", "true", "false", "null", "undefined",
  "typeof", "try", "catch", "finally", "throw", "break", "continue", "switch", "case", "default",
  "do", "delete", "static", "get", "set", "super", "import", "export", "instanceof", "void", "yield",
  // консоль
  "console.log", "console.error", "console.warn", "console.table",
  // массивы
  "map", "filter", "reduce", "forEach", "find", "findIndex", "includes", "indexOf", "slice",
  "splice", "push", "pop", "shift", "unshift", "join", "split", "concat", "sort", "reverse",
  "flat", "flatMap", "some", "every", "fill", "Array.from", "Array.isArray",
  // объекты
  "keys", "values", "entries", "Object.keys", "Object.values", "Object.entries", "Object.assign",
  "Object.freeze", "hasOwnProperty",
  // строки
  "toUpperCase", "toLowerCase", "trim", "padStart", "padEnd", "replace", "replaceAll",
  "startsWith", "endsWith", "repeat", "charAt", "toString", "length",
  // промисы / async
  "then", "catch", "finally", "Promise", "Promise.resolve", "Promise.reject", "Promise.all",
  "Promise.race", "fetch",
  // таймеры
  "setTimeout", "setInterval", "clearTimeout", "clearInterval",
  // DOM
  "querySelector", "querySelectorAll", "getElementById", "addEventListener", "removeEventListener",
  "classList", "textContent", "innerHTML", "createElement", "appendChild", "remove", "dataset", "style",
  // числа / математика
  "Math.random", "Math.floor", "Math.ceil", "Math.round", "Math.max", "Math.min", "Math.abs",
  "Math.pow", "Math.sqrt", "parseInt", "parseFloat", "isNaN", "toFixed",
  // глобальные конструкторы
  "Array", "Object", "String", "Number", "Boolean", "Map", "Set", "JSON", "Date",
  "JSON.stringify", "JSON.parse",
]));

const __monoCharWidthCache = {};
function getMonoCharWidth(fontSizePx) {
  if (__monoCharWidthCache[fontSizePx]) return __monoCharWidthCache[fontSizePx];
  try {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.font = `${fontSizePx}px 'JetBrains Mono', monospace`;
    const w = ctx.measureText("0").width || fontSizePx * 0.6;
    __monoCharWidthCache[fontSizePx] = w;
    return w;
  } catch {
    return fontSizePx * 0.6; // разумная оценка, если canvas недоступен
  }
}

// Хвостовой идентификатор перед курсором — то, что человек сейчас
// печатает и для чего ищем подсказки. Точка сама по себе не входит
// в идентификатор (arr.fil → слово "fil", а не "arr.fil") — это и
// используется ниже, чтобы отличить "печатаю после точки" (метод)
// от "печатаю с чистого листа" (что угодно из словаря).
function getAutocompleteWord(value, cursorPos) {
  const before = value.slice(0, cursorPos);
  const m = /[a-zA-Z_$][\w$]*$/.exec(before);
  if (!m) return null;
  const start = cursorPos - m[0].length;
  const afterDot = start > 0 && value[start - 1] === ".";
  return { word: m[0], start, end: cursorPos, afterDot };
}

function getAutocompleteSuggestions(word, afterDot) {
  if (!word || word.length < 1) return [];
  const lower = word;
  const matches = JS_AUTOCOMPLETE_WORDS.filter((cand) => {
    if (afterDot) {
      // после точки предлагаем только "голые" имена методов/свойств
      // (без собственной точки в словаре) — сама точка уже напечатана
      if (cand.includes(".")) return false;
      return cand.startsWith(lower);
    }
    // с чистого листа — сравниваем с любым сегментом словарного слова,
    // чтобы "cons" находило console.log, а "log" тоже находило console.log
    return cand.split(".").some((seg) => seg.startsWith(lower));
  });
  return matches.slice(0, 6);
}

/**
 * Переиспользуемый редактор кода: подсветка синтаксиса (highlightJs),
 * номера строк слева, синхронный скролл гаттера/оверлея/textarea, и
 * автодополнение с выпадающим списком, позиционированным точно под
 * курсором. Полностью управляемый компонент (value/onChange), поэтому
 * встраивается в любой существующий экран без изменения его состояния.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {string} props.value
 * @param {(value: string) => void} props.onChange
 * @param {(e: KeyboardEvent) => void} [props.onKeyDown] - вызывается для клавиш, которые не обработал автокомплит (например, Ctrl+Enter для запуска кода)
 * @param {number} [props.minHeight]
 * @param {string} [props.placeholder]
 * @param {number} [props.fontSize]
 */
/**
 * Индикатор «выполняется» — короткая, приятная пауза перед показом
 * результата вместо мгновенной вспышки. Настоящее выполнение кода в
 * этом приложении синхронное и мгновенное (никакого реального сетевого
 * ожидания нет) — задержка искусственная, чисто для ощущения «код
 * компилируется/запускается», а не техническая необходимость.
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {string} [props.label]
 */
const RunningIndicator = memo(function RunningIndicator({ T, label = "Выполняется…" }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", fontSize: 13, color: T.textDim }}>
      <svg className="running-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="2.5" strokeLinecap="round">
        <path d="M12 2a10 10 0 0 1 10 10" />
      </svg>
      <span className="running-indicator">{label}</span>
    </div>

});

const CodeEditor = memo(function CodeEditor({ T, value, onChange, onKeyDown, minHeight = 160, placeholder, fontSize = 14.5, disabled = false, ariaLabel = "Редактор кода" }) {

  // чтобы не гонять парсер на каждое нажатие клавиши. checkSyntaxError
  // сама возвращает null, пока код валиден или пуст.
  const [syntaxError, setSyntaxError] = useState(null);

    const timer = setTimeout(() => setSyntaxError(checkSyntaxError(value)), 500);
    return () => clearTimeout(timer);

  const lineHeightPx = fontSize * 1.6;
  const lines = value.split("\n");
  const gutterWidth = Math.max(24, String(lines.length).length * 9 + 14);

  function syncScroll() {
    if (preRef.current && taRef.current) {
      preRef.current.scrollTop = taRef.current.scrollTop;
      preRef.current.scrollLeft = taRef.current.scrollLeft;

      gutterRef.current.scrollTop = taRef.current.scrollTop;

    const ctx = getAutocompleteWord(ta.value, cursorPos);
    if (!ctx || ctx.word.length < 1) { setAc(null); return; }
    const options = getAutocompleteSuggestions(ctx.word, ctx.afterDot);
    if (options.length === 0 || (options.length === 1 && options[0] === ctx.word)) { setAc(null); return; }

    const before = ta.value.slice(0, cursorPos);
    const row = (before.match(/\n/g) || []).length;
    const col = before.length - (before.lastIndexOf("\n") + 1);
    const charW = getMonoCharWidth(fontSize);
    const top = 8 + row * lineHeightPx + lineHeightPx - ta.scrollTop;
    const left = 12 + col * charW - ta.scrollLeft;

    if (!ac) return;

  // редакторе) и добавляет ещё один уровень (2 пробела) сразу после
  // открывающей скобки { [ ( — а если курсор стоит МЕЖДУ уже готовой
  // парой скобок ({|}), закрывающая скобка переносится на новую строку

  function handleEnter(e) {

    const closesMatch = opensBlock && (

      (charBefore === "[" && charAfter === "]") ||

      cursorPos = pos + 1 + innerIndent.length;

  // из textarea; при многострочном выделении отступает/снимает отступ

  // настоящем редакторе кода.
  function handleTab(e) {

    const end = ta.selectionEnd;

    const isMultiline = value.slice(start, end).includes("\n");

    if (!isMultiline) {

        setCursor(start - m[0].length);
      } else {
        onChange(value.slice(0, start) + "  " + value.slice(end));
        setCursor(start + 2);
      }

    }

    const lines = value.slice(blockStart, blockEnd).split("\n");

    const newLines = lines.map((line, i) => {

      const m = /^( {1,2})/.exec(line);

      if (i === 0) firstLineDelta = -m[0].length;

      <div style={{ display: "flex", width: "100%", minHeight, background: T.surfaceAlt, border: `1.5px solid ${T.border}`, borderRadius: 9, overflow: "hidden" }}>
        <div
          ref={gutterRef}
          aria-hidden="true"
          className="mono"
          style={{
            width: gutterWidth, flexShrink: 0, padding: "8px 0", textAlign: "right",
            color: T.textDim, opacity: 0.6, fontSize, lineHeight: `${lineHeightPx}px`,
            userSelect: "none", overflow: "hidden", borderRight: `1px solid ${T.border}`, background: T.surface,
          }}
        >
          {lines.map((_, i) => (
            <div key={i} style={{ paddingRight: 8, position: "relative" }}>
              {syntaxError?.line === i + 1 && (
                <span
                  title={syntaxError.message}
                  style={{
                    position: "absolute", left: 3, top: "50%", transform: "translateY(-50%)",
                    width: 6, height: 6, borderRadius: "50%", background: T.error,
                  }}
                />
              )}
              {i + 1}
            </div>
          ))}
        </div>
        <div style={{ position: "relative", flex: 1, minWidth: 0 }}>
          <pre
            ref={preRef}
            aria-hidden="true"
            style={{
              position: "absolute", inset: 0, margin: 0, padding: 8,
              fontSize, lineHeight: `${lineHeightPx}px`, fontFamily: "'JetBrains Mono', monospace",
              color: T.text, whiteSpace: "pre", overflow: "hidden", pointerEvents: "none",
            }}
            dangerouslySetInnerHTML={{ __html: highlightJs(value, T) + "\n" }}
          />
          <textarea
            ref={taRef}
            value={value}
            placeholder={placeholder}
            disabled={disabled}
            aria-label={ariaLabel}
            onChange={(e) => { onChange(e.target.value); requestAnimationFrame(recomputeAutocomplete); }}
            onScroll={syncScroll}
            onSelect={recomputeAutocomplete}
            onBlur={() => setTimeout(() => setAc(null), 120)}
            onKeyDown={handleKeyDown}
            spellCheck={false}
            style={{
              position: "relative", width: "100%", height: "100%", minHeight,
              background: "transparent", color: "transparent", caretColor: T.text,
              border: "none", padding: 8, fontSize, lineHeight: `${lineHeightPx}px`,
              fontFamily: "'JetBrains Mono', monospace", resize: "vertical", whiteSpace: "pre", overflowWrap: "normal",
            }}
          />
        </div>
      </div>
      {syntaxError && (
        <div
          className="mono"
          style={{
            marginTop: 4, fontSize: 11.5, color: T.error,
            display: "flex", alignItems: "center", gap: 5,
          }}
        >
          <AlertTriangle size={11} strokeWidth={2.2} style={{ flexShrink: 0 }} />
          Строка {syntaxError.line}: {syntaxError.message}
        </div>
      )}
      {ac && (
        <div
          style={{
            position: "absolute", top: ac.top, left: ac.left + gutterWidth, zIndex: 20,
            background: `${T.surface}EE`, backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)",
            border: `1px solid ${T.border}`, borderRadius: 8,
            boxShadow: "0 6px 20px rgba(0,0,0,0.25)", overflow: "hidden", minWidth: 140,
          }}
        >
          {ac.options.map((opt, i) => (
            <div
              key={opt}
              className="mono"
              onMouseDown={(e) => { e.preventDefault(); acceptSuggestion(i); }}
              style={{
                padding: "9px 12px", fontSize: 13, cursor: "pointer",
                background: i === ac.active ? `${T.accent}22` : "transparent",
                color: i === ac.active ? T.accent : T.text,
              }}
            >
              {opt}
            </div>
          ))}
        </div>
      )}
    </div>
  );
});

/**

 * зависимости от correct/wrong. Теперь глаза и рот действительно другие

 *                  специально НЕ грустные, см. философию фидбека выше),
 *                  но рот — мягкая сомкнутая улыбка, а не "ура"
 *   - "celebrate" — как "correct", плюс две маленькие звёздочки-искры
 *                  у макушки (открытие достижения/уровня)
 * Один и тот же силуэт тела/антенны во всех вариантах — это всё ещё

/**

// Реплики Байта на главном экране — короткое "сопровождение" вместо
// безликого подзаголовка. Набор зависит от состояния пользователя
// (новичок / есть серия дней / высокий прогресс / просто вернулся),
// а конкретная фраза внутри набора выбирается детерминированно по
// дню — та же идея, что и в MASCOT_CORRECT/MASCOT_WRONG (стабильно в
// рамках дня, не мигает при каждом ре-рендере, но не одна и та же
// реплика неделями подряд).
const MASCOT_HOME_NEW = [
  "Погнали — я рядом на каждом шаге.",
  "Первый вопрос всегда самый простой. Начнём?",
  "Ты и я против синтаксиса JS. Начинаем.",
];
const MASCOT_HOME_STREAK = [
  "Серия дней растёт — я слежу за этим внимательнее, чем ты думаешь.",
  "Каждый день понемногу — так это и работает.",
  "Не разрывай серию ради меня. Ну ладно, ради себя тоже сойдёт.",
];
const MASCOT_HOME_HIGH_PROGRESS = [
  "Ты почти у цели — я нервничаю сильнее тебя.",
  "Ещё немного, и курс твой полностью.",
  "Финишная прямая. Я в предвкушении.",
];
const MASCOT_HOME_RETURNING = [
  "Рад снова видеть — продолжим с того же места.",
  "С возвращением. Помню, на чём остановились.",
  "Ты вернулся — значит, идём дальше.",
];

/**
 * Выбирает реплику Байта для главного экрана в зависимости от прогресса
 * пользователя. seed — обычно текущая дата (YYYY-MM-DD), чтобы фраза
 * была стабильна в рамках дня, но со временем менялась.
 * @param {{hasStarted: boolean, streak: {count: number}|null, overallPct: number}} state
 */
function homeCompanionLine({ hasStarted, streak, overallPct }, seed) {
  if (!hasStarted) {
    const pool = MASCOT_HOME_NEW;
    return pool[hashStr(seed) % pool.length];
  }
  if (overallPct >= 80) {
    const pool = MASCOT_HOME_HIGH_PROGRESS;
    return pool[hashStr(seed) % pool.length];
  }
  if (streak && streak.count >= 3) {
    const pool = MASCOT_HOME_STREAK;
    return pool[hashStr(seed) % pool.length];
  }
  const pool = MASCOT_HOME_RETURNING;
  return pool[hashStr(seed) % pool.length];
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

/**
 * Реплика маскота сразу после ответа — короткая, тёплая, без осуждения
 * при ошибке. Персонаж один и тот же (🤖 Байт) в любом настроении —
 * тон меняет само сообщение и цвет пузыря, а не эмодзи персонажа
 * (иначе это читалось бы как два разных существа, а не один герой).
 *
 * @param {Object} props
 * @param {ThemeTokens} props.T
 * @param {"correct"|"wrong"} props.status
 * @param {string} props.seed - обычно current.id, для стабильного выбора реплики
 */
const Mascot = memo(function Mascot({ T, status, seed }) {
  const isCorrect = status === "correct";
  const pool = isCorrect ? MASCOT_CORRECT : MASCOT_WRONG;
  const message = pool[hashStr(seed + status) % pool.length];
  const moodColor = isCorrect ? T.success : T.accent;
  return (
    <div style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 12 }}>
      <div
        style={{
          width: 36, height: 36, borderRadius: "50%", flexShrink: 0,
          background: `${moodColor}1A`, border: `1.5px solid ${moodColor}55`,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}
      >
        <MascotIcon size={20} color={moodColor} mood={status} />
      </div>
      <div
        style={{
          background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 12, borderTopLeftRadius: 4,
          padding: "8px 12px", fontSize: 13, lineHeight: 1.5, color: T.text, maxWidth: 420,
        }}
      >
        <div style={{ fontSize: 10, fontWeight: 700, color: T.textDim, marginBottom: 2, textTransform: "uppercase", letterSpacing: "0.04em" }}>
          {MASCOT_NAME}
        </div>
        {message}
      </div>
    </div>
  );
});

// Ранг — это отдельная, самостоятельная прогрессия по очкам опыта,
// не путать со «сложностью» темы (LEVELS: 🟢🟡🔴). Порог для достижения
// ранга r растёт квадратично (30 * r * (r-1)), поэтому каждый следующий
// ранг требует больше XP, чем предыдущий.
function xpThresholdForRank(rank) {
  return 30 * rank * (rank - 1);
}
function rankForXp(xp) {
  let rank = 1;
  while (xpThresholdForRank(rank + 1) <= xp) rank++;
  return rank;
}

// Именованный титул ранга для dashboard'а — числовой rank сам по себе
// ничего не говорит новичку. Границы подобраны под собственную заявку
// курса "от Beginner до Junior" (см. tagline в шапке), а не выдуманы
// произвольно. Формула xpThresholdForRank не имеет потолка, поэтому
// для очень высоких рангов используется общий верхний титул.
function rankTitle(rank) {
  if (rank <= 2) return "Новичок";
  if (rank <= 5) return "Начинающий JS";
  if (rank <= 9) return "Junior JS";
  return "Уверенный Junior JS";
}

// Приветствие по времени суток — локальное время устройства, не сервера.
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 5) return "Доброй ночи";
  if (h < 12) return "Доброе утро";
  if (h < 18) return "Добрый день";
  return "Добрый вечер";
}

/**
 * Безопасная обёртка над window.storage: не даёт коду упасть, если
 * запустить его вне Claude.ai (например, скопировав в обычный React-проект),
 * где window.storage просто не существует. Специально НЕ откатывается на
 * localStorage — в артефактах Claude.ai это запрещено и может кинуть
 * SecurityError в песочнице; при отсутствии API прогресс просто не
 * сохраняется между сессиями, вместо падения приложения.
 */
const safeStorage = {
  async get(key) {
    try {
      if (typeof window === "undefined" || !window.storage) return null;
      return await window.storage.get(key);
    } catch {
      return null;
    }
  },
  set(key, value) {
    try {
      if (typeof window === "undefined" || !window.storage) return Promise.resolve(null);
      return window.storage.set(key, value).catch(() => null);
    } catch {
      return Promise.resolve(null);
    }
  },
};

/**
 * Резервное копирование прогресса — весь прогресс живёт только в
 * window.storage конкретного браузера; очистка кэша или смена
 * устройства стирает всё безвозвратно и без предупреждения. Экспорт/
 * импорт одним JSON-файлом — простая, полностью клиентская защита от
 * этого: скачивание через Blob + <a download> (тот же приём, что и у
 * PNG-сертификата), импорт — через обычный <input type="file"> и
 * FileReader, без единого сервера.
 */
const PROGRESS_EXPORT_KEYS = [
  STORAGE_KEY, XP_KEY, ACHIEVEMENTS_KEY, STREAK_KEY, HISTORY_KEY,
  CERT_NAME_KEY, THEME_KEY, SOUND_KEY, SANDBOX_KEY,
];

/**
 * Собирает весь прогресс в один сериализуемый объект — отдельно от
 * механики скачивания (Blob/URL.createObjectURL/<a>), которая только
 * в настоящем браузере и не имеет смысла тестировать саму по себе
 * (jsdom, например, не поддерживает URL.createObjectURL вообще).
 */
async function buildProgressExportPayload() {
  const data = {};
  for (const key of PROGRESS_EXPORT_KEYS) {
    const res = await safeStorage.get(key);
    if (res && res.value !== undefined) data[key] = res.value;
  }
  return { app: "js.track", version: 1, exportedAt: new Date().toISOString(), data };
}

async function exportProgressData() {
  const payload = await buildProgressExportPayload();
  if (typeof URL === "undefined" || typeof URL.createObjectURL !== "function") {
    return; // очень старый/нестандартный браузер — молча не скачиваем, а не падаем
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.download = `js-track-progress-${new Date().toISOString().slice(0, 10)}.json`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

/**
 * @param {File} file
 * @throws {Error} с человекочитаемым сообщением, если файл повреждён
 * или не похож на экспорт js.track — вызывающий код должен поймать и
 * показать e.message пользователю, а не молча проглотить ошибку.
 */
async function importProgressData(file) {
  const text = await file.text();
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    throw new Error("Файл повреждён или это не JSON.");
  }
  if (!parsed || parsed.app !== "js.track" || typeof parsed.data !== "object" || parsed.data === null) {
    throw new Error("Это не похоже на файл прогресса js.track.");
  }
  for (const [key, value] of Object.entries(parsed.data)) {
    // Импортируем только ключи ИЗ НАШЕГО списка — защита от того, чтобы
    // случайно записать в storage что-то постороннее, даже если файл
    // прошёл базовую проверку выше (например, был подделан вручную).
    if (PROGRESS_EXPORT_KEYS.includes(key)) {
      await safeStorage.set(key, value);
    }
  }
}

/**
 * Создаёт свежий «живой» объект для DOM-песочницы конкретного вопроса.
 * @param {"addEventListener"|"style"|"textContent"|"classList"} kind
 * @returns {Object}
 */
function makeLiveObject(kind) {
  if (kind === "addEventListener") {
    return { handlers: {}, addEventListener(event, cb) { this.handlers[event] = cb; } };
  }
  if (kind === "style") {
    return { style: {} };
  }
  if (kind === "textContent") {
    return { textContent: "" };
  }
  if (kind === "classList") {
    return {
      classList: {
        list: [],
        toggle(cls) {
          const i = this.list.indexOf(cls);
          if (i >= 0) this.list.splice(i, 1);
          else this.list.push(cls);
        },
      },
    };
  }
  return {};
}

/**
 * Корневой компонент приложения: хранит весь стейт курса
 * (текущий вопрос, ответы, тему, streak) и рендерит шапку,
 * сайдбар тем и основную карточку вопроса/теории/итогов.
 */
/**
 * ErrorBoundary — ловит ошибки в дочерних компонентах и показывает fallback
 * вместо краша всего приложения.
 *
 * Палитра здесь жёстко зашита (не берётся из T/themeMode), а не забыта:
 * ErrorBoundary оборачивает App снаружи, и если ошибка произошла как раз
 * в вычислении темы или рядом с ним, полагаться на состояние сломавшегося
 * дерева для рендера самого fallback-а рискованно.
 *
 * Важно: ловит только ошибки рендера, не ошибки в обработчиках событий
 * (onClick и т.п.) — большая часть логики приложения именно там.
 */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught:", error, errorInfo);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div
          style={{
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            minHeight: "100vh",
            padding: 24,
            background: "#10141D",
            color: "#E8EDF5",
            fontFamily: "'Inter', system-ui, sans-serif",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 48, marginBottom: 16 }}>😵</div>
          <h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 8 }}>
            Что-то пошло не так
          </h2>
          <p style={{ fontSize: 14, color: "#8592A6", maxWidth: 400 }}>
            Произошла ошибка в приложении. Попробуй обновить страницу.
          </p>
          <div style={{ marginTop: 20, display: "flex", gap: 12 }}>
            <button
              onClick={() => window.location.reload()}
              style={{
                background: "#5C82F0",
                color: "#fff",
                border: "none",
                borderRadius: 8,
                padding: "8px 20px",
                fontSize: 13,
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              Обновить страницу
            </button>
          </div>
        </div>
      );
    }

    return this.props.children;
  }
}

/**
 * Celebration — конфетти при 100% прохождении курса.
 * Самодельная CSS-версия без внешних зависимостей, уважает
 * prefers-reduced-motion.
 *
 * Важно: все хуки вызываются безусловно, до единственного раннего
 * return — иначе при переключении active (false → true, то есть в тот
 * самый момент, когда пользователь и доходит до 100%) React бросил бы
 * "Rendered more hooks than during the previous render".
 *
 * pieces пересчитывается на каждое переключение active — так салют
 * можно переиграть повторно (например, после сброса и повторного
 * прохождения курса), а не только один раз за сессию.
 */
/**
 * Короткий синтезированный «динь» победы — восходящее мажорное трезвучие
 * (до-ми-соль), без единого внешнего аудиофайла: чистые синусоиды через
 * Web Audio API, ~0.4с, негромко. Если Web Audio недоступен (старый
 * браузер, ограничения окружения) — тихо ничего не делает: конфетти и
 * медаль всё равно покажутся, звук — необязательное дополнение к ним.
 */
/**
 * Короткий, ненавязчивый «тик» на обычный правильный ответ — самое
 * частое действие во всём приложении (десятки раз за прохождение
 * курса), но раньше здесь не было НИКАКОГО звука вообще: только
 * playVictoryChime (прохождение темы) и playLevelUnlockFanfare
 * (уровень) — оба редкие события. Один и тот же звук 40+ раз подряд
 * быстро бы примелькался, поэтому высота тона каждый раз слегка
 * (±до полутона) случайно смещается — не отличить одну ноту от другой
 * специально не получится, но звучит чуть живее, чем метроном.
 */
/**
 * Озвучка английских терминов в уроках через встроенный в браузер
 * Web Speech API (SpeechSynthesis) — без единого аудиофайла и без
 * сети во время работы приложения. Качество голоса зависит от
 * устройства пользователя (это ограничение платформы, не наше) — но
 * выбираем ЛУЧШИЙ доступный голос вместо системного по умолчанию,
 * который обычно звучит куда более "роботизированно".
 *
 * Не для каждого термина в уроке есть смысл озвучивать — многие
 * названия чисто русские ("переменная", "цикл", "объект"), там нечего
 * произносить по-английски. TERM_PRONUNCIATIONS — явная таблица
 * только для терминов с настоящим английским/техническим содержанием,
 * с "очищенным" текстом для произношения (без кириллических пояснений

 */
const TERM_PRONUNCIATIONS = {

  "DOM": "D O M",

  "Object.freeze(obj)": "Object dot freeze",
  "Object.keys(obj)": "Object dot keys",
  "Object.values(obj)": "Object dot values",
  "Promise (промис)": "Promise",
  "addEventListener": "add event listener",
  "async": "async",
  "await": "await",
  "camelCase": "camel case",
  "classList.toggle()": "class list dot toggle",
  "confirm()": "confirm",
  "console.log()": "console dot log",
  "const": "const",
  "extends": "extends",
  "fetch": "fetch",
  "filter": "filter",
  "for...in": "for in",
  "for...of": "for of",
  "forEach": "for each",
  "immutable (неизменяемость)": "immutable",
  "let": "let",
  "map": "map",
  "nullish coalescing (??)": "nullish coalescing",
  "optional chaining (?.)": "optional chaining",
  "push/pop": "push, pop",
  "querySelector": "query selector",
  "reduce": "reduce",
  "rest-параметр (...)": "rest parameter",
  "slice": "slice",
  "sort": "sort",
  "splice": "splice",
  "spread (...)": "spread",
  "spread у объектов { ...obj }": "spread",
  "style.backgroundColor": "style dot background color",

  "this": "this",
  "undefined / null": "undefined, null",
  "var": "var",
  "класс (class)": "class",

  "обработчик события (event listener)": "event listener",
  "префикс is/has/can для булевых значений": "is, has, can",
  "строка (string)": "string",
  "шаблонная строка (template literal)": "template literal",
  "экземпляр (instance)": "instance",
